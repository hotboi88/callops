<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta id="vp" name="viewport" content="width=1280"/>
  <title>CallOps — Call Center Manager</title>

  <!-- Phones get a device-width viewport so the mobile app renders 1:1;
       desktop keeps the fixed 1280 layout. -->
  <script>
    (function () {
      var vp = document.getElementById("vp");
      var mq = window.matchMedia("(max-width: 768px)");
      function setVP() {
        vp.setAttribute("content", mq.matches
          ? "width=device-width, initial-scale=1, viewport-fit=cover"
          : "width=1280");
      }
      setVP();
      if (mq.addEventListener) mq.addEventListener("change", setVP);
      else window.addEventListener("resize", setVP);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>

  <style>
/* =============================================
   Call Center Manager — design tokens & base
   ============================================= */

:root,
[data-theme="dark"] {
  --bg-base: #08080a;
  --bg-elev: #0f0f12;
  --bg-panel: #131317;
  --bg-panel-2: #1a1a20;
  --bg-hover: #1d1d23;
  --bg-input: #121217;

  --border: #232329;
  --border-strong: #2d2d35;
  --border-subtle: #1a1a1f;

  --text: #f4f4f5;
  --text-2: #a1a1aa;
  --text-3: #71717a;
  --text-4: #52525b;

  --accent: #b4f461;            /* lime — primary / money / brand */
  --accent-ink: #0a1a00;
  --accent-soft: rgba(180, 244, 97, 0.12);
  --accent-line: rgba(180, 244, 97, 0.35);

  --status-pending-bg: rgba(161, 161, 170, 0.12);
  --status-pending-fg: #a1a1aa;
  --status-pending-ring: rgba(161, 161, 170, 0.25);

  --status-transfer-bg: rgba(96, 165, 250, 0.14);
  --status-transfer-fg: #93c5fd;
  --status-transfer-ring: rgba(96, 165, 250, 0.35);

  --status-confirmed-bg: rgba(52, 211, 153, 0.14);
  --status-confirmed-fg: #6ee7b7;
  --status-confirmed-ring: rgba(52, 211, 153, 0.35);

  --status-ia-bg: rgba(167, 139, 250, 0.16);
  --status-ia-fg: #c4b5fd;
  --status-ia-ring: rgba(167, 139, 250, 0.4);

  --status-dnc-bg: rgba(251, 113, 133, 0.14);
  --status-dnc-fg: #fda4af;
  --status-dnc-ring: rgba(251, 113, 133, 0.35);

  --status-bad-bg: rgba(120, 113, 108, 0.18);
  --status-bad-fg: #a8a29e;
  --status-bad-ring: rgba(120, 113, 108, 0.35);

  --money-pos: #b4f461;
  --money-spiff: #fbbf24;
  --money-tl: #c4b5fd;

  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-2: 0 8px 24px rgba(0, 0, 0, 0.45);
  --shadow-pop: 0 16px 48px rgba(0, 0, 0, 0.6);

  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;
}

[data-theme="light"] {
  --bg-base: #f6f6f4;
  --bg-elev: #ffffff;
  --bg-panel: #ffffff;
  --bg-panel-2: #fafaf9;
  --bg-hover: #f1f1ef;
  --bg-input: #ffffff;

  --border: #e5e5e0;
  --border-strong: #d4d4cf;
  --border-subtle: #ececea;

  --text: #18181b;
  --text-2: #52525b;
  --text-3: #71717a;
  --text-4: #a1a1aa;

  --accent: #4d7c0f;
  --accent-ink: #ffffff;
  --accent-soft: rgba(77, 124, 15, 0.1);
  --accent-line: rgba(77, 124, 15, 0.3);

  --status-pending-bg: rgba(82, 82, 91, 0.08);
  --status-pending-fg: #52525b;
  --status-pending-ring: rgba(82, 82, 91, 0.2);

  --status-transfer-bg: rgba(37, 99, 235, 0.1);
  --status-transfer-fg: #1d4ed8;
  --status-transfer-ring: rgba(37, 99, 235, 0.25);

  --status-confirmed-bg: rgba(5, 150, 105, 0.1);
  --status-confirmed-fg: #047857;
  --status-confirmed-ring: rgba(5, 150, 105, 0.25);

  --status-ia-bg: rgba(124, 58, 237, 0.1);
  --status-ia-fg: #6d28d9;
  --status-ia-ring: rgba(124, 58, 237, 0.3);

  --status-dnc-bg: rgba(225, 29, 72, 0.1);
  --status-dnc-fg: #be123c;
  --status-dnc-ring: rgba(225, 29, 72, 0.25);

  --status-bad-bg: rgba(120, 113, 108, 0.12);
  --status-bad-fg: #57534e;
  --status-bad-ring: rgba(120, 113, 108, 0.3);

  --money-pos: #166534;
  --money-spiff: #b45309;
  --money-tl: #6d28d9;

  --shadow-1: 0 1px 2px rgba(20, 20, 18, 0.06);
  --shadow-2: 0 8px 24px rgba(20, 20, 18, 0.08);
  --shadow-pop: 0 16px 48px rgba(20, 20, 18, 0.18);
}

* { box-sizing: border-box; }

html, body, #root {
  height: 100%;
  margin: 0;
}

body {
  background: var(--bg-base);
  color: var(--text);
  font-family: "Geist", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-feature-settings: "ss01", "cv11";
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-size: 13px;
  line-height: 1.45;
  letter-spacing: -0.005em;
}

.mono {
  font-family: "Geist Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-feature-settings: "ss01", "cv02";
  letter-spacing: -0.01em;
}

button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; color: inherit; }

::selection { background: var(--accent-soft); color: var(--text); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; border: 2px solid var(--bg-base); }
::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

/* =============================================
   Layout
   ============================================= */
.app-shell {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 14px;
  height: 48px;
  padding: 0 18px;
  border-bottom: 1px solid var(--border-subtle);
  background: var(--bg-base);
  position: sticky;
  top: 0;
  z-index: 30;
}

/* Top-level nav (Campaigns / Admin tools) */
.top-nav {
  display: flex;
  align-items: center;
  gap: 2px;
  margin-left: 6px;
  padding-left: 14px;
  border-left: 1px solid var(--border-subtle);
  height: 24px;
}
.top-tab {
  padding: 5px 10px;
  font-size: 12.5px;
  color: var(--text-3);
  background: transparent;
  border: 0;
  border-radius: 6px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
}
.top-tab:hover { background: var(--bg-hover); color: var(--text); }
.top-tab.active { color: var(--text); background: var(--bg-hover); }

/* Impersonation banner */
.imp-banner {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 18px;
  background: linear-gradient(90deg, rgba(251, 191, 36, 0.08), rgba(251, 191, 36, 0.04));
  border-bottom: 1px solid rgba(251, 191, 36, 0.3);
  color: var(--money-spiff);
  font-size: 12px;
  /* Sits between topbar and tabs row, non-sticky so it doesn't overlap either. */
}
.imp-banner .dot {
  width: 6px; height: 6px;
  border-radius: 999px;
  background: var(--money-spiff);
  box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.2);
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: 13px;
  letter-spacing: -0.01em;
  cursor: pointer;
}

.brand-mark {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: var(--accent);
  color: var(--accent-ink);
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 12px;
  font-family: "Geist Mono", monospace;
}

.crumbs {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-3);
  font-size: 12.5px;
}
.crumbs .sep { color: var(--text-4); }
.crumbs button {
  background: none;
  border: 0;
  color: var(--text-2);
  padding: 4px 6px;
  border-radius: 4px;
  font-size: 12.5px;
}
.crumbs button:hover { background: var(--bg-hover); color: var(--text); }
.crumbs .here { color: var(--text); font-weight: 500; }

.topbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-3);
  font-size: 12px;
}

.user-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 10px 4px 4px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--bg-elev);
  color: var(--text-2);
}

.user-chip .avatar {
  width: 22px; height: 22px;
  border-radius: 999px;
  background: linear-gradient(135deg, #b4f461 0%, #65a30d 100%);
  color: #0a1a00;
  display: grid; place-items: center;
  font-size: 10px;
  font-weight: 700;
  font-family: "Geist Mono", monospace;
}

/* =============================================
   Buttons
   ============================================= */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-elev);
  color: var(--text);
  font-size: 12.5px;
  font-weight: 500;
  height: 30px;
  transition: background 120ms, border-color 120ms;
  white-space: nowrap;
}
.btn:hover { background: var(--bg-hover); border-color: var(--border-strong); }
.btn:active { transform: translateY(0.5px); }

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}
.btn-primary:hover { background: var(--accent); border-color: var(--accent); filter: brightness(1.08); }

.btn-ghost {
  background: transparent;
  border-color: transparent;
  color: var(--text-2);
}
.btn-ghost:hover { background: var(--bg-hover); color: var(--text); border-color: transparent; }

.btn-danger {
  color: var(--status-dnc-fg);
  border-color: var(--status-dnc-ring);
  background: transparent;
}
.btn-danger:hover { background: var(--status-dnc-bg); }

.btn-sm { height: 26px; padding: 4px 9px; font-size: 12px; }
.btn-lg { height: 36px; padding: 8px 16px; font-size: 13px; }

.icon-btn {
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-elev);
  color: var(--text-2);
}
.icon-btn:hover { background: var(--bg-hover); color: var(--text); }
.icon-btn svg { width: 14px; height: 14px; }

/* =============================================
   Pills / Badges
   ============================================= */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 20px;
  padding: 0 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: -0.01em;
  border: 1px solid transparent;
  white-space: nowrap;
}
.pill .dot {
  width: 5px; height: 5px;
  border-radius: 999px;
  background: currentColor;
  opacity: 0.95;
}

.pill-pending  { background: var(--status-pending-bg);   color: var(--status-pending-fg);   border-color: var(--status-pending-ring); }
.pill-transfer { background: var(--status-transfer-bg);  color: var(--status-transfer-fg);  border-color: var(--status-transfer-ring); }
.pill-confirmed{ background: var(--status-confirmed-bg); color: var(--status-confirmed-fg); border-color: var(--status-confirmed-ring); }
.pill-ia       { background: var(--status-ia-bg);        color: var(--status-ia-fg);        border-color: var(--status-ia-ring); }
.pill-dnc      { background: var(--status-dnc-bg);       color: var(--status-dnc-fg);       border-color: var(--status-dnc-ring); }
.pill-bad      { background: var(--status-bad-bg);       color: var(--status-bad-fg);       border-color: var(--status-bad-ring); }

.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 18px;
  padding: 0 6px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  background: var(--bg-panel-2);
  color: var(--text-3);
  border: 1px solid var(--border-subtle);
  white-space: nowrap;
}
.tag-tl { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
.tag-admin { color: var(--money-tl); border-color: var(--status-ia-ring); background: var(--status-ia-bg); }
.tag-inactive { color: var(--text-4); }

/* =============================================
   Inputs
   ============================================= */
.input, .select {
  height: 30px;
  padding: 0 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-input);
  color: var(--text);
  font-size: 12.5px;
  width: 100%;
  transition: border-color 120ms, background 120ms;
}
.input:focus, .select:focus {
  outline: none;
  border-color: var(--accent-line);
  background: var(--bg-elev);
}
.input::placeholder { color: var(--text-4); }
textarea.input { height: auto; padding: 8px 10px; resize: vertical; min-height: 60px; font-size: 12.5px; }

.field {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.field label {
  font-size: 11px;
  color: var(--text-3);
  font-weight: 500;
  letter-spacing: 0.01em;
}

.field-money {
  position: relative;
}
.field-money::before {
  content: "$";
  position: absolute;
  left: 9px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-4);
  font-family: "Geist Mono", monospace;
  font-size: 12px;
  pointer-events: none;
}
.field-money .input { padding-left: 20px; font-family: "Geist Mono", monospace; }

.search-wrap {
  position: relative;
  display: flex;
  align-items: center;
  flex: 1;
  max-width: 320px;
}
.search-wrap svg {
  position: absolute;
  left: 10px;
  width: 13px; height: 13px;
  color: var(--text-4);
  pointer-events: none;
}
.search-wrap .input { padding-left: 30px; }

/* =============================================
   Cards / Panels
   ============================================= */
.card {
  background: var(--bg-panel);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius);
}

.section-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-bottom: 12px;
}
.section-head h2 {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.section-head .sub {
  font-size: 12px;
  color: var(--text-3);
}

/* =============================================
   Tab bar
   ============================================= */
.tabs {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 0 18px;
  border-bottom: 1px solid var(--border-subtle);
  background: var(--bg-base);
  position: sticky;
  top: 48px;
  z-index: 20;
}
.tab {
  position: relative;
  padding: 10px 12px;
  font-size: 12.5px;
  color: var(--text-3);
  background: transparent;
  border: 0;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
}
.tab:hover { color: var(--text); }
.tab .tab-count {
  font-size: 11px;
  font-family: "Geist Mono", monospace;
  color: var(--text-4);
  background: var(--bg-panel-2);
  padding: 1px 5px;
  border-radius: 4px;
}
.tab.active {
  color: var(--text);
}
.tab.active::after {
  content: "";
  position: absolute;
  left: 8px; right: 8px;
  bottom: -1px;
  height: 2px;
  background: var(--text);
  border-radius: 2px 2px 0 0;
}

/* =============================================
   Tables
   ============================================= */
.table-wrap {
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--bg-panel);
}
.table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
}
.table thead th {
  position: sticky;
  top: 0;
  background: var(--bg-panel-2);
  color: var(--text-3);
  text-align: left;
  font-weight: 500;
  font-size: 11px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border-subtle);
  white-space: nowrap;
}
.table tbody td {
  padding: 7px 10px;
  border-bottom: 1px solid var(--border-subtle);
  color: var(--text);
  vertical-align: middle;
  white-space: nowrap;
}
.table tbody tr:last-child td { border-bottom: 0; }
.table tbody tr:hover { background: var(--bg-hover); }
.table tbody tr.clickable { cursor: pointer; }
.table tfoot td {
  padding: 8px 10px;
  background: var(--bg-panel-2);
  border-top: 1px solid var(--border);
  font-weight: 600;
  font-size: 12px;
}

.table .num,
.table .money {
  font-family: "Geist Mono", "JetBrains Mono", monospace;
  text-align: right;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}
.table .num-l {
  font-family: "Geist Mono", "JetBrains Mono", monospace;
  font-variant-numeric: tabular-nums;
}
/* td containing a .money/.num span should right-align the inline content */
.table tbody td:has(> .money),
.table tbody td:has(> .num),
.table tfoot td:has(> .money),
.table tfoot td:has(> .num) {
  text-align: right;
}

/* Status column: pull pill flush left so it visually aligns with "STATUS" header */
.table tbody td > button > .pill {
  margin-left: -8px;
}

.money-pos { color: var(--money-pos); }
.money-spiff { color: var(--money-spiff); }
.money-tl { color: var(--money-tl); }
.money-muted { color: var(--text-4); }
.money-bold { font-weight: 600; color: var(--text); }

.row-warn td { background: rgba(251, 113, 133, 0.04); }
.row-good td { background: rgba(180, 244, 97, 0.04); }

th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--text); }
th.sortable .arrow { font-size: 9px; opacity: 0.5; margin-left: 4px; }

/* =============================================
   Stat cards (KPI tiles)
   ============================================= */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
}
.kpi {
  background: var(--bg-panel);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius);
  padding: 14px 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.kpi .kpi-label {
  font-size: 11px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 500;
}
.kpi .kpi-value {
  font-family: "Geist Mono", monospace;
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.025em;
  line-height: 1.1;
  color: var(--text);
}
.kpi .kpi-sub {
  font-size: 11.5px;
  color: var(--text-3);
  margin-top: 2px;
}
.kpi.kpi-accent .kpi-value { color: var(--money-pos); }
.kpi.kpi-spiff .kpi-value { color: var(--money-spiff); }
.kpi.kpi-tl .kpi-value { color: var(--money-tl); }

/* =============================================
   Modal
   ============================================= */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(4px);
  display: grid;
  place-items: center;
  z-index: 50;
  animation: fade-in 120ms ease-out;
}
[data-theme="light"] .modal-overlay { background: rgba(40, 40, 35, 0.4); }

.modal {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-pop);
  width: min(620px, 92vw);
  max-height: 90vh;
  overflow: auto;
  animation: pop-in 160ms cubic-bezier(.2,.7,.3,1);
}
.modal-head {
  display: flex; align-items: center;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border-subtle);
}
.modal-head h3 {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
}
.modal-head .close {
  margin-left: auto;
}
.modal-body { padding: 16px 18px; }
.modal-foot {
  padding: 12px 18px;
  border-top: 1px solid var(--border-subtle);
  display: flex; justify-content: flex-end; gap: 8px;
  background: var(--bg-panel-2);
}

@keyframes fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes pop-in {
  from { opacity: 0; transform: translateY(6px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* =============================================
   Popover (status edit menu)
   ============================================= */
.popover {
  position: absolute;
  z-index: 60;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-pop);
  padding: 4px;
  min-width: 160px;

// Utilities: money formatting, date helpers, commission recompute, ISO weeks
// Exposed as window.U.*

(function () {
  const U = {};

  U.fmtMoney = function (n, opts) {
    opts = opts || {};
    const v = Number(n || 0);
    if (v === 0 && !opts.showZero) return "—";
    const sign = v < 0 ? "-" : "";
    const abs = Math.abs(v);
    const s = abs.toLocaleString("en-US", {
      minimumFractionDigits: opts.decimals ?? 0,
      maximumFractionDigits: opts.decimals ?? 0,
    });
    return sign + "$" + s;
  };

  U.fmtMoneyFull = function (n) {
    const v = Number(n || 0);
    return v.toLocaleString("en-US", {
      style: "currency",
      currency: "USD",
      minimumFractionDigits: 0,
      maximumFractionDigits: 0,
    });
  };

  U.fmtNum = function (n, opts) {
    opts = opts || {};
    const v = Number(n || 0);
    if (v === 0 && opts.dashZero) return "—";
    return v.toLocaleString("en-US");
  };

  U.fmtPct = function (n) {
    if (!isFinite(n)) return "—";
    return Math.round(n * 100) + "%";
  };

  // ---- Date helpers ----
  U.parseDate = function (s) {
    if (!s) return null;
    const [y, m, d] = String(s).split("-").map(Number);
    const dt = new Date(y, m - 1, d);
    return isNaN(dt.getTime()) ? null : dt;
  };
  U.dayStr = function (d) {
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const dd = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + dd;
  };
  U.shortDate = function (s) {
    const d = U.parseDate(s); if (!d) return "";
    return String(d.getMonth() + 1).padStart(2, "0") + "/" +
           String(d.getDate()).padStart(2, "0") + "/" +
           String(d.getFullYear()).slice(2);
  };
  const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  U.dayOfWeek = function (s) { const d = U.parseDate(s); return d ? DOW[d.getDay()] : ""; };
  U.dayOfWeekFull = function (s) {
    const map = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    const d = U.parseDate(s); return d ? map[d.getDay()] : "";
  };

  // ISO Week number
  U.weekNumber = function (s) {
    const d = U.parseDate(s); if (!d) return 0;
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const dayNum = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil((((t - yearStart) / 86400000) + 1) / 7);
  };
  U.weekLabel = function (s) { return "WK" + U.weekNumber(s); };

  // ---- IA tier recompute for a given campaign + all its leads ----
  U.recomputeCommissions = function (campaign, leads) {
    // Reset commissions for this campaign's leads, then recompute per-day-per-agent IA tiers.
    const byKey = {};
    leads.forEach(l => {
      if (l.campaign_id !== campaign.id) return;
      if (l.status === "transfer")   l.client_commission = campaign.rate_transfer;
      else if (l.status === "confirmed") l.client_commission = campaign.rate_confirmed;
      else if (l.status === "ia")    l.client_commission = 0; // computed below
      else l.client_commission = 0;
      if (l.status === "ia") {
        const k = l.agent_id + "|" + l.date;
        (byKey[k] ||= []).push(l);
      }
    });
    Object.values(byKey).forEach(arr => {
      arr.sort((a, b) => (a.seq ?? 0) - (b.seq ?? 0));
      arr.forEach((l, idx) => {
        if (idx === 0) l.client_commission = campaign.rate_ia;
        else if (idx === 1) l.client_commission = Math.max(0, campaign.ia_tier_2 - campaign.rate_ia);
        else if (idx === 2) l.client_commission = Math.max(0, campaign.ia_tier_3 - campaign.ia_tier_2);
        else l.client_commission = 0;
      });
    });
  };

  // Status labels + order
  U.STATUS_ORDER = ["pending","transfer","confirmed","ia","dnc","bad"];
  U.STATUS_LABEL = {
    pending: "Pending", transfer: "Transfer", confirmed: "Confirmed",
    ia: "IA", dnc: "DNC", bad: "Bad"
  };
  U.statusPill = function (status) {
    return "pill pill-" + status;
  };

  // Period helpers
  U.startOfWeek = function (d) {
    // Mon-Sun week (matches typical work week display)
    const out = new Date(d);
    const day = (out.getDay() + 6) % 7; // 0..6 from Monday
    out.setDate(out.getDate() - day);
    out.setHours(0, 0, 0, 0);
    return out;
  };
  U.endOfWeek = function (d) {
    const s = U.startOfWeek(d);
    const e = new Date(s);
    e.setDate(e.getDate() + 6);
    return e;
  };

  U.inRange = function (dateStr, startStr, endStr) {
    if (!dateStr) return false;
    return dateStr >= startStr && dateStr <= endStr;
  };

  U.relTime = function (iso) {
    if (!iso) return "—";
    const t = new Date(iso).getTime();
    const now = window.MOCK_TODAY ? window.MOCK_TODAY.getTime() : Date.now();
    const diff = now - t;
    const min = Math.round(diff / 60000);
    if (min < 1) return "just now";
    if (min < 60) return min + "m ago";
    const hr = Math.round(min / 60);
    if (hr < 24) return hr + "h ago";
    const d = Math.round(hr / 24);
    if (d < 7) return d + "d ago";
    if (d < 30) return Math.round(d / 7) + "w ago";
    return Math.round(d / 30) + "mo ago";
  };

  // Proper-case a name like "ANGELA SHARBINO" or "joe huzman" → "Angela Sharbino".
  // Handles hyphens, apostrophes ("O'Brien"), Mc/Mac prefixes ("McDonald"), and slashes ("Maria/Cesar").
  U.toProperCase = function (s) {
    if (!s) return "";
    return String(s).toLowerCase().replace(
      /([a-zA-Z\u00C0-\u017F]+)/g,
      (word, _g, idx, full) => {
        // Mc<Cap> or Mac<Cap>
        if (word.startsWith("mc") && word.length > 2) {
          return "Mc" + word[2].toUpperCase() + word.slice(3);
        }
        if (word.startsWith("mac") && word.length > 3) {
          return "Mac" + word[3].toUpperCase() + word.slice(4);
        }
        // Default: capitalize first letter
        return word[0].toUpperCase() + word.slice(1);
      }
    );
  };

  // Uniform phone format: (XXX) XXX-XXXX for 10 digits; "1 (XXX) XXX-XXXX" for 11 starting with 1.
  // Falls back to the raw string when it can't make sense of the digits.
  U.fmtPhone = function (s) {
    if (!s) return "";
    const digits = String(s).replace(/\D/g, "");
    if (digits.length === 10) {
      return "(" + digits.slice(0, 3) + ") " + digits.slice(3, 6) + "-" + digits.slice(6);
    }
    if (digits.length === 11 && digits[0] === "1") {
      return "1 (" + digits.slice(1, 4) + ") " + digits.slice(4, 7) + "-" + digits.slice(7);
    }
    return String(s).trim();
  };

  // Effective log time of a lead, as epoch ms — used as a hidden secondary
  // sort key so leads within the same date appear in the order they were
  // logged. Never displayed.
  U.leadTimeKey = function (lead) {
    if (!lead) return 0;
    // Explicit creation timestamp, if present.
    if (lead.created_at) {
      const t = Date.parse(lead.created_at);
      if (!isNaN(t)) return t;
    }
    // App-added leads carry their log time in the id: "ld_<epoch-ms>".
    const m = /^ld_(\d+)$/.exec(lead.id || "");
    if (m) return Number(m[1]);
    // Seed/historical leads: derive from date + HH:MM time field.
    if (lead.date && lead.time && /^\d{1,2}:\d{2}/.test(lead.time)) {
      const t = Date.parse(lead.date + "T" + lead.time);
      if (!isNaN(t)) return t;
    }
    // Fallback: midnight of the date, nudged by seq for stable order.
    const d = U.parseDate(lead.date);
    return (d ? d.getTime() : 0) + (Number(lead.seq) || 0);
  };

  U.absTime = function (iso) {
    if (!iso) return "—";
    const d = new Date(iso);
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const dd = String(d.getDate()).padStart(2, "0");
    const hh = d.getHours();
    const mm = String(d.getMinutes()).padStart(2, "0");
    const p = hh >= 12 ? "p" : "a";
    const hr12 = ((hh + 11) % 12) + 1;
    return m + "/" + dd + " " + hr12 + ":" + mm + p;
  };

  window.U = U;
})();

</script>

    { key: "invite_viewers",  group: "Users", label: "Invite viewers (accountants)", desc: "Share read-only commission access" },
    { key: "invite_managers", group: "Users", label: "Invite managers",              desc: "Add managers to one or more campaigns" },
    { key: "invite_admins",   group: "Users", label: "Invite admins",                desc: "Grant full administrative access" },
    { key: "manage_users",    group: "Users", label: "Manage users",                 desc: "Edit, suspend, or delete any user" },
    { key: "manage_permissions", group: "Users", label: "Manage permissions",        desc: "Change role defaults and per-user overrides" },
  ];

  const ROLE_DEFAULTS = {
    admin: Object.fromEntries(PERMS.map(p => [p.key, true])),
    manager: {
      view_all_campaigns: false,
      view_audit_log: false,
      manage_leads: true,
      manage_agents: true,
      log_shifts: true,
      manage_attendance: true,
      edit_campaign_settings: true,
      reset_campaign_data: false,
      delete_campaign: false,
      create_campaigns: false,
      invite_viewers: true,
      invite_managers: false,
      invite_admins: false,
      manage_users: false,
      manage_permissions: false,
    },
    viewer: Object.fromEntries(PERMS.map(p => [p.key, false])),
  };

  // can(profile, permKey, { rolePerms, userOverrides })
  //   profile: { id, role }
  //   rolePerms: { [role]: { [permKey]: bool } } — overrides role defaults
  //   userOverrides: { [userId]: { [permKey]: bool } } — overrides per user
  function can(profile, permKey, opts) {
    if (!profile) return false;
    opts = opts || {};
    const userOv = opts.userOverrides?.[profile.id];
    if (userOv && permKey in userOv) return !!userOv[permKey];
    const role = profile.role;
    // Merge defaults under any role-level overrides so {} doesn't blank out perms
    const merged = {
      ...(ROLE_DEFAULTS[role] || {}),
      ...((opts.rolePerms && opts.rolePerms[role]) || {})
    };
    return !!merged[permKey];
  }

  // Group permissions for UI rendering
  function groupPerms() {
    const groups = {};
    PERMS.forEach(p => { (groups[p.group] ||= []).push(p); });
    return groups;
  }

  window.PERMS = PERMS;
  window.ROLE_DEFAULTS = ROLE_DEFAULTS;
  window.can = can;
  window.groupPerms = groupPerms;
})();

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

// ---------- Status Pill ----------
function Pill({ status, dot = true, children }) {
  const label = children ?? U.STATUS_LABEL[status] ?? status;

// ---------- Modal ----------
function Modal({ open, onClose, title, children, footer, width }) {
  useEffect(() => {
    if (!open) return;
    const h = (e) => { if (e.key === "Escape") onClose && onClose(); };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [open, onClose]);
  if (!open) return null;
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" style={width ? {width} : undefined} onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <h3>{title}</h3>
          <button className="icon-btn close" onClick={onClose} aria-label="Close"><Icon name="x"/></button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
}

// ---------- Popover (positioned relative to an anchor) ----------
function Popover({ open, anchorRef, onClose, children, align = "start" }) {
  // Compute position from the anchor's rect, clamped to the viewport.
  const computePos = (popEl) => {
    const a = anchorRef?.current;
    if (!a) return { top: 0, left: 0 };
    const r = a.getBoundingClientRect();
    const top = r.bottom + window.scrollY + 4;
    const popW = popEl ? popEl.offsetWidth : 280;
    let left = r.left + window.scrollX;
    if (align === "end") left = r.right + window.scrollX - popW;
    const maxLeft = window.scrollX + window.innerWidth - popW - 8;
    const minLeft = window.scrollX + 8;
    if (left > maxLeft) left = maxLeft;
    if (left < minLeft) left = minLeft;
    return { top, left };
  };
  const [pos, setPos] = useState(() => computePos(null));
  const popRef = useRef(null);
  React.useLayoutEffect(() => {
    if (!open || !anchorRef?.current) return;
    setPos(computePos(popRef.current));
    const id = requestAnimationFrame(() => setPos(computePos(popRef.current)));
    return () => cancelAnimationFrame(id);
  }, [open, anchorRef, align]);
  useEffect(() => {
    if (!open) return;
    const onClick = (e) => {
      // Don't close if the click landed inside ANY popover (nested popovers are
      // portaled into body so they're not children of this one). closest('.popover')
      // catches sibling popovers.
      if (e.target.closest && e.target.closest(".popover")) return;
      if (popRef.current && !popRef.current.contains(e.target) &&
          anchorRef.current && !anchorRef.current.contains(e.target)) {
        onClose && onClose();
      }
    };
    const onKey = (e) => { if (e.key === "Escape") onClose && onClose(); };
    setTimeout(() => document.addEventListener("mousedown", onClick), 0);
    document.addEventListener("keydown", onKey);
    return () => {
      document.removeEventListener("mousedown", onClick);
      document.removeEventListener("keydown", onKey);
    };
  }, [open, anchorRef, onClose]);
  if (!open) return null;
  return ReactDOM.createPortal(
    <div ref={popRef} className="popover" style={{ top: pos.top, left: pos.left }}>
      {children}
    </div>,
    document.body
  );
}

// ---------- Sparkline (simple) ----------
function Sparkline({ values, width = 60, height = 18, color = "var(--accent)" }) {
  if (!values || values.length < 2) {
    return <svg width={width} height={height}></svg>;
  }
  const max = Math.max(...values, 1);
  const step = width / (values.length - 1);
  const pts = values.map((v, i) => [i * step, height - (v / max) * (height - 2) - 1]);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  return (
    <svg width={width} height={height} aria-hidden="true">
      <path d={d} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

// ---------- DatePicker ----------
// Hybrid: type "051526" → auto-formats to "05/15/26". Click the calendar icon for a popover grid.
function DatePicker({ value, onChange, placeholder = "MM/DD/YY", clearable = false, min, max, autoFocus }) {
  const [open, setOpen] = useState(false);
  const initialView = (value && U.parseDate(value)) || new Date();
  const [viewYear, setViewYear] = useState(initialView.getFullYear());
  const [viewMonth, setViewMonth] = useState(initialView.getMonth());
  const [text, setText] = useState(() => value ? U.shortDate(value) : "");
  const wrapRef = useRef(null);
  const inputRef = useRef(null);

  // Sync text + view month when value changes externally
  useEffect(() => {
    setText(value ? U.shortDate(value) : "");
    if (value) {
      const d = U.parseDate(value);
      if (d) { setViewYear(d.getFullYear()); setViewMonth(d.getMonth()); }
    }
  }, [value]);

  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DOWS = ["Su","Mo","Tu","We","Th","Fr","Sa"];

  const grid = useMemo(() => {
    const first = new Date(viewYear, viewMonth, 1);
    const startDow = first.getDay();
    const out = [];
    for (let i = 0; i < startDow; i++) {
      const d = new Date(viewYear, viewMonth, -startDow + i + 1);
      out.push({ d, dim: true });
    }
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    for (let i = 1; i <= daysInMonth; i++) {
      out.push({ d: new Date(viewYear, viewMonth, i), dim: false });
    }
    while (out.length < 42) {
      const last = out[out.length - 1].d;
      const next = new Date(last); next.setDate(next.getDate() + 1);
      out.push({ d: next, dim: true });
    }
    return out;
  }, [viewYear, viewMonth]);

  const goPrev = () => {
    let y = viewYear, m = viewMonth - 1;
    if (m < 0) { m = 11; y -= 1; }
    setViewYear(y); setViewMonth(m);
  };
  const goNext = () => {
    let y = viewYear, m = viewMonth + 1;
    if (m > 11) { m = 0; y += 1; }
    setViewYear(y); setViewMonth(m);
  };

  const today = window.MOCK_TODAY || new Date();
  const todayStr = U.dayStr(today);
  const valueStr = value || "";

  const pickDate = (d) => {
    const s = U.dayStr(d);
    if (min && s < min) return;
    if (max && s > max) return;
    onChange(s);
    setOpen(false);
  };

  // Auto-format typed text: strip non-digits, insert slashes
  const handleTextChange = (e) => {
    const raw = e.target.value.replace(/\D/g, "").slice(0, 6);
    let formatted = raw;
    if (raw.length > 4)      formatted = raw.slice(0,2) + "/" + raw.slice(2,4) + "/" + raw.slice(4);
    else if (raw.length > 2) formatted = raw.slice(0,2) + "/" + raw.slice(2);
    setText(formatted);

    if (raw.length === 6) {
      const m = parseInt(raw.slice(0,2), 10);
      const d = parseInt(raw.slice(2,4), 10);
      const yy = parseInt(raw.slice(4,6), 10);
      const y = 2000 + yy;
      // Validate the date actually exists (handles Feb 30 etc.)
      const cand = new Date(y, m - 1, d);
      if (m >= 1 && m <= 12 && cand.getMonth() === m - 1 && cand.getDate() === d) {
        const s = U.dayStr(cand);
        if (!(min && s < min) && !(max && s > max)) {
          onChange(s);
          setViewYear(y); setViewMonth(m - 1);
        }
      }
    } else if (raw.length === 0) {
      if (value) onChange("");
    }
  };

  const handleBlur = () => {
    // Snap back to current valid value if user left an incomplete date in the box
    setText(value ? U.shortDate(value) : "");
  };

  const handleKeyDown = (e) => {
    if (e.key === "Enter") { e.preventDefault(); inputRef.current?.blur(); }
    if (e.key === "Escape") { setText(value ? U.shortDate(value) : ""); inputRef.current?.blur(); setOpen(false); }
  };

  return (
    <>
      <div ref={wrapRef} className={"dp-trigger" + (open ? " open" : "")}>
        <button
          type="button"
          className="dp-icon-btn"
          onClick={() => setOpen(o => !o)}
          title="Open calendar"
          tabIndex={-1}
        >
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
          </svg>
        </button>
        <input
          ref={inputRef}
          type="text"
          inputMode="numeric"
          autoFocus={autoFocus}
          placeholder={placeholder}
          value={text}
          onChange={handleTextChange}
          onBlur={handleBlur}
          onKeyDown={handleKeyDown}
          className="dp-text"
        />
        {clearable && value && (
          <button
            type="button"
            className="dp-clear"
            onClick={() => { onChange(""); setText(""); }}
            title="Clear"
            tabIndex={-1}
          >
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        )}
      </div>
      <Popover open={open} anchorRef={wrapRef} onClose={() => setOpen(false)}>
        <div className="dp-cal">
          <div className="dp-head">
            <button type="button" className="icon-btn" onClick={goPrev} title="Previous month">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <div className="dp-title">
              <span style={{ color: "var(--text)", fontWeight: 600 }}>{MONTHS[viewMonth]}</span>
              <span style={{ color: "var(--text-3)", marginLeft: 6, fontFamily: "Geist Mono, monospace" }}>{viewYear}</span>
            </div>
            <button type="button" className="icon-btn" onClick={goNext} title="Next month">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 6 6 6-6 6"/></svg>
            </button>
          </div>
          <div className="dp-dows">
            {DOWS.map(d => <div key={d}>{d}</div>)}
          </div>
          <div className="dp-grid">
            {grid.map((c, i) => {
              const ds = U.dayStr(c.d);
              const isToday = ds === todayStr;
              const isSel = ds === valueStr;
              const isBlocked = (min && ds < min) || (max && ds > max);
              const cls = ["dp-day"];
              if (c.dim) cls.push("dim");
              if (isToday) cls.push("today");
              if (isSel) cls.push("sel");
              if (isBlocked) cls.push("blocked");
              return (
                <button
                  key={i}
                  type="button"
                  className={cls.join(" ")}
                  disabled={isBlocked}
                  onClick={() => pickDate(c.d)}
                >
                  {c.d.getDate()}
                </button>
              );
            })}
          </div>
          <div className="dp-foot">
            {clearable && (
              <button type="button" className="btn btn-sm btn-ghost" onClick={() => { onChange(""); setOpen(false); }}>Clear</button>
            )}
            <button type="button" className="btn btn-sm" style={{ marginLeft: "auto" }} onClick={() => {
              setViewYear(today.getFullYear()); setViewMonth(today.getMonth()); onChange(todayStr); setOpen(false);
            }}>Today</button>
          </div>
        </div>
      </Popover>
    </>
  );
}

// ---------- TimePicker ----------
// Compact dropdown of 30-min slots from 7a to 9p. Native time inputs are ugly.
function TimePicker({ value, onChange, placeholder = "Pick a time", clearable = false }) {
  const [open, setOpen] = useState(false);
  const triggerRef = useRef(null);
  const slots = useMemo(() => {
    const out = [];
    for (let h = 7; h <= 21; h++) {
      for (const m of [0, 30]) {
        out.push(String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0"));
      }
    }
    return out;
  }, []);
  const display = (() => {
    if (!value) return "";
    const [h, m] = value.split(":").map(Number);
    const p = h >= 12 ? "PM" : "AM";
    const h12 = ((h + 11) % 12) + 1;
    return h12 + ":" + String(m).padStart(2, "0") + " " + p;
  })();
  return (
    <>
      <button
        ref={triggerRef}
        type="button"
        className="input dp-trigger"
        onClick={() => setOpen(o => !o)}
        style={{
          display: "flex",
          alignItems: "center",
          gap: 8,
          textAlign: "left",
          cursor: "pointer",
          padding: "0 10px",
          color: display ? "var(--text)" : "var(--text-4)",
        }}
      >
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ color: "var(--text-3)", flexShrink: 0 }}>
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        <span className="mono" style={{ fontSize: 12, flex: 1 }}>{display || placeholder}</span>
        {clearable && value && (
          <span
            onClick={(e) => { e.stopPropagation(); onChange(""); }}
            style={{ color: "var(--text-4)", cursor: "pointer", padding: "2px 4px", borderRadius: 4 }}
            title="Clear"
          >
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </span>
        )}
      </button>
      <Popover open={open} anchorRef={triggerRef} onClose={() => setOpen(false)}>
        <div className="tp-list">
          {slots.map(s => {
            const [h, m] = s.split(":").map(Number);
            const p = h >= 12 ? "PM" : "AM";
            const h12 = ((h + 11) % 12) + 1;
            const lbl = h12 + ":" + String(m).padStart(2, "0") + " " + p;
            return (
              <button
                key={s}
                type="button"
                className={"popover-item" + (s === value ? " active" : "")}
                onClick={() => { onChange(s); setOpen(false); }}
              >
                <span className="mono" style={{ fontSize: 12 }}>{lbl}</span>
              </button>
            );
          })}
        </div>
      </Popover>
    </>
  );
}
