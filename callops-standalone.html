      </Sheet>
    );
  }

  function InviteUserSheet({ open, onClose, campaign, handlers }) {
    const blank = () => ({ full_name: "", email: "", password: "", role: "manager" });
    const [form, setForm] = useState(blank);
    const [busy, setBusy] = useState(false);
    const [err, setErr] = useState("");
    useEffect(() => { if (open) { setForm(blank()); setErr(""); setBusy(false); } }, [open]);
    const update = (k, v) => setForm(f => ({ ...f, [k]: v }));
    const disabled = busy || !form.full_name.trim() || !form.email.trim() || !form.password.trim();
    const submit = async () => {
      setBusy(true); setErr("");
      const res = await handlers.onInviteUser({ ...form, campaign_ids: [campaign.id] });
      setBusy(false);
      if (res && res.error) { setErr(res.error); return; }
      onClose();
    };
    return (
      <Sheet open={open} onClose={onClose} title="Invite user" height="80%"
        actionLabel={busy ? "…" : "Send"} actionDisabled={disabled} onAction={submit}>
        <div style={{ padding: "16px 18px 30px" }}>
          <Field label="Full name">
            <input value={form.full_name} onChange={(e) => update("full_name", e.target.value)} placeholder="Jane Smith" style={inputS}/>
          </Field>
          <Field label="Email">
            <input value={form.email} onChange={(e) => update("email", e.target.value)} placeholder="jane@company.com"
              type="email" style={inputS}/>
          </Field>
          <Field label="Temporary password">
            <input value={form.password} onChange={(e) => update("password", e.target.value)}
              placeholder="At least 8 characters" style={inputS}/>
          </Field>
          <Field label="Role">
            <Segmented value={form.role} onChange={(v) => update("role", v)} options={[
              { value: "admin", label: "Admin" }, { value: "manager", label: "Manager" }, { value: "viewer", label: "Viewer" },
            ]}/>
          </Field>
          <div style={{ fontSize: 11, color: T.text3, lineHeight: 1.5 }}>
            The account is created on {campaign.name}. They sign in with this email and password.
          </div>
          {err && <div style={{ marginTop: 12, padding: "10px 12px", background: T.status.dnc.bg,
            border: `1px solid ${T.status.dnc.ring}`, borderRadius: 10, fontSize: 12, color: T.status.dnc.fg }}>{err}</div>}
        </div>
      </Sheet>
    );
  }

  function UserEditSheet({ user, onClose, canDo, rolePerms, userOverrides, handlers }) {
    const [role, setRole] = useState("manager");
    const [showPerms, setShowPerms] = useState(false);
    useEffect(() => { if (user) { setRole(user.role); setShowPerms(false); } }, [user && user.id]);
    if (!user) return <Sheet open={false} onClose={onClose} title="User"><div/></Sheet>;
    const isSelf = user.id === "u_self";
    const ov = (userOverrides && userOverrides[user.id]) || {};
    const setOverride = (key, val) => {
      const next = { ...ov };
      const eff = window.can({ id: user.id, role }, key, { rolePerms });
      if (val === eff && !(key in ov)) return;
      next[key] = val;
      handlers.onUpdateUserOverrides(user.id, next);
    };
    return (
      <Sheet open={!!user} onClose={onClose} title={user.full_name}
        actionLabel={role !== user.role ? "Save" : null}
        onAction={() => { handlers.onUpdateUser(user.id, { role }); onClose(); }}>
        <div style={{ padding: "16px 18px 30px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 18 }}>
            <div style={{ width: 48, height: 48, borderRadius: 999, background: T.bgPanel2,
              border: `1px solid ${T.border}`, display: "flex", alignItems: "center", justifyContent: "center",
              fontSize: 16, fontWeight: 600, color: T.text2 }}>{user.initials || CO.initials(user.full_name)}</div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 16, fontWeight: 600, color: T.text }}>{user.full_name}</div>
              <div style={{ fontSize: 12, color: T.text3 }}>{user.email}</div>
            </div>
          </div>

          <Field label="Role">
            <Segmented value={role} onChange={setRole} options={[
              { value: "admin", label: "Admin" }, { value: "manager", label: "Manager" }, { value: "viewer", label: "Viewer" },
            ]}/>
          </Field>

          <button onClick={() => setShowPerms(s => !s)} style={{ display: "flex", width: "100%", alignItems: "center",
            gap: 8, padding: "11px 12px", marginBottom: showPerms ? 8 : 14, background: T.bgPanel,
            border: `1px solid ${T.borderSubtle}`, borderRadius: 10, cursor: "pointer", fontFamily: "inherit" }}>
            <Icon name="shield" size={14} color={T.text2}/>
            <span style={{ flex: 1, fontSize: 13, color: T.text, fontWeight: 500, textAlign: "left" }}>Permission overrides</span>
            <Icon name={showPerms ? "chevU" : "chevD"} size={14} color={T.text4}/>
          </button>
          {showPerms && (
            <div style={{ marginBottom: 14 }}>
              {window.PERMS.map(p => {
                const on = window.can({ id: user.id, role }, p.key, { rolePerms, userOverrides: { [user.id]: ov } });
                return (
                  <div key={p.key} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 4px",
                    borderBottom: `1px solid ${T.borderSubtle}` }}>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 12.5, color: T.text }}>{p.label}</div>
                      <div style={{ fontSize: 10.5, color: T.text4 }}>{p.group}{p.key in ov ? " · overridden" : ""}</div>
                    </div>
                    <Toggle on={on} onChange={(v) => setOverride(p.key, v)}/>
                  </div>
                );
              })}
              {Object.keys(ov).length > 0 && (
                <button onClick={() => handlers.onUpdateUserOverrides(user.id, {})} style={{
                  marginTop: 10, background: "transparent", border: 0, color: T.accent,
                  fontSize: 12, fontFamily: "inherit", cursor: "pointer", padding: 0 }}>Reset to role defaults</button>
              )}
            </div>
          )}

          {!isSelf && (
            <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 8 }}>
              <button onClick={() => { handlers.onSuspendUser(user.id); onClose(); }} style={ghostBtn(T.moneySpiff)}>
                {user.status === "suspended" ? "Reactivate user" : "Suspend user"}
              </button>
              <button onClick={() => { if (window.confirm(`Delete ${user.full_name}?`)) { handlers.onDeleteUser(user.id); onClose(); } }}
                style={ghostBtn(T.status.dnc.fg)}>
                <Icon name="trash" size={13}/> Delete user
              </button>
            </div>
          )}
          {isSelf && <div style={{ fontSize: 11, color: T.text4, marginTop: 8 }}>This is your own account.</div>}
        </div>
      </Sheet>
    );
  }
  function ghostBtn(color) {
    return { width: "100%", padding: 12, background: "transparent", border: `1px solid ${color}55`,
      color, borderRadius: 10, fontSize: 13, fontWeight: 500, fontFamily: "inherit", cursor: "pointer",
      display: "flex", alignItems: "center", justifyContent: "center", gap: 6 };
  }

  function AuditSheet({ open, onClose, auditLog }) {
    return (
      <Sheet open={open} onClose={onClose} title="Audit log">
        <div style={{ padding: "8px 14px 30px" }}>
          {(!auditLog || auditLog.length === 0) ? <Empty icon="clock" title="No activity" sub="Actions will appear here"/>
            : auditLog.slice(0, 200).map(e => (
              <div key={e.id} style={{ display: "flex", gap: 10, padding: "10px 4px", borderBottom: `1px solid ${T.borderSubtle}` }}>
                <div style={{ width: 7, height: 7, borderRadius: 999, background: T.accent, marginTop: 5, flexShrink: 0 }}/>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 12.5, color: T.text2, lineHeight: 1.4 }}>{e.description}</div>
                  <div style={{ fontSize: 10.5, color: T.text4, marginTop: 2, fontFamily: MONO }}>
                    {e.actor_name} · {fmtTs(e.ts)}{e.category ? " · " + e.category : ""}
                  </div>
                </div>
              </div>
            ))}
        </div>
      </Sheet>
    );
  }
  function fmtTs(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    if (isNaN(d.getTime())) return "";
    return CO.shortDate(isoOf(d)) + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }

  function PermissionsSheet({ open, onClose, rolePerms, handlers }) {
    const [role, setRole] = useState("manager");
    const groups = window.groupPerms();
    return (
      <Sheet open={open} onClose={onClose} title="Permissions">
        <div style={{ padding: "14px 18px 30px" }}>
          <Segmented value={role} onChange={setRole} options={[
            { value: "admin", label: "Admin" }, { value: "manager", label: "Manager" }, { value: "viewer", label: "Viewer" },
          ]}/>
          <div style={{ fontSize: 11, color: T.text3, margin: "12px 0", lineHeight: 1.5 }}>
            Defaults for every {ROLE_LABEL[role]}. Per-user exceptions live on each user's profile.
          </div>
          {Object.entries(groups).map(([group, perms]) => (
            <div key={group} style={{ marginBottom: 16 }}>
              <div style={{ fontSize: 10.5, color: T.text3, fontWeight: 600, letterSpacing: "0.06em",
                textTransform: "uppercase", marginBottom: 6 }}>{group}</div>
              <Card padded={false}>
                {perms.map((p, i) => {
                  const merged = { ...(window.ROLE_DEFAULTS[role] || {}), ...((rolePerms && rolePerms[role]) || {}) };
                  const on = !!merged[p.key];
                  return (
                    <div key={p.key} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 12px",
                      borderBottom: i === perms.length - 1 ? "none" : `1px solid ${T.borderSubtle}` }}>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontSize: 13, color: T.text }}>{p.label}</div>
                        <div style={{ fontSize: 10.5, color: T.text4, lineHeight: 1.35 }}>{p.desc}</div>
                      </div>
                      <Toggle on={on} onChange={(v) => handlers.onUpdateRolePerms(role, p.key, v)}/>
                    </div>
                  );
                })}
              </Card>
            </div>
          ))}
          <button onClick={() => handlers.onUpdateRolePerms(role, "__reset__", null)} style={{
            background: "transparent", border: 0, color: T.accent, fontSize: 12.5, fontFamily: "inherit",
            cursor: "pointer", padding: 0 }}>Reset {ROLE_LABEL[role]} to defaults</button>
        </div>
      </Sheet>
    );
  }

  function CampaignSettingsSheet({ open, onClose, campaign, handlers }) {
    const [form, setForm] = useState(campaign);
    useEffect(() => { if (open) setForm(campaign); }, [open]);
    const update = (k, v) => setForm(f => ({ ...f, [k]: v }));
    const num = (k, v) => setForm(f => ({ ...f, [k]: Math.max(0, Number(v) || 0) }));
    return (
      <Sheet open={open} onClose={onClose} title="Campaign settings" actionLabel="Save"
        onAction={() => { handlers.onUpdateCampaign({
          name: form.name, client: form.client, rate_transfer: form.rate_transfer,
          rate_confirmed: form.rate_confirmed, rate_ia: form.rate_ia,
          ia_tier_2: form.ia_tier_2, ia_tier_3: form.ia_tier_3 }); onClose(); }}>
        <div style={{ padding: "16px 18px 30px" }}>
          <Field label="Campaign name">
            <input value={form.name || ""} onChange={(e) => update("name", e.target.value)} style={inputS}/>
          </Field>
          <Field label="Client product">
            <input value={form.client || ""} onChange={(e) => update("client", e.target.value)} style={inputS}/>
          </Field>
          <div style={{ fontSize: 11, color: T.text3, margin: "4px 0 12px" }}>Commission rates — what the client pays per outcome.</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10 }}>
            <Field label="$ / Transfer">
              <input type="number" value={form.rate_transfer ?? 0} onChange={(e) => num("rate_transfer", e.target.value)} style={{ ...inputS, fontFamily: MONO }}/>
            </Field>
            <Field label="$ / Confirmed">
              <input type="number" value={form.rate_confirmed ?? 0} onChange={(e) => num("rate_confirmed", e.target.value)} style={{ ...inputS, fontFamily: MONO }}/>
            </Field>
            <Field label="$ / IA">
              <input type="number" value={form.rate_ia ?? 0} onChange={(e) => num("rate_ia", e.target.value)} style={{ ...inputS, fontFamily: MONO }}/>
            </Field>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            <Field label="IA Tier 2 (2/day)">
              <input type="number" value={form.ia_tier_2 ?? 0} onChange={(e) => num("ia_tier_2", e.target.value)} style={{ ...inputS, fontFamily: MONO }}/>
            </Field>
            <Field label="IA Tier 3 (3/day)">
              <input type="number" value={form.ia_tier_3 ?? 0} onChange={(e) => num("ia_tier_3", e.target.value)} style={{ ...inputS, fontFamily: MONO }}/>
            </Field>
          </div>
        </div>
      </Sheet>
    );
  }

  // ════════════════════════════════════════════════════════════════
  // MOBILE ROOT — shell, adapter, handler wiring
  // ════════════════════════════════════════════════════════════════
  function MobileRoot(props) {
    const { campaign, agents: rawAgents, leads: rawLeads, attendanceOverrides,
            profile, users, auditLog, rolePerms, userOverrides, canDo, handlers } = props;

    const [tab, setTab] = useState("today");
    const [openLeadId, setOpenLeadId] = useState(null);
    const [openAgentId, setOpenAgentId] = useState(null);
    const [showAdd, setShowAdd] = useState(false);
    const scrollRef = useRef(null);

    const today = window.MOCK_TODAY ? isoOf(window.MOCK_TODAY) : isoOf(new Date());

    useEffect(() => {
      const prev = document.body.style.overflow;
      document.body.style.overflow = "hidden";
      return () => { document.body.style.overflow = prev; };
    }, []);
    useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = 0; }, [tab]);

    // Agents present today, derived from attendance (ground truth + overrides).
    const presentToday = useMemo(() => {
      const set = new Set();
      const present = {}, reportDays = new Set();
      ((window.MOCK_DATA && window.MOCK_DATA.attendance) || []).forEach(r => {
        if (r.campaign_id !== campaign.id) return;
        present[r.agent_id + "|" + r.date] = true;
        reportDays.add(r.date);
      });
      rawAgents.forEach(a => {
        if (a.campaign_id !== campaign.id || a.status !== "active") return;
        const ov = attendanceOverrides && attendanceOverrides[a.id + "|" + today];
        let st;
        if (ov) st = ov;
        else if (a.date_added && today < a.date_added) st = "off";
        else if (a.date_removed && today > a.date_removed) st = "off";
        else if (!reportDays.has(today)) st = "off";
        else st = present[a.id + "|" + today] ? "present" : "absent";
        if (st === "present") set.add(a.id);
      });
      return set;
    }, [rawAgents, attendanceOverrides, campaign.id, today]);

    const mAgents = useMemo(() => rawAgents
      .filter(a => a.campaign_id === campaign.id && a.status !== "removed")
      .map(a => ({ ...a, name: a.full_name, short: firstName(a.full_name), tl: !!a.is_tl,
        tier: a.status === "active" ? "A" : "C",
        onShift: a.status === "active" && presentToday.has(a.id),
        shiftStart: null, color: agentColor(a.id) }))
      .sort((a, b) => a.short.localeCompare(b.short)),
      [rawAgents, campaign.id, presentToday]);

    const mLeads = useMemo(() => rawLeads
      .filter(l => l.campaign_id === campaign.id)
      .map(l => ({ ...l, time: l.time || "", customer_name: l.customer_name || "" })),
      [rawLeads, campaign.id]);

    const agentById = useMemo(() => Object.fromEntries(mAgents.map(a => [a.id, a])), [mAgents]);
    const mProfile = { ...profile, campaign_id: campaign.id };

    // Populate the adapter synchronously so screens read fresh data this render.
    CO.campaign = campaign;
    CO.profile = mProfile;
    CO.agents = mAgents;
    CO.agentById = agentById;
    CO.agentByShort = Object.fromEntries(mAgents.map(a => [a.short, a]));
    CO.leads = mLeads;
    CO.today = today;
    CO.todayLabel = CO.fullDate(today);

    const openLead = openLeadId ? mLeads.find(l => l.id === openLeadId) : null;
    const openAgent = openAgentId ? agentById[openAgentId] : null;

    const onAddLead = (lead) => handlers.onAddLead(lead);
    const onUpdateLead = (id, updates) => handlers.onUpdateLead(id, updates);
    const onDeleteLead = (id) => { handlers.onDeleteLead(id); setOpenLeadId(null); };

    const tabs = [
      { key: "today", label: "Today", icon: "home" },
      { key: "leads", label: "Leads", icon: "list" },
      { key: "floor", label: "Floor", icon: "bars" },
      { key: "pay", label: "Payouts", icon: "money" },
      { key: "more", label: "Account", icon: "user" },
    ];

    return (
      <div style={{ position: "fixed", inset: 0, background: T.bgBase, color: T.text,
        fontFamily: FONT, zIndex: 9000, overflow: "hidden",
        WebkitFontSmoothing: "antialiased" }}>
        <div ref={scrollRef} style={{ position: "absolute", inset: 0, overflowY: "auto",
          overflowX: "hidden", WebkitOverflowScrolling: "touch",
          paddingTop: "env(safe-area-inset-top, 0px)" }}>
          {tab === "today" && (
            <TodayScreen leads={mLeads} agents={mAgents} profile={mProfile} campaign={campaign}
              onOpenLead={(l) => setOpenLeadId(l.id)} onOpenAgent={(a) => setOpenAgentId(a.id)}
              onJump={setTab} onAddLead={() => setShowAdd(true)}/>
          )}
          {tab === "leads" && (
            <LeadsScreen leads={mLeads} agents={mAgents} onOpenLead={(l) => setOpenLeadId(l.id)}/>
          )}
          {tab === "floor" && (
            <FloorScreen leads={mLeads} agents={mAgents} onOpenAgent={(a) => setOpenAgentId(a.id)}/>
          )}
          {tab === "pay" && <PayoutsScreen leads={mLeads}/>}
          {tab === "more" && (
            <AccountScreen profile={mProfile} campaign={campaign} agents={mAgents} leads={mLeads}
              users={users} auditLog={auditLog} rolePerms={rolePerms} userOverrides={userOverrides}
              canDo={canDo} handlers={handlers}/>
          )}
        </div>

        {(tab === "today" || tab === "leads") && (
          <button onClick={() => setShowAdd(true)} style={{ position: "absolute",
            bottom: "calc(env(safe-area-inset-bottom, 0px) + 86px)", right: 18,
            width: 56, height: 56, borderRadius: 999, background: T.accent, color: T.accentInk,
            border: 0, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center",
            boxShadow: `0 6px 24px ${T.accent}50, 0 2px 6px rgba(0,0,0,0.5)`, zIndex: 25 }}>
            <Icon name="plus" size={22} color={T.accentInk} strokeWidth={2.5}/>
          </button>
        )}

        <TabBar active={tab} onChange={setTab} tabs={tabs}/>

        <LeadDetailSheet lead={openLead} agents={mAgents} open={!!openLeadId}
          onClose={() => setOpenLeadId(null)} onUpdate={onUpdateLead} onDelete={onDeleteLead}/>
        <AgentDetailSheet agent={openAgent} leads={mLeads} open={!!openAgentId}
          onClose={() => setOpenAgentId(null)}
          onOpenLead={(l) => { setOpenAgentId(null); setTimeout(() => setOpenLeadId(l.id), 280); }}/>
        <AddLeadSheet open={showAdd} onClose={() => setShowAdd(false)} agents={mAgents} onSave={onAddLead}/>
      </div>
    );
  }

  return MobileRoot;
})();

</script>

  <!-- App entry -->
  <script type="text/babel">
// Directory + App shell

const { useState: useStateApp, useEffect: useEffectApp, useMemo: useMemoApp, useCallback: useCallbackApp } = React;

function Directory({ campaigns, agents, leads, profile, onOpen, onNewCampaign }) {
  // Compute live stats per campaign from current state
  const enriched = useMemoApp(() => {
    const today = U.dayStr(window.MOCK_TODAY);
    const tw = { start: U.dayStr(U.startOfWeek(window.MOCK_TODAY)), end: U.dayStr(U.endOfWeek(window.MOCK_TODAY)) };
    return campaigns.map(c => {
      const cLeads = leads.filter(l => l.campaign_id === c.id);
      const ias = cLeads.filter(l => l.status === "ia").length;
      const activeAgents = agents.filter(a => a.campaign_id === c.id && a.status === "active").length;
      const todayLeads = cLeads.filter(l => l.date === today);
      const twLeads = cLeads.filter(l => l.date >= tw.start && l.date <= tw.end);
      const twBill = twLeads.reduce((s, l) => s + (l.client_commission || 0), 0);
      // 14-day spark
      const spark = [];
      for (let i = 13; i >= 0; i--) {
        const d = new Date(window.MOCK_TODAY);
        d.setDate(d.getDate() - i);
        const ds = U.dayStr(d);
        spark.push(cLeads.filter(l => l.date === ds).length);
      }
      return {
        ...c,
        lead_count: cLeads.length,
        ia_count: ias,
        agent_count: activeAgents,
        today_count: todayLeads.length,
        tw_bill: twBill,
        spark
      };
    });
  }, [campaigns, agents, leads]);

  const totalLeads = enriched.reduce((s, c) => s + c.lead_count, 0);
  const totalIA = enriched.reduce((s, c) => s + c.ia_count, 0);
  const totalAgents = enriched.reduce((s, c) => s + c.agent_count, 0);
  const totalBill = enriched.reduce((s, c) => s + c.tw_bill, 0);

  const greet = (() => {
    const h = window.MOCK_TODAY.getHours();
    if (h < 12) return "Good morning";
    if (h < 18) return "Good afternoon";
    return "Good evening";
  })();

  return (
    <div className="directory">
      <div className="directory-head">
        <div>
          <div className="greet">{greet}, {profile.full_name.split(" ")[0]}.</div>
          <h1>Campaigns</h1>
        </div>
        <div className="right">
          <button className="btn btn-primary btn-lg" onClick={onNewCampaign}>
            <Icon name="plus"/> New Campaign
          </button>
        </div>
      </div>

      <div className="row" style={{ gap: 28, marginBottom: 28, paddingBottom: 20, borderBottom: "1px solid var(--border-subtle)", flexWrap: "wrap" }}>
        <div>
          <div style={{ fontSize: 11, color: "var(--text-3)", textTransform: "uppercase", letterSpacing: "0.05em" }}>Campaigns</div>
          <div className="mono" style={{ fontSize: 24, fontWeight: 600, letterSpacing: "-0.02em" }}>{enriched.length}</div>
        </div>
        <div>
          <div style={{ fontSize: 11, color: "var(--text-3)", textTransform: "uppercase", letterSpacing: "0.05em" }}>Active Agents</div>
          <div className="mono" style={{ fontSize: 24, fontWeight: 600, letterSpacing: "-0.02em" }}>{totalAgents}</div>
        </div>
        <div>
          <div style={{ fontSize: 11, color: "var(--text-3)", textTransform: "uppercase", letterSpacing: "0.05em" }}>Leads (28d)</div>
          <div className="mono" style={{ fontSize: 24, fontWeight: 600, letterSpacing: "-0.02em" }}>{totalLeads.toLocaleString()}</div>
        </div>
        <div>
          <div style={{ fontSize: 11, color: "var(--text-3)", textTransform: "uppercase", letterSpacing: "0.05em" }}>IAs (28d)</div>
          <div className="mono" style={{ fontSize: 24, fontWeight: 600, letterSpacing: "-0.02em", color: "var(--status-ia-fg)" }}>{totalIA}</div>
        </div>
        <div>
          <div style={{ fontSize: 11, color: "var(--text-3)", textTransform: "uppercase", letterSpacing: "0.05em" }}>Billing (this week)</div>

// ---------- Campaign Shell ----------
function CampaignShell(props) {
  const { campaign, tab, onTab } = props;
  const tabs = [
    ["overview", "Overview", "activity"],
    ["lead_log", "Lead Log", "list"],
    ["attendance", "Attendance", "check"],
    ["commission", "Commission Sheet", "download"],
    ["agent_report", "Agent Report", "users"],
    ["floor_report", "Floor Report", "grid"],
    ["settings", "Settings", "settings"],
  ];

  return (
    <>
      <div className="tabs">
        {tabs.map(([k, label, icon]) => (
          <button key={k} className={"tab" + (tab === k ? " active" : "")} onClick={() => onTab(k)}>
            <Icon name={icon} size={13}/> {label}
          </button>
        ))}
      </div>
      {tab === "overview" && (
        <Overview
          campaign={campaign}
          agents={props.agents}
          leads={props.leads}
          shiftLogs={props.shiftLogs}
          attendanceOverrides={props.attendanceOverrides}
          onJumpTab={onTab}
          onOpenAgent={props.openAgent}
        />
      )}
      {tab === "lead_log" && (
        <LeadLog
          campaign={campaign}
          agents={props.agents}
          leads={props.leads}
          onAddLead={props.onAddLead}
          onUpdateLead={props.onUpdateLead}
          onDeleteLead={props.onDeleteLead}
        />
      )}
      {tab === "commission" && (
        <CommissionSheet
          campaign={campaign}
          agents={props.agents}
          leads={props.leads}
          profile={props.profile}
          onInviteUser={props.onInviteUser}
        />
      )}
      {tab === "agent_report" && (() => {
        const detailAgent = props.agentDetailId
          ? props.agents.find(a => a.id === props.agentDetailId)
          : null;
        return detailAgent ? (
          <AgentDetail
            campaign={campaign}
            agent={detailAgent}
            agents={props.agents}
            leads={props.leads}
            attendanceOverrides={props.attendanceOverrides}
            onBack={props.onCloseAgent}
          />
        ) : (
          <AgentReport
            campaign={campaign}
            agents={props.agents}
            leads={props.leads}
            onOpenAgent={props.openAgent}
            onAddAgent={(name, isTl) => props.onAddAgent(campaign.id, name, isTl)}
          />
        );
      })()}
      {tab === "floor_report" && (
        <FloorReport
          campaign={campaign}
          agents={props.agents}
          leads={props.leads}
          shiftLogs={props.shiftLogs}
          attendanceOverrides={props.attendanceOverrides}
          onLogShift={props.onLogShift}
        />
      )}
      {tab === "attendance" && (
        <Attendance
          campaign={campaign}
          agents={props.agents}
          leads={props.leads}
          attendanceOverrides={props.attendanceOverrides}
          onSetAttendance={props.onSetAttendance}
          onAddAgent={(name, isTl) => props.onAddAgent(campaign.id, name, isTl)}
          onUpdateAgent={props.onUpdateAgent}
        />
      )}
      {tab === "settings" && (
        <Settings
          campaign={campaign}
          agents={props.agents}
          profile={props.profile}
          canDo={props.canDo}
          onUpdateCampaign={props.onUpdateCampaign}
          onExport={() => {
            const data = {
              exported_at: new Date().toISOString(),
              campaign,
              agents: props.agents.filter(a => a.campaign_id === campaign.id),
              leads: props.leads.filter(l => l.campaign_id === campaign.id),
              shift_logs: (props.shiftLogs || []).filter(s => s.campaign_id === campaign.id),
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "callops-" + String(campaign.name || "campaign").replace(/\s+/g, "-").toLowerCase() + "-" + U.dayStr(new Date()) + ".json";
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
          }}
          onDeleteCampaign={props.onDeleteCampaign}
          leadsCount={props.leads.filter(l => l.campaign_id === campaign.id).length}
        />
      )}
    </>
  );
}

// ---------- Top App ----------
function App({ authedProfile }) {
  // ---- State ----
  const initial = window.MOCK_DATA;
  const [campaigns, setCampaigns] = useStateApp(initial.campaigns);
  const [agents, setAgents] = useStateApp(initial.agents);
  const [leads, setLeads] = useStateApp(initial.leads);
  const [shiftLogs, setShiftLogs] = useStateApp(initial.shift_logs);
  const [attendanceOverrides, setAttendanceOverrides] = useStateApp({}); // {"agentId|date": "present|absent|off"}
  const [profile, setProfile] = useStateApp(authedProfile || initial.profile);
  const [impersonatingFrom, setImpersonatingFrom] = useStateApp(null);
  const [users, setUsers] = useStateApp(initial.users || []);
  const [auditLog, setAuditLog] = useStateApp(initial.audit_log || []);
  const [rolePerms, setRolePerms] = useStateApp({ admin: {}, manager: {}, viewer: {} });
  const [userOverrides, setUserOverrides] = useStateApp({});
  const [signedOut, setSignedOut] = useStateApp(false);
  const [userMenuOpen, setUserMenuOpen] = useStateApp(false);
  const [view, setView] = useStateApp("app"); // "app" | "admin"
  const userMenuRef = React.useRef(null);

  // ---- Mobile viewport detection — phones get the dedicated mobile app ----
  const [isMobile, setIsMobile] = useStateApp(
    () => !!(window.matchMedia && window.matchMedia("(max-width: 768px)").matches)
  );
  useEffectApp(() => {
    if (!window.matchMedia) return;
    const mq = window.matchMedia("(max-width: 768px)");
    const h = (e) => setIsMobile(e.matches);
    if (mq.addEventListener) mq.addEventListener("change", h);
    else mq.addListener(h);
    return () => {
      if (mq.removeEventListener) mq.removeEventListener("change", h);
      else mq.removeListener(h);
    };
  }, []);

  // ---- Audit helper ----
  const pushAudit = useCallbackApp((entry) => {
    const e = {
      id: "au_" + Date.now() + "_" + Math.floor(Math.random() * 10000),
      ts: new Date().toISOString(),
      actor_id: profile.id,
      actor_name: profile.full_name,
      ...entry,
    };
    setAuditLog(prev => [e, ...prev].slice(0, 500));
  }, [profile]);

  // Permission helper bound to current profile state
  const canDo = useCallbackApp(
    (perm) => window.can(profile, perm, { rolePerms, userOverrides }),
    [profile, rolePerms, userOverrides]
  );

  // Route state
  const [activeCampaignId, setActiveCampaignId] = useStateApp(null);
  const [tab, setTab] = useStateApp("overview");
  const [agentDetailId, setAgentDetailId] = useStateApp(null);
  const [showNewCampaign, setShowNewCampaign] = useStateApp(false);

  // The tab bar clears any open agent drill-down; openAgent routes into it.
  const handleTab = useCallbackApp((k) => { setTab(k); setAgentDetailId(null); }, []);
  const openAgent = useCallbackApp((id) => { setAgentDetailId(id); setTab("agent_report"); }, []);
  useEffectApp(() => { setAgentDetailId(null); }, [activeCampaignId]);

  // ---- Persistence: localStorage + Supabase cloud autosave & live sync ----
  // The whole data state is mirrored to localStorage (instant, offline-safe)
  // and to a single Supabase `app_state` row (shared across devices/users).
  // No per-handler wiring needed — any setLeads/setAgents/etc. flows through here.
  const PERSIST_KEY = "callops_state_v1";
  const persistClientId = React.useRef("c_" + Math.random().toString(36).slice(2)).current;
  const [hydrated, setHydrated] = useStateApp(false);
  const lastCloudAt = React.useRef(null);
  const lastBlobJSON = React.useRef(null);
  const dirtyRef = React.useRef(false); // true while local edits are unsaved

  const seedVersion = () => (window.MOCK_DATA && window.MOCK_DATA.seedVersion) || 0;
  const collectState = () => ({
    seedVersion: seedVersion(),
    campaigns, agents, leads, shiftLogs, attendanceOverrides, users, auditLog, rolePerms, userOverrides,
  });
  const applyState = (d) => {
    if (!d || typeof d !== "object") return;
    // Discard a saved blob from an older data.js seed so seed updates take effect.
    if ((d.seedVersion || 0) !== seedVersion()) return;
    lastBlobJSON.current = JSON.stringify(d);
    if (d.campaigns) setCampaigns(d.campaigns);
    if (d.agents) setAgents(d.agents);
    if (d.leads) setLeads(d.leads);
    if (d.shiftLogs) setShiftLogs(d.shiftLogs);
    if (d.attendanceOverrides) setAttendanceOverrides(d.attendanceOverrides);
    if (d.users) setUsers(d.users);
    if (d.auditLog) setAuditLog(d.auditLog);
    if (d.rolePerms) setRolePerms(d.rolePerms);
    if (d.userOverrides) setUserOverrides(d.userOverrides);
  };

  // Initial load — localStorage first (instant), then Supabase (authoritative).
  useEffectApp(() => {
    let cancelled = false;
    try {
      const raw = localStorage.getItem(PERSIST_KEY);
      if (raw) applyState(JSON.parse(raw));
    } catch (e) { console.warn("[persist] local load failed", e); }
    (async () => {
      try {
        if (window.SB && window.SB.client) {
          const { data, error } = await window.SB.client
            .from("app_state").select("data, updated_at").eq("id", "singleton").maybeSingle();
          if (!cancelled && !error && data && data.data) {
            lastCloudAt.current = data.updated_at;
            applyState(data.data);
          }
        }
      } catch (e) { console.warn("[persist] cloud load failed", e); }
      if (!cancelled) setHydrated(true);
    })();
    return () => { cancelled = true; };
  }, []);

  // Autosave — on any data change (post-hydration), debounce-save local + cloud.
  useEffectApp(() => {
    if (!hydrated) return;
    const blob = collectState();
    const json = JSON.stringify(blob);
    if (json === lastBlobJSON.current) return; // unchanged (e.g. just applied a remote update)
    lastBlobJSON.current = json;
    dirtyRef.current = true; // local edits pending — pauses the sync poll
    const t = setTimeout(async () => {
      dirtyRef.current = false; // 1s with no edits — safe for the poll to resume
      try { localStorage.setItem(PERSIST_KEY, json); } catch (e) {}
      try {
        if (window.SB && window.SB.client) {
          const { data, error } = await window.SB.client
            .from("app_state")
            .upsert({ id: "singleton", data: blob, updated_at: new Date().toISOString(), updated_by: persistClientId })
            .select("updated_at").single();
          if (!error && data) lastCloudAt.current = data.updated_at;
        }
      } catch (e) { console.warn("[persist] cloud save failed", e); }
    }, 1000);
    return () => clearTimeout(t);
  }, [hydrated, campaigns, agents, leads, shiftLogs, attendanceOverrides, users, auditLog, rolePerms, userOverrides]);

  // Live sync — poll the cloud for changes made by other sessions/devices.
  useEffectApp(() => {
    if (!hydrated || !window.SB || !window.SB.client) return;
    const poll = setInterval(async () => {
      if (dirtyRef.current) return; // mid-edit on this device — don't overwrite local changes
      try {
        const { data: meta, error } = await window.SB.client
          .from("app_state").select("updated_at, updated_by").eq("id", "singleton").maybeSingle();
        if (error || !meta) return;
        if (meta.updated_by === persistClientId) return;     // our own write
        if (meta.updated_at === lastCloudAt.current) return;  // nothing new
        const { data: full } = await window.SB.client
          .from("app_state").select("data, updated_at").eq("id", "singleton").maybeSingle();
        if (full && full.data) {
          lastCloudAt.current = full.updated_at;
          applyState(full.data);
        }
      } catch (e) {}
    }, 2000);
    return () => clearInterval(poll);
  }, [hydrated]);

  // ---- Impersonation: "view as" another user ----
  const startImpersonate = useCallbackApp((userId) => {
    const u = users.find(x => x.id === userId);
    if (!u) return;
    // If clicking on the original profile while impersonating, just stop.
    if (impersonatingFrom && u.id === impersonatingFrom.id) {
      stopImpersonate();
      return;
    }
    // Already impersonating someone else? Don't overwrite the saved original.
    if (u.id === profile.id) return;
    if (!impersonatingFrom) {
      setImpersonatingFrom(profile);
    }
    setProfile({
      id: u.id,
      full_name: u.full_name,
      initials: u.initials,
      role: u.role,
      email: u.email,
    });
    setView("app");
    setUserMenuOpen(false);
    // Route based on access
    const fake = { id: u.id, role: u.role };
    const hasViewAll = window.can(fake, "view_all_campaigns", { rolePerms, userOverrides });
    if (hasViewAll || u.campaign_ids.length > 1) {
      setActiveCampaignId(null);
    } else if (u.campaign_ids.length === 1) {
      setActiveCampaignId(u.campaign_ids[0]);
      setTab("overview");
    } else {
      setActiveCampaignId(null);
    }
    pushAudit({
      kind: "auth.impersonate",
      category: "auth",
      description: `Started viewing as ${u.full_name} (${u.role})`,
    });
  }, [users, profile, rolePerms, userOverrides, pushAudit]);

  const stopImpersonate = useCallbackApp(() => {
    if (!impersonatingFrom) return;
    pushAudit({
      kind: "auth.impersonate_stop",
      category: "auth",
      description: `Stopped viewing as ${profile.full_name}`,
      actor_id: impersonatingFrom.id,
      actor_name: impersonatingFrom.full_name,
    });
    setProfile(impersonatingFrom);
    setImpersonatingFrom(null);
    setView("app");
    setActiveCampaignId(null);
    setUserMenuOpen(false);
  }, [impersonatingFrom, profile, pushAudit]);

  // "Campaigns" top-nav handler: takes user to their highest-level view.
  const goToCampaigns = useCallbackApp(() => {
    setView("app");
    const me = users.find(u => u.id === profile.id);
    const hasViewAll = canDo("view_all_campaigns");
    if (hasViewAll || (me?.campaign_ids?.length || 0) > 1) {
      setActiveCampaignId(null);
    } else if (me?.campaign_ids?.length === 1) {
      setActiveCampaignId(me.campaign_ids[0]);
      setTab("overview");
    } else {
      setActiveCampaignId(null);
    }
  }, [users, profile, canDo]);

  // Campaigns the current profile may see (filtered)
  const visibleCampaigns = useMemoApp(() => {
    if (canDo("view_all_campaigns")) return campaigns;
    const me = users.find(u => u.id === profile.id);
    if (!me) return [];
    return campaigns.filter(c => me.campaign_ids.includes(c.id));
  }, [campaigns, users, profile, canDo]);

  // For users without view_all_campaigns: assign them to one campaign and route there.
  useEffectApp(() => {
    if (!canDo("view_all_campaigns") && view === "app" && activeCampaignId === null) {
      const me = users.find(u => u.id === profile.id);
      if (me && me.campaign_ids.length === 1) {
        setActiveCampaignId(me.campaign_ids[0]);
        setTab("overview");
      }
    }
  }, [profile.id, rolePerms, userOverrides, view, activeCampaignId]);

  // The mobile app is single-campaign — make sure one is selected.
  useEffectApp(() => {
    if (isMobile && activeCampaignId === null) {
      const c = visibleCampaigns[0] || campaigns[0];
      if (c) setActiveCampaignId(c.id);
    }
  }, [isMobile, activeCampaignId, visibleCampaigns, campaigns]);

  // Theme tweak
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "theme": "dark"
  }/*EDITMODE-END*/;
  const [tweaks, setTweak] = window.useTweaks
    ? window.useTweaks(TWEAK_DEFAULTS)
    : [TWEAK_DEFAULTS, () => {}];

  useEffectApp(() => {
    document.documentElement.setAttribute("data-theme", tweaks.theme || "dark");
  }, [tweaks.theme]);

  const activeCampaign = useMemoApp(
    () => campaigns.find(c => c.id === activeCampaignId),
    [campaigns, activeCampaignId]
  );

  // ---- Mutations ----
  const onAddLead = useCallbackApp((lead) => {
    if (!activeCampaign) return;
    const newLead = {
      id: "ld_" + Date.now(),
      campaign_id: activeCampaign.id,
      agent_id: lead.agent_id,
      seq: 9999999,
      created_at: new Date().toISOString(),
      date: lead.date,
      time: lead.time || "",
      customer_name: lead.customer_name,
      phone: lead.phone,
      address: lead.address || "",
      status: lead.status,
      client_commission: 0,
      spiff: lead.spiff || 0,
      tl_bonus: lead.tl_bonus || 0,
      tl_recipient_id: lead.tl_recipient_id || null,
      appointment_date: lead.appointment_date || null,
      appointment_time: lead.appointment_time || null,
      notes: lead.notes || "",
    };
    setLeads(prev => {
      const next = [...prev, newLead];
      U.recomputeCommissions(activeCampaign, next);
      return next;
    });
    pushAudit({
      kind: "lead.create",
      category: "leads",
      campaign_id: activeCampaign.id,
      campaign_name: activeCampaign.name,
      description: `Added lead “${newLead.customer_name}” (${newLead.status})`,
    });
  }, [activeCampaign, pushAudit]);

  const onUpdateLead = useCallbackApp((id, updates) => {
    setLeads(prev => {
      const before = prev.find(l => l.id === id);
      const next = prev.map(l => l.id === id ? { ...l, ...updates } : l);
      if (activeCampaign) U.recomputeCommissions(activeCampaign, next);
      // Audit
      if (before && activeCampaign) {
        if (updates.status && updates.status !== before.status) {
          pushAudit({
            kind: "lead.status",
            category: "leads",
            campaign_id: activeCampaign.id,
            campaign_name: activeCampaign.name,
            description: `Changed status of “${before.customer_name}”: ${before.status} → ${updates.status}`,
          });
        } else {
          pushAudit({
            kind: "lead.update",
            category: "leads",
            campaign_id: activeCampaign.id,
            campaign_name: activeCampaign.name,
            description: `Updated lead “${before.customer_name}”`,
          });
        }
      }
      return next;
    });
  }, [activeCampaign, pushAudit]);

  const onDeleteLead = useCallbackApp((id) => {
    setLeads(prev => {
      const before = prev.find(l => l.id === id);
      const next = prev.filter(l => l.id !== id);
      if (activeCampaign) U.recomputeCommissions(activeCampaign, next);
      if (before && activeCampaign) {
        pushAudit({
          kind: "lead.delete",
          category: "leads",
          campaign_id: activeCampaign.id,
          campaign_name: activeCampaign.name,
          description: `Deleted lead “${before.customer_name}”`,
        });
      }
      return next;
    });
  }, [activeCampaign, pushAudit]);

  const onAddAgent = useCallbackApp((campaignId, name, isTl) => {
    const a = {
      id: "ag_" + Date.now(),
      campaign_id: campaignId,
      full_name: name,
      agent_number: "A" + (1000 + Math.floor(Math.random() * 9000)),
      status: "active",
      is_tl: !!isTl,
      date_added: U.dayStr(window.MOCK_TODAY),
    };
    setAgents(prev => [...prev, a]);
    const c = campaigns.find(x => x.id === campaignId);
    pushAudit({
      kind: "agent.add",
      category: "agents",
      campaign_id: campaignId,
      campaign_name: c?.name,
      description: `Added agent ${name}${isTl ? " (Team Lead)" : ""}`,
    });
  }, [pushAudit, campaigns]);

  const onUpdateAgent = useCallbackApp((id, updates) => {
    const before = agents.find(a => a.id === id);
    // setState updater stays pure — the audit write happens outside it.
    setAgents(prev => prev.map(a => a.id === id ? { ...a, ...updates } : a));
    if (before) {
      const c = campaigns.find(x => x.id === before.campaign_id);
      let desc = `Updated agent ${before.full_name}`;
      if (updates.status === "removed") desc = `Removed agent ${before.full_name}`;
      else if (updates.status && updates.status !== before.status) desc = `${updates.status === "active" ? "Reactivated" : "Deactivated"} agent ${before.full_name}`;
      else if ("is_tl" in updates) desc = `${updates.is_tl ? "Promoted" : "Demoted"} ${before.full_name} ${updates.is_tl ? "to Team Lead" : "from Team Lead"}`;
      pushAudit({
        kind: updates.status === "removed" ? "agent.remove" : "agent.update",
        category: "agents",
        campaign_id: before.campaign_id,
        campaign_name: c?.name,
        description: desc,
      });
    }
  }, [agents, campaigns, pushAudit]);

  const onUpdateCampaign = useCallbackApp((updates) => {
    setCampaigns(prev => {
      const next = prev.map(c => c.id === activeCampaign.id ? { ...c, ...updates } : c);
      const updatedCampaign = next.find(c => c.id === activeCampaign.id);
      // Recompute leads with new rates
      setLeads(prevLeads => {
        const out = [...prevLeads];
        U.recomputeCommissions(updatedCampaign, out);
        return out;
      });
      return next;
    });
    pushAudit({
      kind: "campaign.update",
      category: "campaigns",
      campaign_id: activeCampaign.id,
      campaign_name: activeCampaign.name,
      description: `Updated ${activeCampaign.name} settings`,
    });
  }, [activeCampaign, pushAudit]);

  const onLogShift = useCallbackApp((date, count) => {
    if (!activeCampaign) return;
    setShiftLogs(prev => {
      const existing = prev.findIndex(s => s.campaign_id === activeCampaign.id && s.date === date);
      if (existing >= 0) {
        const next = [...prev]; next[existing] = { ...next[existing], agents_on_floor: count };
        return next;
      }
      return [...prev, { id: "sl_" + Date.now(), campaign_id: activeCampaign.id, date, agents_on_floor: count, notes: "" }];
    });
    pushAudit({
      kind: "shift.log",
      category: "floor",
      campaign_id: activeCampaign.id,
      campaign_name: activeCampaign.name,
      description: `Logged ${count} agents on floor for ${U.shortDate(date)}`,
    });
  }, [activeCampaign, pushAudit]);

  const onSetAttendance = useCallbackApp((agentId, date, status) => {
    setAttendanceOverrides(prev => ({ ...prev, [agentId + "|" + date]: status }));
    const a = agents.find(x => x.id === agentId);
    if (a && activeCampaign) {
      pushAudit({
        kind: "attendance.set",
        category: "floor",
        campaign_id: activeCampaign.id,
        campaign_name: activeCampaign.name,
        description: `Marked ${a.full_name} ${status} on ${U.shortDate(date)}`,
      });
    }
  }, [activeCampaign, agents, pushAudit]);

  const onNewCampaign = useCallbackApp((c) => {
    const id = "cmp_" + Date.now();
    const mark = c.name.split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase() || "XX";
    setCampaigns(prev => [...prev, { ...c, id, mark, created_at: U.dayStr(window.MOCK_TODAY), lead_count: 0, ia_count: 0, agent_count: 0 }]);
    setShowNewCampaign(false);
    pushAudit({
      kind: "campaign.create",
      category: "campaigns",
      campaign_id: id,
      campaign_name: c.name,
      description: `Created campaign “${c.name}” for ${c.client}`,
    });
  }, [pushAudit]);

  const onDeleteCampaign = useCallbackApp(() => {
    if (!activeCampaign) return;
    const cid = activeCampaign.id;
    const cname = activeCampaign.name;
    setCampaigns(prev => prev.filter(c => c.id !== cid));
    setLeads(prev => prev.filter(l => l.campaign_id !== cid));
    setAgents(prev => prev.filter(a => a.campaign_id !== cid));
    setShiftLogs(prev => prev.filter(s => s.campaign_id !== cid));
    // Clear attendance overrides tied to this campaign's agents
    setAttendanceOverrides(prev => {
      const next = { ...prev };
      Object.keys(next).forEach(k => {
        const agentId = k.split("|")[0];
        const a = agents.find(x => x.id === agentId);
        if (a && a.campaign_id === cid) delete next[k];
      });
      return next;
    });
    // Remove campaign from user assignments
    setUsers(prev => prev.map(u => ({ ...u, campaign_ids: u.campaign_ids.filter(x => x !== cid) })));
    pushAudit({
      kind: "campaign.delete",
      category: "campaigns",
      campaign_id: cid,
      campaign_name: cname,
      description: `Deleted campaign “${cname}” and all its data`,
    });
    setActiveCampaignId(null);
  }, [activeCampaign, agents, pushAudit]);

  // ---- User mutations ----
  // Creates a real login account via the invite-user Edge Function (which
  // holds the service-role key). The admin sets the password. Returns
  // { ok: true } or { error: "..." } so the modal can show the result.
  const onInviteUser = useCallbackApp(async (data) => {
    const buildRosterUser = () => {
      const initials = (data.full_name || data.email).split(" ").map(x => x[0]).join("").slice(0, 2).toUpperCase();
      return {
        id: "u_" + Date.now(), initials,
        full_name: data.full_name,
        email: data.email,
        role: data.role,
        campaign_ids: data.campaign_ids || [],
        status: "active",
        last_active: null,
        created_at: new Date().toISOString(),
      };
    };
    if (!window.SB || !window.SB.client) {
      setUsers(prev => [...prev, buildRosterUser()]);
      return { ok: true };
    }
    try {
      const { data: res, error } = await window.SB.client.functions.invoke("invite-user", {
        body: {
          email: data.email,
          full_name: data.full_name,
          role: data.role,
          campaign_ids: data.campaign_ids || [],
          password: data.password,
        },
      });
      if (error) return { error: "Couldn't reach the invite service — is the Edge Function deployed?" };
      if (!res || !res.ok) return { error: (res && res.error) || "Invite failed." };
    } catch (e) {
      return { error: (e && e.message) || String(e) };
    }
    setUsers(prev => [...prev, buildRosterUser()]);
    pushAudit({
      kind: "user.invite",
      category: "users",
      campaign_id: null,
      campaign_name: null,
      description: `Created account for ${data.email} as ${data.role}`,
    });
    return { ok: true };
  }, [pushAudit]);

  const onUpdateUserMut = useCallbackApp((id, updates) => {
    setUsers(prev => prev.map(u => u.id === id ? { ...u, ...updates } : u));
    const u = users.find(x => x.id === id);
    if (u) {
      pushAudit({
        kind: "user.update",
        category: "users",
        campaign_id: null,
        campaign_name: null,
        description: `Updated ${u.full_name}’s account`,
      });
    }
  }, [users, pushAudit]);

  const onSuspendUser = useCallbackApp((id) => {
    setUsers(prev => prev.map(u => {
      if (u.id !== id) return u;
      const next = u.status === "suspended" ? "active" : "suspended";
      return { ...u, status: next };
    }));
    const u = users.find(x => x.id === id);
    if (u) {
      const next = u.status === "suspended" ? "active" : "suspended";
      pushAudit({
        kind: next === "suspended" ? "user.suspend" : "user.update",
        category: "users",
        description: next === "suspended" ? `Suspended ${u.full_name}` : `Reactivated ${u.full_name}`,
      });
    }
  }, [users, pushAudit]);

  const onDeleteUser = useCallbackApp((id) => {
    const u = users.find(x => x.id === id);
    setUsers(prev => prev.filter(x => x.id !== id));
    if (u) {
      pushAudit({
        kind: "user.delete",
        category: "users",
        description: `Deleted user ${u.full_name} (${u.email})`,
      });
    }
  }, [users, pushAudit]);

  const onResendInvite = useCallbackApp((id) => {
    const u = users.find(x => x.id === id);
    if (u) {
      pushAudit({
        kind: "user.invite",
        category: "users",
        description: `Re-sent invite to ${u.email}`,
      });
    }
  }, [users, pushAudit]);

  // ---- Permission mutations ----
  const onUpdateRolePerms = useCallbackApp((role, key, val) => {
    setRolePerms(prev => {
      const next = { ...prev };
      const roleOv = { ...(next[role] || {}) };
      if (key === "__reset__") {
        next[role] = {};
      } else {
        // If toggling to the default value, remove the override; otherwise set it
        const defaultVal = window.ROLE_DEFAULTS[role]?.[key];
        if (val === defaultVal) delete roleOv[key];
        else roleOv[key] = val;
        next[role] = roleOv;
      }
      return next;
    });
    pushAudit({
      kind: "permissions.update",
      category: "users",
      description: key === "__reset__"
        ? `Reset ${role} role permissions to defaults`
        : `Set “${key}” to ${val ? "allowed" : "denied"} for ${role}s`,
    });
  }, [pushAudit]);

  const onUpdateUserOverrides = useCallbackApp((userId, overrides) => {
    setUserOverrides(prev => ({ ...prev, [userId]: overrides }));
    const u = users.find(x => x.id === userId);
    if (u) {
      const n = Object.keys(overrides).length;
      pushAudit({
        kind: "permissions.user",
        category: "users",
        description: n === 0
          ? `Cleared all permission overrides for ${u.full_name}`
          : `Updated permission overrides for ${u.full_name} (${n} active)`,
      });
    }
  }, [users, pushAudit]);

  // ---- Render ----
  if (signedOut) {
    return (
      <div className="signin">
        <div className="signin-card">
          <div className="brand" style={{ justifyContent: "center", marginBottom: 18 }}>
            <div className="brand-mark" style={{ width: 28, height: 28, fontSize: 14 }}>CO</div>
            <span style={{ fontSize: 16 }}>CallOps</span>
          </div>
          <h2 style={{ margin: "0 0 4px", fontSize: 18, fontWeight: 600, textAlign: "center" }}>Welcome back</h2>
          <p style={{ margin: "0 0 18px", fontSize: 13, color: "var(--text-3)", textAlign: "center" }}>
            Sign in to your account to manage campaigns.
          </p>
          <div className="stack">
            <div className="field">
              <label>Email</label>
              <input className="input" defaultValue={profile.email} readOnly/>
            </div>
            <div className="field">
              <label>Password</label>
              <input className="input" type="password" defaultValue="••••••••••••" readOnly/>
            </div>
            <button className="btn btn-primary btn-lg" style={{ width: "100%", justifyContent: "center", marginTop: 4 }} onClick={() => {
              setSignedOut(false);
              pushAudit({ kind: "auth.signin", category: "auth", description: "Signed in" });
            }}>
              Sign in
            </button>
          </div>
          <div className="help" style={{ textAlign: "center", marginTop: 14 }}>
            Demo — click <strong style={{ color: "var(--text-2)" }}>Sign in</strong> to return.
          </div>
        </div>
      </div>
    );
  }

  // ---- Mobile app — rendered on phones, reuses all state + handlers ----
  if (isMobile && window.__CallOpsMobile) {
    const MobileApp = window.__CallOpsMobile;
    const mobileCampaign = activeCampaign || visibleCampaigns[0] || campaigns[0];
    if (mobileCampaign) {
      return (
        <MobileApp
          campaign={mobileCampaign}
          agents={agents}
          leads={leads}
          attendanceOverrides={attendanceOverrides}
          profile={profile}
          users={users}
          auditLog={auditLog}
          rolePerms={rolePerms}
          userOverrides={userOverrides}
          canDo={canDo}
          handlers={{
            onAddLead, onUpdateLead, onDeleteLead, onUpdateCampaign,
            onInviteUser, onUpdateUser: onUpdateUserMut, onSuspendUser,
            onDeleteUser, onResendInvite, onUpdateRolePerms, onUpdateUserOverrides,
            onSignOut: () => {
              pushAudit({ kind: "auth.signout", category: "auth", description: "Signed out" });
              setSignedOut(true);
            },
          }}
        />
      );
    }
  }

  return (
    <div className="app-shell">
      <div className="topbar">
        <div className="brand" onClick={goToCampaigns}>
          <div className="brand-mark">CO</div>
          <span>CallOps</span>
        </div>
        <div className="top-nav">
          <button
            className={"top-tab" + (view === "app" ? " active" : "")}
            onClick={goToCampaigns}
          >
            Campaigns
            {activeCampaign && (
              <span style={{ color: "var(--text-3)", marginLeft: 6, fontWeight: 400 }}>/ {activeCampaign.name}</span>
            )}
          </button>
          {(canDo("manage_users") || canDo("manage_permissions") || canDo("view_audit_log")) && (
            <button
              className={"top-tab" + (view === "admin" ? " active" : "")}
              onClick={() => { setView("admin"); setActiveCampaignId(null); }}
            >
              Admin tools
            </button>
          )}
        </div>
        <div className="topbar-right">
          <span className="help" style={{ marginRight: 6 }}>{U.dayOfWeekFull(initial.today)} · {U.shortDate(initial.today)}</span>
          <button
            className="icon-btn"
            title="Toggle theme"
            onClick={() => setTweak("theme", tweaks.theme === "dark" ? "light" : "dark")}
          >
            <Icon name={tweaks.theme === "dark" ? "sun" : "moon"} size={13}/>
          </button>
          <button
            ref={userMenuRef}
            className="user-chip"
            style={{ cursor: "pointer", border: "1px solid var(--border)", background: "var(--bg-elev)" }}
            onClick={() => setUserMenuOpen(o => !o)}
          >
            <span className="avatar">{profile.initials}</span>
            <span>{profile.full_name.split(" ")[0]}</span>
            <span className="tag tag-admin" style={{ marginLeft: 4 }}>{profile.role}</span>
            <Icon name="chevron" size={11} style={{ marginLeft: 2, opacity: 0.7 }}/>
          </button>
          <Popover open={userMenuOpen} anchorRef={userMenuRef} onClose={() => setUserMenuOpen(false)} align="end">
            <div style={{ padding: "10px 12px", borderBottom: "1px solid var(--border-subtle)", minWidth: 220 }}>
              <div style={{ fontWeight: 500, fontSize: 13 }}>{profile.full_name}</div>
              <div style={{ fontSize: 11.5, color: "var(--text-3)" }}>{profile.email}</div>
              <div style={{ marginTop: 6 }}>
                <span className="tag tag-admin">{profile.role}</span>
              </div>
            </div>
            <div style={{ padding: 4 }}>
              {(canDo("manage_users") || canDo("manage_permissions") || canDo("view_audit_log")) && (
                <div
                  className="popover-item"
                  onClick={() => {
                    setUserMenuOpen(false);
                    setView("admin");
                    setActiveCampaignId(null);
                  }}
                >
                  <Icon name="settings" size={13}/>
                  <span>Admin tools</span>
                  <span style={{ marginLeft: "auto", fontSize: 10, color: "var(--text-4)" }}>users · audit</span>
                </div>
              )}
              {impersonatingFrom && (
                <div
                  className="popover-item"
                  style={{ color: "var(--money-spiff)" }}
                  onClick={stopImpersonate}
                >
                  <Icon name="refresh" size={13}/>
                  <span>Stop viewing as {profile.full_name.split(" ")[0]}</span>
                </div>
              )}
              <div
                className="popover-item"
                onClick={() => {
                  setTweak("theme", tweaks.theme === "dark" ? "light" : "dark");
                  setUserMenuOpen(false);
                }}
              >
                <Icon name={tweaks.theme === "dark" ? "sun" : "moon"} size={13}/>
                <span>{tweaks.theme === "dark" ? "Light theme" : "Dark theme"}</span>
              </div>
              <div style={{ height: 1, background: "var(--border-subtle)", margin: "4px 4px" }}/>
              <div
                className="popover-item"
                style={{ color: "var(--status-dnc-fg)" }}
                onClick={() => {
                  setUserMenuOpen(false);
                  pushAudit({ kind: "auth.signout", category: "auth", description: "Signed out" });
                  setSignedOut(true);
                }}
              >
                <Icon name="arrowLeft" size={13}/>
                <span>Sign out</span>
              </div>
            </div>
          </Popover>
        </div>
      </div>

      {impersonatingFrom && (
        <div className="imp-banner">
          <span className="dot"/>
          <span>
            Viewing as <strong style={{ color: "var(--text)" }}>{profile.full_name}</strong>
            <span style={{ color: "var(--text-3)" }}> ({profile.role}) — your actions and audit entries reflect their account.</span>
          </span>
          <button
            className="btn btn-sm"
            style={{ marginLeft: "auto" }}
            onClick={stopImpersonate}
          >
            <Icon name="refresh" size={11}/> Return to {impersonatingFrom.full_name.split(" ")[0]}
          </button>
        </div>
      )}

      {view === "admin" && (canDo("manage_users") || canDo("manage_permissions") || canDo("view_audit_log")) ? (
        <AdminTools
          users={users}
          campaigns={campaigns}
          auditLog={auditLog}
          profile={profile}
          rolePerms={rolePerms}
          userOverrides={userOverrides}
          onInviteUser={onInviteUser}
          onUpdateUser={onUpdateUserMut}
          onSuspendUser={onSuspendUser}
          onDeleteUser={onDeleteUser}
          onResendInvite={onResendInvite}
          onUpdateRolePerms={onUpdateRolePerms}
          onUpdateUserOverrides={onUpdateUserOverrides}
          onImpersonate={startImpersonate}
          onBack={() => setView("app")}
        />
      ) : activeCampaign ? (
        <CampaignShell
          campaign={activeCampaign}
          tab={tab}
          onTab={handleTab}
          agentDetailId={agentDetailId}
          openAgent={openAgent}
          onCloseAgent={() => setAgentDetailId(null)}
          profile={profile}
          canDo={canDo}
          agents={agents}
          leads={leads}
          shiftLogs={shiftLogs}
          attendanceOverrides={attendanceOverrides}
          onAddLead={onAddLead}
          onUpdateLead={onUpdateLead}
          onDeleteLead={onDeleteLead}
          onAddAgent={onAddAgent}
          onUpdateAgent={onUpdateAgent}
          onUpdateCampaign={onUpdateCampaign}
          onLogShift={onLogShift}
          onSetAttendance={onSetAttendance}
          onInviteUser={onInviteUser}
          onDeleteCampaign={onDeleteCampaign}
        />
      ) : profile.role === "admin" || visibleCampaigns.length > 1 ? (
        <Directory
          campaigns={visibleCampaigns}
          agents={agents}
          leads={leads}
          profile={profile}
          canDo={canDo}
          onOpen={(id) => { setActiveCampaignId(id); setTab("overview"); }}
          onNewCampaign={() => setShowNewCampaign(true)}
        />
      ) : (
        <div className="empty" style={{ margin: 48 }}>
          <h3>No campaign assigned</h3>
          <p>Ask an admin to add you to a campaign.</p>
        </div>
      )}

      {showNewCampaign && (
        <NewCampaignModal onClose={() => setShowNewCampaign(false)} onSave={onNewCampaign}/>
      )}

      {/* Tweaks panel */}
      {window.TweaksPanel && (
        <window.TweaksPanel title="Tweaks">
          <window.TweakSection label="Appearance">
            <window.TweakRadio
              label="Theme"
              value={tweaks.theme}
              options={[{ value: "dark", label: "Dark" }, { value: "light", label: "Light" }]}
              onChange={(v) => setTweak("theme", v)}
            />
          </window.TweakSection>
          <window.TweakSection label="Demo">
            <div style={{ fontSize: 12, color: "var(--text-3)", lineHeight: 1.55, padding: "0 14px 6px" }}>
              All interactions work on local state. Refresh to reset demo data.
            </div>
          </window.TweakSection>
        </window.TweaksPanel>
      )}
    </div>
  );
}

// ─── Root: auth gate wrapping the app ──────────────────────────
// When CONFIG.USE_SUPABASE is false → renders <App/> as before (demo mode).
// When true → checks session/profile and renders AuthScreen if not allowed.
function Root() {
  const useSupabase = !!(window.CONFIG && window.CONFIG.USE_SUPABASE && window.SB);
  const [state, setState] = useStateApp(useSupabase ? "loading" : "ready");
  const [profile, setProfile] = useStateApp(null);

  useEffectApp(() => {
    if (!useSupabase) return;
    let cancelled = false;

    async function check() {
      try {
        const session = await window.SB.auth.getSession();
        if (cancelled) return;
        if (!session) { setState("signedout"); return; }
        const p = await window.SB.auth.getProfile();
        if (cancelled) return;
        if (!p) { setState("denied"); return; }
        // Map Supabase profile shape → app's expected shape (initials, etc.)
        const mapped = {
          id: p.id,
          email: p.email,
          full_name: p.full_name || p.email,
          initials: (p.full_name || p.email).split(/\s+/).map(s => s[0]).slice(0, 2).join("").toUpperCase() || "U",
          role: p.role,
        };
        setProfile(mapped);
        setState("ready");
      } catch (e) {
        console.error(e);
        if (!cancelled) setState("signedout");
      }
    }
    check();

    const unsub = window.SB.auth.onAuthChange((event) => {
      if (event === "SIGNED_IN" || event === "TOKEN_REFRESHED") check();
      if (event === "SIGNED_OUT") setState("signedout");
    });
    return () => { cancelled = true; unsub && unsub(); };
  }, [useSupabase]);

  if (state === "loading")    return <div className="auth-screen"><div className="auth-card auth-loading">Loading…</div></div>;
  if (state === "signedout")  return <AuthScreen mode="signin" />;
  if (state === "denied")     return <AuthScreen mode="denied" />;
  return <App authedProfile={profile} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);

</script>
</body>
</html>
