  <script type="text/babel">
// Overview — first tab of every campaign. Headline KPIs, week-over-week, top performers, activity.
const { useMemo: useMemoOV } = React;

function Overview({ campaign, agents, leads, shiftLogs, attendanceOverrides, onJumpTab, onOpenAgent }) {
  const today = window.MOCK_DATA?.today;
  const todayDate = window.MOCK_TODAY;

  // This week & last week ranges (Mon-Sun)
  const tw = useMemoOV(() => {
    const s = U.startOfWeek(todayDate), e = U.endOfWeek(todayDate);
    return { start: U.dayStr(s), end: U.dayStr(e), label: "This week" };
  }, []);
  // Week-over-week deltas compare COMPLETED days only — never today (still in
  // progress) and never a partial week against a full one. elapsedDays counts
  // the finished days of the current week (0 on Monday → delta suppressed).
  const elapsedDays = (todayDate.getDay() + 6) % 7;
  const cmp = useMemoOV(() => {
    const wkStart = U.startOfWeek(todayDate);
    const curEnd = new Date(todayDate); curEnd.setDate(curEnd.getDate() - 1);
    const prevStart = new Date(wkStart); prevStart.setDate(prevStart.getDate() - 7);
    const prevEnd = new Date(prevStart); prevEnd.setDate(prevEnd.getDate() + elapsedDays - 1);
    const DOW = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
    return {
      hasData: elapsedDays > 0,
      curStart: U.dayStr(wkStart),
      curEnd: U.dayStr(curEnd),
      prevStart: U.dayStr(prevStart),
      prevEnd: U.dayStr(prevEnd),
      through: elapsedDays > 0 ? DOW[elapsedDays - 1] : "",
    };
  }, []);

  // Helpers
  const inRange = (l, r) => l.date >= r.start && l.date <= r.end;

  const camLeads = useMemoOV(() => leads.filter(l => l.campaign_id === campaign.id), [leads, campaign.id]);
  const camAgents = useMemoOV(() => agents.filter(a => a.campaign_id === campaign.id), [agents, campaign.id]);
  const activeAgents = camAgents.filter(a => a.status === "active");

  const twLeads = useMemoOV(() => camLeads.filter(l => inRange(l, tw)), [camLeads, tw]);
  // Completed-days lead sets the week-over-week deltas are measured on.
  const cmpCur = useMemoOV(() => cmp.hasData ? camLeads.filter(l => l.date >= cmp.curStart && l.date <= cmp.curEnd) : [], [camLeads, cmp]);
  const cmpPrev = useMemoOV(() => cmp.hasData ? camLeads.filter(l => l.date >= cmp.prevStart && l.date <= cmp.prevEnd) : [], [camLeads, cmp]);
  const todayLeads = useMemoOV(() => camLeads.filter(l => l.date === today), [camLeads, today]);

  const sum = (arr, fn) => arr.reduce((s, x) => s + (fn(x) || 0), 0);
  const count = (arr, fn) => arr.filter(fn).length;

  // Card values = live week-to-date (today included).
  const twBill = sum(twLeads, l => l.client_commission);
  const twIA = count(twLeads, l => l.status === "ia");
  const twLeadCount = twLeads.length;

  // Deltas = completed days this week vs the same completed days last week.
  const cmpCurBill = sum(cmpCur, l => l.client_commission);
  const cmpPrevBill = sum(cmpPrev, l => l.client_commission);
  const billDelta = cmpPrevBill > 0 ? (cmpCurBill - cmpPrevBill) / cmpPrevBill : 0;

  const cmpCurIA = count(cmpCur, l => l.status === "ia");
  const cmpPrevIA = count(cmpPrev, l => l.status === "ia");
  const iaDelta = cmpPrevIA > 0 ? (cmpCurIA - cmpPrevIA) / cmpPrevIA : 0;

  const cmpCurLeads = cmpCur.length;
  const cmpPrevLeads = cmpPrev.length;
  const leadDelta = cmpPrevLeads > 0 ? (cmpCurLeads - cmpPrevLeads) / cmpPrevLeads : 0;

  // Agents on the floor today — derived from the Attendance tab (the shift
  // logger was removed). onFloor stays null until attendance is taken today.
  const todayFloor = useMemoOV(() => {
    const present = {};
    const reportDays = new Set();
    ((window.MOCK_DATA && window.MOCK_DATA.attendance) || []).forEach(r => {
      if (r.campaign_id !== campaign.id) return;
      present[r.agent_id + "|" + r.date] = true;
      reportDays.add(r.date);
    });
    const taken = reportDays.has(today) ||
      Object.keys(attendanceOverrides || {}).some(k => k.endsWith("|" + today));
    if (!taken) return { onFloor: null, taken: false };
    const statusFor = (agent) => {
      const ov = attendanceOverrides && attendanceOverrides[agent.id + "|" + today];
      if (ov) return ov;
      if (agent.date_added && today < agent.date_added) return "off";
      if (agent.date_removed && today > agent.date_removed) return "off";
      if (!reportDays.has(today)) return "off";
      return present[agent.id + "|" + today] ? "present" : "absent";
    };
    let n = 0;
    camAgents.forEach(a => { if (statusFor(a) === "present") n++; });
    return { onFloor: n, taken: true };
  }, [camAgents, attendanceOverrides, campaign.id, today]);

  // Today snapshot
  const todaySnapshot = useMemoOV(() => {
    return {
      onFloor: todayFloor.onFloor,
      total: todayLeads.length,
      ia: count(todayLeads, l => l.status === "ia"),
      confirmed: count(todayLeads, l => l.status === "confirmed"),
      transfer: count(todayLeads, l => l.status === "transfer"),
      pending: count(todayLeads, l => l.status === "pending"),
      bill: sum(todayLeads, l => l.client_commission),
    };
  }, [todayLeads, todayFloor]);

  // Top performers (this week, by IA + confirms)
  const topPerformers = useMemoOV(() => {
    const byAgent = {};
    twLeads.forEach(l => {
      const r = (byAgent[l.agent_id] ||= { agent_id: l.agent_id, ia: 0, confirmed: 0, transfer: 0, bill: 0 });
      r[l.status] = (r[l.status] || 0) + 1;
      r.bill += l.client_commission || 0;
    });
    return Object.values(byAgent)
      .map(r => ({ ...r, agent: agents.find(a => a.id === r.agent_id), score: r.ia + r.confirmed }))
      .filter(r => r.agent)
      .sort((a, b) => b.score - a.score || b.bill - a.bill)
      .slice(0, 5);
  }, [twLeads, agents]);

  // Recent activity (last 6 leads by date desc, seq desc)
  const recent = useMemoOV(() => {
    return [...camLeads]
      .sort((a, b) => b.date.localeCompare(a.date) || (b.seq ?? 0) - (a.seq ?? 0))
      .slice(0, 6);
  }, [camLeads]);

  // Every week of the campaign — room-wide weekly lead-flow line chart.
  const roomWeeks = useMemoOV(() => {
    const dates = camLeads.map(l => l.date);
    const earliest = dates.length ? dates.reduce((a, b) => a < b ? a : b) : null;
    let startISO = campaign.created_at;
    if (!startISO || startISO === "0000-01-01") startISO = earliest || U.dayStr(todayDate);
    else if (earliest && earliest < startISO) startISO = earliest;
    const weeks = [];
    let cur = U.startOfWeek(U.parseDate(startISO));
    let guard = 0;
    while (cur <= todayDate && guard < 400) {
      const wkStart = U.dayStr(cur);
      const wkEndD = new Date(cur); wkEndD.setDate(wkEndD.getDate() + 6);
      weeks.push({ label: U.weekLabel(wkStart), start: wkStart, end: U.dayStr(wkEndD), transferred: 0, ia: 0, confirmed: 0 });
      cur = new Date(cur); cur.setDate(cur.getDate() + 7);
      guard++;
    }
    camLeads.forEach(l => {
      const w = weeks.find(x => l.date >= x.start && l.date <= x.end);
      if (!w) return;
      if (l.status !== "pending") w.transferred++;
      if (l.status === "ia") w.ia++;
      if (l.status === "confirmed") w.confirmed++;
    });
    return weeks;
  }, [camLeads, campaign.created_at]);

  // Attention items
  const attentionItems = useMemoOV(() => {
    const items = [];
    // Agents with 5+ transfers and 0 conversions this week
    const byAgent = {};
    twLeads.forEach(l => {
      const r = (byAgent[l.agent_id] ||= { transfer: 0, ia: 0, confirmed: 0 });
      r[l.status] = (r[l.status] || 0) + 1;
    });
    Object.entries(byAgent).forEach(([agentId, r]) => {
      if (r.transfer >= 5 && (r.ia + r.confirmed) === 0) {
        const a = agents.find(x => x.id === agentId);
        if (a) items.push({
          kind: "warn",
          title: `${a.full_name} — ${r.transfer} transfers, 0 conversions this week`,
          action: "Open Agent Report",
          tab: "agent_report"
        });
      }
    });
    // Attendance not taken for today
    if (!todayFloor.taken && U.parseDate(today).getDay() >= 1 && U.parseDate(today).getDay() <= 5) {
      items.push({
        kind: "info",
        title: "No attendance taken for today — mark agents present in the Attendance tab",
        action: "Take attendance",
        tab: "attendance"
      });
    }
    // Pending leads to follow up on (older than 3 days)
    const old = U.dayStr(new Date(todayDate.getTime() - 3 * 86400000));
    const stale = camLeads.filter(l => l.status === "pending" && l.date < old).length;
    if (stale >= 5) {
      items.push({
        kind: "info",
        title: `${stale} pending leads are 3+ days old — consider closing or following up`,
        action: "Open Lead Log",
        tab: "lead_log"
      });
    }
    return items.slice(0, 4);
  }, [twLeads, camLeads, agents, todayFloor]);

  return (
    <div className="tab-content">
      {/* Greeting + headline KPIs */}
      <div style={{ marginBottom: 18 }}>
        <div style={{ fontSize: 12, color: "var(--text-3)", textTransform: "uppercase", letterSpacing: "0.05em" }}>
          {U.dayOfWeekFull(today)} · {U.shortDate(today)}
        </div>
        <h1 style={{ margin: "6px 0 0", fontSize: 22, fontWeight: 600, letterSpacing: "-0.02em" }}>
          {campaign.name}
          <span style={{ color: "var(--text-3)", fontWeight: 400, marginLeft: 10, fontSize: 14 }}>
            {campaign.client}
          </span>
        </h1>
      </div>

      {/* Needs attention — surfaced at the top so it's seen first */}
      {attentionItems.length > 0 && (
        <div className="card" style={{ padding: 16, marginBottom: 16 }}>
          <h3 style={{ margin: "0 0 10px", fontSize: 13, fontWeight: 600 }}>Needs attention</h3>
          <div style={{ display: "flex", flexDirection: "column", gap: 0 }}>
            {attentionItems.map((it, i) => (
              <div key={i} style={{
                display: "flex", alignItems: "center", gap: 12,
                padding: "10px 0",
                borderTop: i === 0 ? "none" : "1px solid var(--border-subtle)",
              }}>
                <span style={{
                  width: 6, height: 6, borderRadius: 999,
                  background: it.kind === "warn" ? "var(--status-dnc-fg)" : "var(--money-spiff)",
                }}/>
                <span style={{ fontSize: 12.5, color: "var(--text-2)", flex: 1 }}>{it.title}</span>
                <button className="btn btn-sm" onClick={() => onJumpTab(it.tab)}>
                  {it.action} <Icon name="chevronRight" size={11}/>
                </button>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Headline KPIs — this week */}
      <div className="kpi-grid" style={{ marginBottom: 16 }}>
        <Kpi
          tone="accent"
          label="Bill (this week)"
          value={U.fmtMoney(twBill)}
          sub={<DeltaSub delta={billDelta} prev={cmpPrevBill} format={U.fmtMoney} cmp={cmp}/>}
        />
        <Kpi
          label="Leads (this week)"
          value={U.fmtNum(twLeadCount, { dashZero: true })}
          sub={<DeltaSub delta={leadDelta} prev={cmpPrevLeads} format={U.fmtNum} cmp={cmp}/>}
        />
        <Kpi
          tone="tl"
          label="IAs (this week)"
          value={U.fmtNum(twIA, { dashZero: true })}
          sub={<DeltaSub delta={iaDelta} prev={cmpPrevIA} format={U.fmtNum} cmp={cmp}/>}
        />
        <Kpi
          label="Active roster"
          value={U.fmtNum(activeAgents.length)}
          sub={`${activeAgents.filter(a => a.is_tl).length} team lead${activeAgents.filter(a => a.is_tl).length === 1 ? "" : "s"}`}
        />
      </div>

      {/* Room-wide weekly lead flow */}
      <div className="card" style={{ padding: "16px 18px", marginBottom: 12 }}>
        <div className="spread" style={{ marginBottom: 4, gap: 12, flexWrap: "wrap" }}>
          <h3 style={{ margin: 0, fontSize: 13, fontWeight: 600 }}>
            Lead flow
            <span style={{ marginLeft: 8, fontSize: 11, color: "var(--text-3)", fontWeight: 400 }}>· every week, whole room</span>
          </h3>
          <div style={{ display: "flex", gap: 14, fontSize: 11, color: "var(--text-3)" }}>
            <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
              <span style={{ width: 16, height: 2, background: "var(--text-3)", borderRadius: 2 }}/> Transferred
            </span>
            <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
              <span style={{ width: 16, height: 2, background: "var(--money-pos)", borderRadius: 2 }}/> Converted
            </span>
          </div>
        </div>
        <WeeklyTrendChart weeks={roomWeeks}/>
      </div>

      {/* Multi-week trend table */}
      <WeeklyStats campaign={campaign} leads={leads} shiftLogs={shiftLogs} agents={agents} attendanceOverrides={attendanceOverrides} className="" />
      <div style={{ height: 12 }}/>

      {/* 3-column row: Today · Recent activity · Top performers */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12, marginBottom: 12 }}>
        {/* Today */}
        <div className="card" style={{ padding: 16, display: "flex", flexDirection: "column" }}>
          <div className="spread" style={{ marginBottom: 14 }}>
            <h3 style={{ margin: 0, fontSize: 13, fontWeight: 600 }}>
              Today
              <span style={{ marginLeft: 8, fontSize: 11, color: "var(--text-3)", fontWeight: 400 }}>
                · {U.dayOfWeekFull(today)}
              </span>
            </h3>
            <button className="btn btn-sm btn-ghost" onClick={() => onJumpTab("lead_log")}>
              <Icon name="chevronRight" size={11}/>
            </button>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 12, marginBottom: 14 }}>
            <StatTile label="On Floor" value={todaySnapshot.onFloor ?? "—"} tone="text"/>
            <StatTile label="Total Leads" value={todaySnapshot.total} tone="text" bold/>
            <StatTile label="IAs" value={todaySnapshot.ia} tone="ia"/>
            <StatTile label="Confirms" value={todaySnapshot.confirmed} tone="pos"/>
          </div>
          {todaySnapshot.total > 0 ? (
            <div style={{ marginTop: "auto" }}>
              <StatusBar leads={todayLeads}/>
              <div className="help" style={{ marginTop: 10, paddingTop: 10, borderTop: "1px solid var(--border-subtle)" }}>
                Billing today <span className="mono money-pos" style={{ fontWeight: 600 }}>{U.fmtMoney(todaySnapshot.bill)}</span>
                {todaySnapshot.onFloor != null && (
                  <span>
                    {"  ·  "}lead : agent{" "}
                    <span className="mono" style={{ color: "var(--text)" }}>
                      {(todaySnapshot.total / todaySnapshot.onFloor).toFixed(2)}
                    </span>
                  </span>
                )}
              </div>
            </div>
          ) : (
            <div className="help" style={{ marginTop: "auto", paddingTop: 14, borderTop: "1px solid var(--border-subtle)" }}>No leads logged today yet.</div>
          )}
        </div>

        {/* Recent activity */}
        <div className="card" style={{ padding: 16, display: "flex", flexDirection: "column" }}>
          <div className="spread" style={{ marginBottom: 8 }}>
            <h3 style={{ margin: 0, fontSize: 13, fontWeight: 600 }}>Recent activity</h3>
            <button className="btn btn-sm btn-ghost" onClick={() => onJumpTab("lead_log")}>
              All <Icon name="chevronRight" size={11}/>
            </button>
          </div>
          {recent.length === 0 ? (
            <div className="help" style={{ padding: "10px 0" }}>No leads yet.</div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column" }}>
              {recent.map((l, i) => {
                const a = agents.find(x => x.id === l.agent_id);
                return (
                  <div key={l.id} style={{
                    display: "grid",
                    gridTemplateColumns: "auto 1fr auto",
                    gap: 8,
                    padding: "8px 0",
                    borderTop: i === 0 ? "none" : "1px solid var(--border-subtle)",
                    alignItems: "center",
                    fontSize: 12,
                  }}>
                    <Pill status={l.status}/>
                    <div style={{ minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                      <strong style={{ fontWeight: 500 }}>{l.customer_name ? U.toProperCase(l.customer_name) : "—"}</strong>
                      <span style={{ color: "var(--text-3)" }}> · {a?.full_name || "—"}</span>
                    </div>
                    <span className="mono money-pos" style={{ fontSize: 11.5, minWidth: 36, textAlign: "right" }}>
                      {l.client_commission > 0 ? U.fmtMoney(l.client_commission) : <span className="muted-2">—</span>}
                    </span>
                  </div>
                );
              })}
            </div>
          )}
        </div>

        {/* Top performers */}
        <div className="card" style={{ padding: 16, display: "flex", flexDirection: "column" }}>
          <div className="spread" style={{ marginBottom: 8 }}>
            <h3 style={{ margin: 0, fontSize: 13, fontWeight: 600 }}>
              Top performers
              <span style={{ marginLeft: 6, fontSize: 11, color: "var(--text-3)", fontWeight: 400 }}>· this week</span>
            </h3>
            <button className="btn btn-sm btn-ghost" onClick={() => onJumpTab("agent_report")}>
              Full <Icon name="chevronRight" size={11}/>
            </button>
          </div>
          {topPerformers.length === 0 ? (
            <div className="help" style={{ padding: "10px 0" }}>No conversions this week.</div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column" }}>
              {topPerformers.map((r, idx) => (
                <div key={r.agent_id}
                  onClick={() => onOpenAgent && onOpenAgent(r.agent_id)}
                  title="Open agent report"
                  style={{
                  display: "grid",
                  gridTemplateColumns: "16px 1fr auto auto auto",
                  gap: 10,
                  padding: "8px 0",
                  borderTop: idx === 0 ? "none" : "1px solid var(--border-subtle)",
                  alignItems: "center",
                  fontSize: 12,
                  cursor: "pointer",
                }}>
                  <span className="mono" style={{ color: "var(--text-4)", fontSize: 11 }}>{idx + 1}</span>
                  <span style={{ minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                    {r.agent.full_name}
                    {r.agent.is_tl && <TLBadge small/>}
                  </span>
                  <span className="mono" style={{ color: r.ia ? "var(--status-ia-fg)" : "var(--text-4)", fontSize: 11.5, minWidth: 24, textAlign: "right" }}>{r.ia || "—"}<span style={{ fontSize: 9, color: "var(--text-4)", marginLeft: 2 }}>i</span></span>
                  <span className="mono" style={{ color: r.confirmed ? "var(--money-pos)" : "var(--text-4)", fontSize: 11.5, minWidth: 24, textAlign: "right" }}>{r.confirmed || "—"}<span style={{ fontSize: 9, color: "var(--text-4)", marginLeft: 2 }}>c</span></span>
                  <span className="mono money-bold" style={{ minWidth: 40, textAlign: "right" }}>{U.fmtMoney(r.bill)}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>

    </div>
  );
}

function StatTile({ label, value, tone, bold }) {  let color = "var(--text)";
  if (tone === "pos") color = "var(--money-pos)";
  else if (tone === "ia") color = "var(--status-ia-fg)";
  else if (tone === "spiff") color = "var(--money-spiff)";
  return (
    <div>
      <div style={{ fontSize: 10, color: "var(--text-3)", textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 2 }}>{label}</div>
      <div className="mono" style={{ fontSize: 20, fontWeight: bold ? 600 : 500, letterSpacing: "-0.02em", color, lineHeight: 1 }}>{value}</div>
    </div>
  );
}

function StatusBar({ leads }) {
  const counts = { transfer: 0, confirmed: 0, ia: 0, dnc: 0, pending: 0, bad: 0 };
  leads.forEach(l => { counts[l.status] = (counts[l.status] || 0) + 1; });
  const total = leads.length;
  const colors = {
    transfer: "var(--status-transfer-fg)",
    confirmed: "var(--money-pos)",
    ia: "var(--status-ia-fg)",
    pending: "var(--text-3)",
    dnc: "var(--status-dnc-fg)",
    bad: "var(--status-bad-fg)",
  };
  const order = ["ia", "confirmed", "transfer", "pending", "dnc", "bad"];
  return (
    <div>
      <div style={{ display: "flex", height: 8, borderRadius: 4, overflow: "hidden", background: "var(--bg-panel-2)" }}>
        {order.map(k => {
          const pct = (counts[k] / total) * 100;
          if (pct === 0) return null;
          return <div key={k} style={{ width: `${pct}%`, background: colors[k] }} title={`${U.STATUS_LABEL[k]}: ${counts[k]}`}/>;
        })}
      </div>
      <div style={{ display: "flex", gap: 12, marginTop: 8, fontSize: 11, color: "var(--text-3)", flexWrap: "wrap" }}>
        {order.filter(k => counts[k] > 0).map(k => (
          <span key={k} style={{ display: "inline-flex", alignItems: "center", gap: 4 }}>
            <span style={{ width: 6, height: 6, background: colors[k], borderRadius: 1 }}/>
            <span style={{ color: "var(--text-2)" }}>{U.STATUS_LABEL[k]}</span>
            <span className="mono" style={{ color: "var(--text-4)" }}>{counts[k]}</span>
          </span>
        ))}
      </div>
    </div>
  );
}

function DeltaSub({ delta, prev, format, cmp }) {
  if (!cmp.hasData) return <span style={{ color: "var(--text-3)" }}>Week in progress · day 1</span>;
  if (prev === 0) return <span style={{ color: "var(--text-3)" }}>nothing last wk thru {cmp.through}</span>;
  const up = delta >= 0;
  const color = up ? "var(--money-pos)" : "var(--status-dnc-fg)";
  return (
    <span>
      <span style={{ color }}>
        {up ? "▲" : "▼"} {Math.abs(Math.round(delta * 100))}%
      </span>
      <span style={{ color: "var(--text-4)" }}> vs {format(prev)} last wk thru {cmp.through}</span>
    </span>
  );
}

Object.assign(window, { Overview });

</script>
  <script type="text/babel">
// Lead Log — the hero tab
const { useState: useStateLL, useMemo: useMemoLL, useRef: useRefLL, useEffect: useEffectLL } = React;

function LeadLog({ campaign, agents, leads, onAddLead, onUpdateLead, onDeleteLead }) {
  const [filter, setFilter] = useStateLL("all");
  const [search, setSearch] = useStateLL("");
  const [sort, setSort] = useStateLL({ col: "date", dir: "desc" });
  const [editLead, setEditLead] = useStateLL(null);
  const [showAdd, setShowAdd] = useStateLL(false);
  const [flashId, setFlashId] = useStateLL(null);

  const [agentFilter, setAgentFilter] = useStateLL("all");
  const agentOptions = useMemoLL(() => {
    const withLeads = new Set();
    leads.forEach(l => { if (l.campaign_id === campaign.id) withLeads.add(l.agent_id); });
    const opts = agents
      .filter(a => withLeads.has(a.id))
      .sort((a, b) => (a.full_name || "").localeCompare(b.full_name || ""))
      .map(a => ({ value: a.id, label: a.full_name }));
    return [{ value: "all", label: "All agents" }, ...opts];
  }, [leads, agents, campaign.id]);

  const agentsById = useMemoLL(() => {
    const m = {};
    agents.forEach(a => { m[a.id] = a; });
    return m;
  }, [agents]);

  // Filter pipeline
  const filtered = useMemoLL(() => {
    let arr = leads.filter(l => l.campaign_id === campaign.id);
    if (filter !== "all") arr = arr.filter(l => l.status === filter);
    if (agentFilter !== "all") arr = arr.filter(l => l.agent_id === agentFilter);
    if (search.trim()) {
      // Search across every field — customer, phone, agent, status, date, notes, appointment.
      const q = search.toLowerCase();
      arr = arr.filter(l => {
        const a = agentsById[l.agent_id];
        const hay = [
          U.toProperCase(l.customer_name || ""),
          U.fmtPhone(l.phone || ""), l.phone || "",
          a ? a.full_name : "",
          l.status || "",
          l.date || "", U.shortDate(l.date || ""),
          l.appointment_date || "",
          l.notes || "",
        ].join("  ").toLowerCase();
        return hay.includes(q);
      });
    }
    arr.sort((a, b) => {
      let av, bv;
      switch (sort.col) {
        case "agent":
          av = (agentsById[a.agent_id]?.full_name || "").toLowerCase();
          bv = (agentsById[b.agent_id]?.full_name || "").toLowerCase();
          break;
        case "customer":
          av = U.toProperCase(a.customer_name || "").toLowerCase();
          bv = U.toProperCase(b.customer_name || "").toLowerCase();
          break;
        case "status":
          av = U.STATUS_ORDER.indexOf(a.status); bv = U.STATUS_ORDER.indexOf(b.status); break;
        case "client":
          av = a.client_commission || 0; bv = b.client_commission || 0; break;
        case "total":
          av = (a.client_commission || 0) + (a.spiff || 0) + (a.tl_bonus || 0);
          bv = (b.client_commission || 0) + (b.spiff || 0) + (b.tl_bonus || 0); break;
        default:
          // Primary: date. Secondary: log time (hidden) so same-date leads
          // appear in the order they were logged.
          av = a.date + "|" + String(U.leadTimeKey(a)).padStart(16, "0");
          bv = b.date + "|" + String(U.leadTimeKey(b)).padStart(16, "0");
      }
      if (av < bv) return sort.dir === "asc" ? -1 : 1;
      if (av > bv) return sort.dir === "asc" ? 1 : -1;
      return 0;
    });
    return arr;
  }, [leads, campaign.id, filter, agentFilter, search, sort, agentsById]);

  const counts = useMemoLL(() => {
    const c = { all: 0, pending: 0, transfer: 0, confirmed: 0, ia: 0, dnc: 0, bad: 0 };
    leads.forEach(l => {
      if (l.campaign_id !== campaign.id) return;
      if (agentFilter !== "all" && l.agent_id !== agentFilter) return;
      c.all++; c[l.status] = (c[l.status] || 0) + 1;
    });
    return c;
  }, [leads, campaign.id, agentFilter]);

  const handleSort = (col) => {
    setSort(s => s.col === col ? { col, dir: s.dir === "asc" ? "desc" : "asc" } : { col, dir: "desc" });
  };

  const triggerFlash = (id) => {
    setFlashId(id);
    setTimeout(() => setFlashId(null), 700);
  };

  return (
    <div className="tab-content">
      {/* Toolbar */}
      <div className="toolbar">
        <div className="filter-chips">
          {[
            ["all", "All"],
            ["pending", "Pending"],
            ["transfer", "Transfer"],
            ["confirmed", "Confirmed"],
            ["ia", "IA"],
            ["dnc", "DNC"],
            ["bad", "Bad"],
          ].map(([k, label]) => (
            <button
              key={k}
              className={"chip" + (filter === k ? " active" : "")}
              onClick={() => setFilter(k)}
            >
              {label}
              <span className="ct">{counts[k] || 0}</span>
            </button>
          ))}
        </div>

        <div style={{ minWidth: 170 }}>
          <Select value={agentFilter} onChange={setAgentFilter} options={agentOptions}/>
        </div>

        <div className="search-wrap">
          <Icon name="search" />
          <input
            className="input"
            placeholder="Search anything — customer, phone, agent, status, date, notes…"
            value={search}
            onChange={(e) => setSearch(e.target.value)}
          />
        </div>

        <div style={{ marginLeft: "auto", display: "flex", gap: 8, alignItems: "center" }}>
          <span className="help">
            Showing <span className="mono" style={{ color: "var(--text)" }}>{filtered.length}</span> of{" "}
            <span className="mono" style={{ color: "var(--text)" }}>{counts.all}</span>
          </span>
          <button className="btn btn-primary" onClick={() => setShowAdd(true)}>
            <Icon name="plus" size={13}/> Add Lead
          </button>
        </div>
      </div>

      {filtered.length === 0 ? (
        <div className="empty">
          {counts.all === 0 ? (
            <>
              <h3>No leads logged yet</h3>
              <p>Add your first lead to start tracking commissions and agent performance.</p>
              <button className="btn btn-primary btn-lg" onClick={() => setShowAdd(true)}>
                <Icon name="plus"/> Add your first lead
              </button>
            </>
          ) : (
            <>
              <h3>No leads match these filters</h3>
              <p>Try clearing the search or switching status.</p>
            </>
          )}
        </div>
      ) : (
        <div className="table-wrap">
          <table className="table">
            <thead>
              <tr>
                <th className="sortable" onClick={() => handleSort("date")} style={{ width: 90 }}>
                  Date {sort.col === "date" && <span className="arrow">{sort.dir === "asc" ? "↑" : "↓"}</span>}
                </th>
                <th style={{ width: 50 }}>Day</th>
                <th className="sortable" onClick={() => handleSort("agent")}>
                  Agent {sort.col === "agent" && <span className="arrow">{sort.dir === "asc" ? "↑" : "↓"}</span>}
                </th>
                <th className="sortable" onClick={() => handleSort("customer")}>
                  Customer {sort.col === "customer" && <span className="arrow">{sort.dir === "asc" ? "↑" : "↓"}</span>}
                </th>
                <th>Phone</th>
                <th className="sortable" onClick={() => handleSort("status")} style={{ width: 110 }}>
                  Status {sort.col === "status" && <span className="arrow">{sort.dir === "asc" ? "↑" : "↓"}</span>}
                </th>
                <th className="num sortable" onClick={() => handleSort("client")} style={{ width: 80 }}>
                  Client $ {sort.col === "client" && <span className="arrow">{sort.dir === "asc" ? "↑" : "↓"}</span>}
                </th>
                <th className="num" style={{ width: 70 }}>Spiff</th>
                <th className="num" style={{ width: 80 }}>TL Bonus</th>
                <th className="num sortable" onClick={() => handleSort("total")} style={{ width: 80 }}>
                  Total {sort.col === "total" && <span className="arrow">{sort.dir === "asc" ? "↑" : "↓"}</span>}
                </th>
                <th style={{ width: 90 }}>Appt</th>
                <th style={{ width: 50 }}>Day</th>
                <th style={{ width: 40 }}></th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(l => {
                const a = agentsById[l.agent_id];
                const tlRec = agents.find(x => x.id === l.tl_recipient_id);
                const total = (l.client_commission || 0) + (l.spiff || 0) + (l.tl_bonus || 0);
                const apptD = U.parseDate(l.appointment_date);
                return (
                  <tr
                    key={l.id}
                    className={"clickable" + (flashId === l.id ? " flash" : "")}
                    onClick={() => setEditLead(l)}
                  >
                    <td className="num-l muted">{U.shortDate(l.date)}</td>
                    <td className="muted-2" style={{ fontSize: 11 }}>{U.dayOfWeek(l.date)}</td>
                    <td>
                      <span>{a ? a.full_name : "—"}</span>
                      {a && a.is_tl && <TLBadge small/>}
                    </td>
                    <td>{l.customer_name ? U.toProperCase(l.customer_name) : <span className="muted-2">—</span>}</td>
                    <td className="num-l muted">{l.phone ? U.fmtPhone(l.phone) : "—"}</td>
                    <td>
                      <StatusEditor
                        lead={l}
                        onChange={(newStatus) => {
                          onUpdateLead(l.id, { status: newStatus });
                          triggerFlash(l.id);
                        }}
                      />
                    </td>
                    <td><Money v={l.client_commission} tone="pos"/></td>
                    <td><Money v={l.spiff} tone="spiff"/></td>
                    <td>
                      <Money v={l.tl_bonus} tone="tl"/>
                      {l.tl_bonus > 0 && tlRec && (
                        <div style={{ fontSize: 10, color: "var(--text-4)", textAlign: "right" }}>
                          → {tlRec.full_name.split(" ")[0]}
                        </div>
                      )}
                    </td>
                    <td><Money v={total} bold/></td>
                    <td className="num-l muted">{apptD ? U.shortDate(l.appointment_date) : "—"}</td>
                    <td className="muted-2" style={{ fontSize: 11 }}>{apptD ? U.dayOfWeek(l.appointment_date) : ""}</td>
                    <td onClick={(e) => e.stopPropagation()}>
                      <button className="icon-btn" onClick={() => setEditLead(l)} aria-label="Edit">
                        <Icon name="edit"/>
                      </button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
            <tfoot>
              <tr>
                <td colSpan={6} className="muted">
                  Totals for {filtered.length} lead{filtered.length === 1 ? "" : "s"}
                </td>
                <td className="num money money-pos">
                  {U.fmtMoney(filtered.reduce((s, l) => s + (l.client_commission || 0), 0))}
                </td>
                <td className="num money money-spiff">
                  {U.fmtMoney(filtered.reduce((s, l) => s + (l.spiff || 0), 0))}
                </td>
                <td className="num money money-tl">
                  {U.fmtMoney(filtered.reduce((s, l) => s + (l.tl_bonus || 0), 0))}
                </td>
                <td className="num money money-bold">
                  {U.fmtMoney(filtered.reduce((s, l) => s + (l.client_commission || 0) + (l.spiff || 0) + (l.tl_bonus || 0), 0))}
                </td>
                <td colSpan={3}></td>
              </tr>
            </tfoot>
          </table>
        </div>
      )}

      {showAdd && (
        <LeadFormModal
          campaign={campaign}
          agents={agents}
          onClose={() => setShowAdd(false)}
          onSave={(lead) => {
            onAddLead(lead);
            setShowAdd(false);
          }}
        />
      )}
      {editLead && (
        <LeadFormModal
          campaign={campaign}
          agents={agents}
          lead={editLead}
          onClose={() => setEditLead(null)}
          onSave={(updates) => {
            onUpdateLead(editLead.id, updates);
            setEditLead(null);
            triggerFlash(editLead.id);
          }}
          onDelete={() => {
            onDeleteLead(editLead.id);
            setEditLead(null);
          }}
        />
      )}
    </div>
  );
}

// ---------- Inline status editor ----------
function StatusEditor({ lead, onChange }) {
  const [open, setOpen] = useStateLL(false);
  const ref = useRefLL(null);
  return (
    <>
      <button
        ref={ref}
        onClick={(e) => { e.stopPropagation(); setOpen(o => !o); }}
        style={{ background: "transparent", border: 0, padding: 0, cursor: "pointer" }}
      >
        <Pill status={lead.status}/>
      </button>
      <Popover open={open} anchorRef={ref} onClose={() => setOpen(false)}>
        {U.STATUS_ORDER.map(s => (
          <div
            key={s}
            className={"popover-item" + (s === lead.status ? " active" : "")}
            onClick={(e) => { e.stopPropagation(); onChange(s); setOpen(false); }}
          >
            <Pill status={s}/>
            {s === lead.status && (
              <span style={{ marginLeft: "auto", color: "var(--accent)" }}>
                <Icon name="check" size={12}/>
              </span>
            )}
          </div>
        ))}
      </Popover>
    </>
  );
}

// ---------- Add/Edit Lead modal ----------
function LeadFormModal({ campaign, agents, lead, onClose, onSave, onDelete }) {
  const isEdit = !!lead;
  const tls = agents.filter(a => a.is_tl && a.status === "active");
  const activeAgents = agents.filter(a => a.status === "active" || (lead && a.id === lead.agent_id));

  const [form, setForm] = useStateLL(() => ({
    date: lead?.date || U.dayStr(new Date()),
    agent_id: lead?.agent_id || activeAgents[0]?.id || "",
    customer_name: lead?.customer_name || "",
    phone: lead?.phone || "",
    status: lead?.status || "pending",
    spiff: lead?.spiff || 0,
    tl_bonus: lead?.tl_bonus || 0,
    tl_recipient_id: lead?.tl_recipient_id || "",
    appointment_date: lead?.appointment_date || "",
    notes: lead?.notes || "",
  }));

  const update = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const submit = () => {
    if (!form.customer_name.trim()) return;
    onSave({
      ...form,
      spiff: Number(form.spiff) || 0,
      tl_bonus: Number(form.tl_bonus) || 0,
      tl_recipient_id: form.tl_bonus > 0 ? form.tl_recipient_id || null : null,
    });
  };

  return (
    <Modal
      open
      onClose={onClose}
      title={isEdit ? "Edit Lead" : "Add Lead"}
      width="640px"
      footer={
        <>
          {isEdit && (
            <button className="btn btn-danger" onClick={onDelete} style={{ marginRight: "auto" }}>
              <Icon name="trash" size={12}/> Delete
            </button>
          )}
          <button className="btn" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={submit}>
            {isEdit ? "Save changes" : "Add lead"}
          </button>
        </>
      }
    >
      <div className="stack" style={{ gap: 12 }}>
        <div className="row-3">
          <div className="field">
            <label>Date</label>
            <DatePicker value={form.date} onChange={(v) => update("date", v)}/>
          </div>
          <div className="field">
            <label>Agent</label>
            <Select
              value={form.agent_id}
              onChange={(v) => update("agent_id", v)}
              options={activeAgents.map(a => ({ value: a.id, label: a.full_name + (a.is_tl ? " ★" : "") }))}
            />
          </div>
          <div className="field">
            <label>Status</label>
            <Select
              value={form.status}
              onChange={(v) => update("status", v)}
              options={U.STATUS_ORDER.map(s => ({ value: s, label: U.STATUS_LABEL[s] }))}
            />
          </div>
        </div>

        <div className="row-2">
          <div className="field">
            <label>Customer Name</label>
            <input className="input" value={form.customer_name} onChange={(e) => update("customer_name", e.target.value)} placeholder="e.g. Margaret Thompson"/>
          </div>
          <div className="field">
            <label>Phone</label>
            <input className="input" type="tel" value={form.phone} onChange={(e) => update("phone", e.target.value)} placeholder="(555) 123-4567"/>
          </div>
        </div>

        <div className="row-3">
          <div className="field">
            <label>Your Spiff ($)</label>
            <div className="field-money">
              <input className="input" type="number" min="0" value={form.spiff} onChange={(e) => update("spiff", e.target.value)}/>
            </div>
          </div>
          <div className="field">
            <label>TL Bonus ($)</label>
            <div className="field-money">
              <input className="input" type="number" min="0" value={form.tl_bonus} onChange={(e) => update("tl_bonus", e.target.value)}/>
            </div>
          </div>
          <div className="field">
            <label>TL Recipient</label>
            <Select
              value={form.tl_recipient_id || ""}
              onChange={(v) => update("tl_recipient_id", v)}
              disabled={!(form.tl_bonus > 0)}
              placeholder="— Select —"
              options={[{ value: "", label: "— Select —" }, ...tls.map(t => ({ value: t.id, label: t.full_name }))]}
            />
          </div>
        </div>

        <div className="field">
          <label>Appointment Date</label>
          <DatePicker value={form.appointment_date} onChange={(v) => update("appointment_date", v)} min={form.date} clearable/>
        </div>

        <div className="field">
          <label>Notes</label>
          <textarea className="input" rows={3} value={form.notes} onChange={(e) => update("notes", e.target.value)} placeholder="Any context — call-back time, customer concerns, etc."/>
        </div>

        <div className="help" style={{
          background: "var(--bg-panel-2)",
          padding: "10px 12px",
          borderRadius: "var(--radius-sm)",
          border: "1px solid var(--border-subtle)"
        }}>
          <strong style={{ color: "var(--text-2)" }}>Auto-calculated:</strong>{" "}
          Client $ is set from campaign rates ({U.fmtMoney(campaign.rate_ia)}/IA, {U.fmtMoney(campaign.rate_confirmed)}/Confirmed)
          and IA tier logic ({U.fmtMoney(campaign.ia_tier_2)} for 2 same-day, {U.fmtMoney(campaign.ia_tier_3)} for 3). Total = Client $ + Spiff + TL Bonus.
        </div>
      </div>
    </Modal>
  );
}

Object.assign(window, { LeadLog });

</script>
  <script type="text/babel">
// Commission Sheet — accountant-facing
const { useState: useStateCS, useMemo: useMemoCS } = React;

function CommissionSheet({ campaign, agents, leads, profile, onInviteUser }) {
  const [period, setPeriod] = useStateCS("this_week");
  const [customStart, setCustomStart] = useStateCS("");
  const [customEnd, setCustomEnd] = useStateCS("");
  const [showInviteViewer, setShowInviteViewer] = useStateCS(false);

  const today = window.MOCK_TODAY;
  const range = useMemoCS(() => {
    if (period === "this_week") {
      return { start: U.dayStr(U.startOfWeek(today)), end: U.dayStr(U.endOfWeek(today)), label: "This Week" };
    } else if (period === "last_week") {
      const lw = new Date(today);
      lw.setDate(lw.getDate() - 7);
      return { start: U.dayStr(U.startOfWeek(lw)), end: U.dayStr(U.endOfWeek(lw)), label: "Last Week" };
    } else if (period === "two_weeks") {
      // The last two completed weeks (bi-weekly pay period) — never the future.
      const w1 = new Date(today); w1.setDate(w1.getDate() - 14);
      const w2 = new Date(today); w2.setDate(w2.getDate() - 7);
      return { start: U.dayStr(U.startOfWeek(w1)), end: U.dayStr(U.endOfWeek(w2)), label: "Last 2 Weeks" };
    } else if (period === "month") {
      const s = new Date(today); s.setDate(1);
      return { start: U.dayStr(s), end: U.dayStr(today), label: "Month-to-date" };
    } else if (period === "custom") {
      return {
        start: customStart || "0000-00-00",
        end: customEnd || "9999-99-99",
        label: "Custom"
      };
    } else {
      return { start: "0000-00-00", end: "9999-99-99", label: "All Time" };
    }
  }, [period, customStart, customEnd, today]);

  const filtered = useMemoCS(() => {
    return leads.filter(l => l.campaign_id === campaign.id && l.date >= range.start && l.date <= range.end);
  }, [leads, campaign.id, range]);

  // Summary
  const totals = useMemoCS(() => {
    let bill = 0, spiff = 0, tl = 0;
    filtered.forEach(l => {
      bill += l.client_commission || 0;
      spiff += l.spiff || 0;
      tl += l.tl_bonus || 0;
    });
    return { bill, spiff, tl, total: bill + spiff + tl };
  }, [filtered]);

  // Per-agent breakdown
  const agentRows = useMemoCS(() => {
    const byAgent = {};
    filtered.forEach(l => {
      const k = l.agent_id;
      const row = (byAgent[k] ||= { agent_id: k, ia: 0, confirms: 0, transfers: 0, client: 0, spiff: 0, tl: 0 });
      if (l.status === "ia") row.ia++;
      if (l.status === "confirmed") row.confirms++;
      if (l.status === "transfer") row.transfers++;
      row.client += l.client_commission || 0;
      row.spiff += l.spiff || 0;
    });
    // TL bonuses received
    filtered.forEach(l => {
      if (l.tl_bonus > 0 && l.tl_recipient_id) {
        const row = (byAgent[l.tl_recipient_id] ||= { agent_id: l.tl_recipient_id, ia: 0, confirms: 0, transfers: 0, client: 0, spiff: 0, tl: 0 });
        row.tl += l.tl_bonus;
      }
    });
    const rows = Object.values(byAgent).map(r => {
      const a = agents.find(x => x.id === r.agent_id);
      return {
        ...r,
        name: a?.full_name || "—",
        is_tl: a?.is_tl,
        total: r.client + r.spiff + r.tl,
      };
    });
    rows.sort((a, b) => b.total - a.total);
    return rows;
  }, [filtered, agents]);

  const periodDays = useMemoCS(() => {
    const s = U.parseDate(range.start), e = U.parseDate(range.end);
    if (!s || !e || s > e) return 0;
    return Math.round((e - s) / 86400000) + 1;
  }, [range]);

  function exportCsv() {
    const headers = ["Agent","TL","IAs","Confirms","Transfers","Client $","Your Spiff","TL Bonus","Total Owed"];
    const rows = agentRows.map(r => [
      r.name, r.is_tl ? "Y" : "", r.ia, r.confirms, r.transfers,
      r.client.toFixed(2), r.spiff.toFixed(2), r.tl.toFixed(2), r.total.toFixed(2)
    ]);
    const csv = [headers, ...rows]
      .map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(","))
      .join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `${campaign.name.replace(/\s+/g, "_")}_${range.label.replace(/\s+/g, "")}_commissions.csv`;
    a.click();
  }

  return (
    <div className="tab-content">
      {/* Period selector + actions */}
      <div className="toolbar">
        <div className="filter-chips">
          {[
            ["this_week","This Week"],
            ["last_week","Last Week"],
            ["two_weeks","2 Weeks"],
            ["month","MTD"],
            ["all","All Time"],
            ["custom","Custom…"],
          ].map(([k, l]) => (
            <button key={k} className={"chip" + (period === k ? " active" : "")} onClick={() => setPeriod(k)}>
              {l}
            </button>
          ))}
        </div>
        {period === "custom" && (
          <>
            <div style={{ width: 170 }}>
              <DatePicker value={customStart} onChange={setCustomStart} placeholder="Start date" clearable/>
            </div>
            <span className="muted">to</span>
            <div style={{ width: 170 }}>
              <DatePicker value={customEnd} onChange={setCustomEnd} placeholder="End date" clearable/>
            </div>
          </>
        )}
        <div style={{ marginLeft: "auto", display: "flex", gap: 8, alignItems: "center" }}>
          <span className="help">
            {U.shortDate(range.start === "0000-00-00" ? today.toISOString().slice(0,10) : range.start)} — {U.shortDate(range.end === "9999-99-99" ? today.toISOString().slice(0,10) : range.end)} · <span className="mono">{filtered.length}</span> leads
          </span>
          {onInviteUser && (
            <button className="btn" onClick={() => setShowInviteViewer(true)} title="Share read-only access with your accountant">
              <Icon name="users" size={12}/> Share with accountant
            </button>
          )}
          <button className="btn" onClick={exportCsv}>
            <Icon name="download" size={12}/> Export CSV
          </button>
        </div>
      </div>

      {/* KPI cards */}
      <div className="kpi-grid" style={{ marginBottom: 16 }}>
        <Kpi
          tone="accent"
          label="Bill Client"
          value={U.fmtMoney(totals.bill)}
          sub={`${campaign.client} · ${range.label}`}
        />
        <Kpi
          tone="spiff"
          label="Your Spiffs"
          value={U.fmtMoney(totals.spiff)}
          sub="Paid from pocket"
        />
        <Kpi
          tone="tl"
          label="TL Bonuses"
          value={U.fmtMoney(totals.tl)}
          sub="Coaching bonuses"
        />
        <Kpi
          label="Total Payout"
          value={U.fmtMoney(totals.total)}
          sub={`${agentRows.length} agent${agentRows.length === 1 ? "" : "s"} paid`}
        />
      </div>

      {/* Per-agent table */}
      <div className="section-head" style={{ paddingTop: 6 }}>
        <h2>Agent Payout</h2>
        <span className="sub">{periodDays > 0 ? `${periodDays} day${periodDays === 1 ? "" : "s"}` : ""} · sorted by total owed</span>
      </div>

      {agentRows.length === 0 ? (
        <div className="empty">
          <h3>No leads in this period</h3>
          <p>Pick a different range, or log leads in the Lead Log to populate this sheet.</p>
        </div>
      ) : (
      <div className="table-wrap">
        <table className="table">
          <thead>
            <tr>
              <th>Agent</th>
              <th className="num" style={{ width: 70 }}>IAs</th>
              <th className="num" style={{ width: 90 }}>Confirms</th>
              <th className="num" style={{ width: 90 }}>Transfers</th>
              <th className="num" style={{ width: 100 }}>Client $</th>
              <th className="num" style={{ width: 100 }}>Your Spiff</th>
              <th className="num" style={{ width: 100 }}>TL Bonus</th>
              <th className="num" style={{ width: 110 }}>Total Owed</th>
            </tr>
          </thead>
          <tbody>
            {agentRows.map(r => (
              <tr key={r.agent_id}>
                <td>
                  {r.name}
                  {r.is_tl && <TLBadge small/>}
                </td>
                <td className="num"><span className={r.ia > 0 ? "money money-tl" : "money money-muted"}>{r.ia || "—"}</span></td>
                <td className="num"><span className={r.confirms > 0 ? "money money-pos" : "money money-muted"}>{r.confirms || "—"}</span></td>
                <td className="num"><span className="money money-muted" style={r.transfers > 0 ? { color: "var(--status-transfer-fg)" } : {}}>{r.transfers || "—"}</span></td>
                <td className="num"><Money v={r.client} tone="pos"/></td>
                <td className="num"><Money v={r.spiff} tone="spiff"/></td>
                <td className="num"><Money v={r.tl} tone="tl"/></td>
                <td className="num"><Money v={r.total} bold/></td>
              </tr>
            ))}
          </tbody>
          <tfoot>
            <tr>
              <td>Totals</td>
              <td className="num money money-tl">{agentRows.reduce((s,r) => s + r.ia, 0) || "—"}</td>
              <td className="num money money-pos">{agentRows.reduce((s,r) => s + r.confirms, 0) || "—"}</td>
              <td className="num money" style={{ color: "var(--status-transfer-fg)" }}>{agentRows.reduce((s,r) => s + r.transfers, 0) || "—"}</td>
              <td className="num money money-pos">{U.fmtMoney(totals.bill)}</td>
              <td className="num money money-spiff">{U.fmtMoney(totals.spiff)}</td>
              <td className="num money money-tl">{U.fmtMoney(totals.tl)}</td>
              <td className="num money money-bold">{U.fmtMoney(totals.total)}</td>
            </tr>
          </tfoot>
        </table>
      </div>
      )}

      {showInviteViewer && (
        <InviteViewerModal
          campaign={campaign}
          onClose={() => setShowInviteViewer(false)}
          onSave={(data) => {
            onInviteUser({ ...data, role: "viewer", campaign_ids: [campaign.id] });
            setShowInviteViewer(false);
          }}
        />
      )}
    </div>
  );
}

function InviteViewerModal({ campaign, onClose, onSave }) {
  const [form, setForm] = useStateCS({ full_name: "", email: "" });
  const update = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const canSave = form.full_name.trim() && form.email.includes("@");
  return (
    <Modal
      open
      onClose={onClose}
      title="Share with accountant"
      width="480px"
      footer={
        <>
          <button className="btn" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={() => canSave && onSave(form)} disabled={!canSave}>Send invite</button>
        </>
      }
    >
      <div className="stack">
        <div className="help" style={{
          background: "var(--bg-panel-2)",
          padding: "10px 12px",
          borderRadius: "var(--radius-sm)",
          border: "1px solid var(--border-subtle)",
          marginBottom: 4
        }}>
          They'll get <strong style={{ color: "var(--text-2)" }}>read-only access</strong> to the Commission Sheet for <strong style={{ color: "var(--text-2)" }}>{campaign.name}</strong>. No agents, no settings, no other campaigns.
        </div>
        <div className="field">
          <label>Full name</label>
          <input className="input" autoFocus value={form.full_name} onChange={(e) => update("full_name", e.target.value)} placeholder="e.g. Sandra Patel"/>
        </div>
        <div className="field">
          <label>Email</label>
          <input className="input" type="email" value={form.email} onChange={(e) => update("email", e.target.value)} placeholder="accountant@firm.com"/>
        </div>
      </div>
    </Modal>
  );
}

Object.assign(window, { CommissionSheet });

</script>
  <script type="text/babel">
// Agent Detail — individual performance report for one agent.
// Drill-down rendered inside the Agent Report tab.
const { useState: useStateAD, useMemo: useMemoAD, useRef: useRefAD, useEffect: useEffectAD } = React;

// "vs floor average" sub-line for a KPI card. Higher is always better here.
function BenchSub({ value, avg, fmt, showRel }) {
  if (avg == null || !isFinite(avg)) return <span style={{ color: "var(--text-3)" }}>—</span>;
  const up = value >= avg;
  const color = up ? "var(--money-pos)" : "var(--status-dnc-fg)";
  const rel = (showRel && avg > 0) ? Math.round(Math.abs(value - avg) / avg * 100) : null;
  return (
    <span>
      <span style={{ color }}>{up ? "▲" : "▼"}{rel != null ? " " + rel + "%" : ""}</span>
      <span style={{ color: "var(--text-4)" }}> · floor avg {fmt(avg)}</span>
    </span>
  );
}

// Floor-standing strip — every agent on the roster is a dot, ordered best
// (#1, left) to worst; this agent's dot is enlarged and accent-colored, so
// rank reads as a position in the pack rather than a progress meter.
function RankStrip({ label, rank, n }) {
  if (!rank || rank < 1 || n < 1) return null;
  const top = rank <= 3;
  return (
    <div style={{ minWidth: 150 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 12, marginBottom: 5 }}>
        <span style={{ fontSize: 10, color: "var(--text-3)", textTransform: "uppercase", letterSpacing: "0.05em" }}>{label}</span>
        <span className="mono" style={{ fontSize: 11, fontWeight: 600 }}>
          <span style={{ color: top ? "var(--accent)" : "var(--text-2)" }}>#{rank}</span>
          <span style={{ color: "var(--text-4)", fontWeight: 400 }}> of {n}</span>
        </span>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 3 }}>
        {Array.from({ length: n }, (_, i) => {
          const isMe = i === rank - 1;
          const sz = isMe ? 9 : 5;
          return (
            <div key={i} style={{
              width: sz, height: sz, borderRadius: 999, flexShrink: 0,
              background: isMe ? (top ? "var(--accent)" : "var(--text)") : "var(--bg-panel-2)",
              border: isMe ? "none" : "1px solid var(--border-subtle)",
            }}/>
          );
        })}
      </div>
    </div>
  );
}

function AgentDetail({ campaign, agent, agents, leads, attendanceOverrides, onBack }) {
  const AD_PRESETS = [
    { key: "7d", label: "7d", days: 7 },
    { key: "30d", label: "30d", days: 30 },
    { key: "90d", label: "90d", days: 90 },
    { key: "all", label: "All", days: null },
  ];
  const [dayKey, setDayKey] = useStateAD("30d");
  const [dayOffset, setDayOffset] = useStateAD(0);
  const [customRange, setCustomRange] = useStateAD(null);
  const [pickerOpen, setPickerOpen] = useStateAD(false);
  const pickerBtnRef = useRefAD(null);
  const preset = AD_PRESETS.find(p => p.key === dayKey) || AD_PRESETS[1];
  const presetRange = useMemoAD(() => window.dayRange(preset.days, dayOffset), [preset.days, dayOffset]);
  const range = customRange
    ? { startISO: customRange.startISO, endISO: customRange.endISO, label: `${U.shortDate(customRange.startISO)} – ${U.shortDate(customRange.endISO)}` }
    : presetRange;
  useEffectAD(() => { if (preset.days == null && dayOffset !== 0) setDayOffset(0); }, [preset.days]);

  const inRange = (d) => d >= range.startISO && d <= range.endISO;
  const todayISO = U.dayStr(window.MOCK_TODAY);

  const EMPTY = { total: 0, pending: 0, transfer: 0, confirmed: 0, ia: 0, dnc: 0, bad: 0, client: 0, spiff: 0, tl: 0 };
  const derive = (s) => {
    const base = s || EMPTY;
    const transferred = base.total - base.pending;
    const converted = base.ia + base.confirmed;
    return {
      ...base, transferred, converted,
      conv: transferred > 0 ? converted / transferred : 0,
      earnings: base.client + base.spiff + base.tl,
    };
  };

  // Per-agent aggregates for the whole campaign over the selected range.
  const periodStats = useMemoAD(() => {
    const m = {};
    const ensure = (id) => (m[id] ||= { total: 0, pending: 0, transfer: 0, confirmed: 0, ia: 0, dnc: 0, bad: 0, client: 0, spiff: 0, tl: 0 });
    leads.forEach(l => {
      if (l.campaign_id !== campaign.id) return;
      if (!inRange(l.date)) return;
      const r = ensure(l.agent_id);
      r.total++;
      if (r[l.status] != null) r[l.status]++;
      r.client += l.client_commission || 0;
      r.spiff += l.spiff || 0;
      if (l.tl_bonus > 0 && l.tl_recipient_id) ensure(l.tl_recipient_id).tl += l.tl_bonus;
    });
    return m;
  }, [leads, campaign.id, range]);

  const me = derive(periodStats[agent.id]);

  const activeAgents = useMemoAD(
    () => agents.filter(a => a.campaign_id === campaign.id && a.status === "active"),
    [agents, campaign.id]
  );

  // Floor average across the active roster.
  const floor = useMemoAD(() => {
    const rows = activeAgents.map(a => derive(periodStats[a.id]));
    const n = rows.length || 1;
    const avg = (fn) => rows.reduce((s, r) => s + fn(r), 0) / n;
    return {
      total: avg(r => r.total),
      transferred: avg(r => r.transferred),
      ia: avg(r => r.ia),
      confirmed: avg(r => r.confirmed),
      conv: avg(r => r.conv),
      earnings: avg(r => r.earnings),
      count: rows.length,
    };
  }, [activeAgents, periodStats]);

  // Standing among the active roster.
  const ranking = useMemoAD(() => {
    const rows = activeAgents.map(a => ({ id: a.id, ...derive(periodStats[a.id]) }));
    const byConv = [...rows].sort((a, b) => b.converted - a.converted || b.transferred - a.transferred);
    const byRate = [...rows].sort((a, b) => b.conv - a.conv || b.converted - a.converted);
    return {
      n: rows.length,
      convRank: byConv.findIndex(r => r.id === agent.id) + 1,
      rateRank: byRate.findIndex(r => r.id === agent.id) + 1,
    };
  }, [activeAgents, periodStats, agent.id]);

  const agentLeads = useMemoAD(
    () => leads.filter(l => l.campaign_id === campaign.id && l.agent_id === agent.id && inRange(l.date)),
    [leads, campaign.id, agent.id, range]
  );

  // Ground-truth attendance from the daily reports.
  const attData = useMemoAD(() => {
    const present = {};
    const reportDays = new Set();
    ((window.MOCK_DATA && window.MOCK_DATA.attendance) || []).forEach(r => {
      if (r.campaign_id !== campaign.id) return;
      present[r.agent_id + "|" + r.date] = true;
      reportDays.add(r.date);
    });
    return { present, reportDays };
  }, [campaign.id]);

  const attendance = useMemoAD(() => {
    const days = [...attData.reportDays].filter(d => inRange(d)).sort();
    let present = 0, absent = 0, off = 0;
    const cells = days.map(d => {
      const key = agent.id + "|" + d;
      const ov = attendanceOverrides && attendanceOverrides[key];
      let st;
      if (ov) st = ov;
      else if (agent.date_added && d < agent.date_added) st = "off";
      else if (agent.date_removed && d > agent.date_removed) st = "off";
      else st = attData.present[key] ? "present" : "absent";
      if (st === "present") present++;
      else if (st === "absent") absent++;
      else off++;
      return { date: d, status: st };
    });
    // Current present-streak: walk back from the latest working day; "off"
    // days are skipped, an absence breaks it.
    let streak = 0;
    for (let i = cells.length - 1; i >= 0; i--) {
      if (cells[i].status === "off") continue;
      if (cells[i].status === "present") streak++;
      else break;
    }
    let lastAbsence = null;
    for (let i = cells.length - 1; i >= 0; i--) {
      if (cells[i].status === "absent") { lastAbsence = cells[i].date; break; }
    }
    return { cells, present, absent, off, streak, lastAbsence, pct: (present + absent) > 0 ? present / (present + absent) : 0 };
  }, [attData, agent, attendanceOverrides, range]);

  // Prior period (same length, immediately before) — for the conversion-drop flag.
  const prior = useMemoAD(() => {
    if (preset.days == null && !customRange) return null; // All-time has no "prior".
    const sD = U.parseDate(range.startISO), eD = U.parseDate(range.endISO);
    if (!sD || !eD) return null;
    const len = Math.round((eD - sD) / 86400000) + 1;
    const pe = new Date(sD); pe.setDate(pe.getDate() - 1);
    const ps = new Date(pe); ps.setDate(ps.getDate() - len + 1);
    const pStart = U.dayStr(ps), pEnd = U.dayStr(pe);
    let total = 0, pending = 0, ia = 0, confirmed = 0;
    leads.forEach(l => {
      if (l.campaign_id !== campaign.id || l.agent_id !== agent.id) return;
      if (l.date < pStart || l.date > pEnd) return;
      total++;
      if (l.status === "pending") pending++;
      if (l.status === "ia") ia++;
      if (l.status === "confirmed") confirmed++;
    });
    const transferred = total - pending;
    return { transferred, conv: transferred > 0 ? (ia + confirmed) / transferred : 0 };
  }, [leads, campaign.id, agent.id, range, preset.days, customRange]);

  // Weekly trend — every week of the agent's tenure (hire → today / termination).
  // Independent of the page's date range; always the full history.
  const trend = useMemoAD(() => {
    const all = leads.filter(l => l.campaign_id === campaign.id && l.agent_id === agent.id);
    let startISO = agent.date_added;
    if (!startISO) {
      const dates = all.map(l => l.date);
      startISO = dates.length ? dates.reduce((a, b) => a < b ? a : b) : todayISO;
    }
    let endISO = todayISO;
    if (agent.date_removed && agent.date_removed < endISO) endISO = agent.date_removed;
    const endD = U.parseDate(endISO);
    const weeks = [];
    let cur = U.startOfWeek(U.parseDate(startISO));
    let guard = 0;
    while (cur <= endD && guard < 400) {
      const wkStart = U.dayStr(cur);
      const wkEndD = new Date(cur); wkEndD.setDate(wkEndD.getDate() + 6);
      weeks.push({ label: U.weekLabel(wkStart), start: wkStart, end: U.dayStr(wkEndD), transferred: 0, ia: 0, confirmed: 0 });
      cur = new Date(cur); cur.setDate(cur.getDate() + 7);
      guard++;
    }
    all.forEach(l => {
      const w = weeks.find(x => l.date >= x.start && l.date <= x.end);
      if (!w) return;
      if (l.status !== "pending") w.transferred++;
      if (l.status === "ia") w.ia++;
      if (l.status === "confirmed") w.confirmed++;
    });
    return weeks;
  }, [leads, campaign.id, agent, todayISO]);

  const flags = useMemoAD(() => {
    const out = [];
    if (me.transferred >= 5 && me.converted === 0)
      out.push({ kind: "warn", text: `${me.transferred} transferred, 0 conversions this period` });
    if (prior && prior.transferred >= 3 && prior.conv > 0 && me.transferred >= 3 && me.conv < prior.conv * 0.7)
      out.push({ kind: "warn", text: `Conversion down — ${U.fmtPct(prior.conv)} → ${U.fmtPct(me.conv)} vs prior period` });
    if (attendance.absent >= 3)
      out.push({ kind: "warn", text: `${attendance.absent} absence${attendance.absent === 1 ? "" : "s"} in this period` });
    if ((attendance.present + attendance.absent) >= 5 && attendance.pct < 0.7)
      out.push({ kind: "warn", text: `Attendance ${U.fmtPct(attendance.pct)} — below 70%` });
    if (agent.status === "active" && ranking.n >= 4 && ranking.convRank >= 1 && ranking.convRank <= 3 && me.converted > 0)
      out.push({ kind: "good", text: `Top ${ranking.convRank} on the floor by conversions` });
    return out;
  }, [me, prior, attendance, ranking, agent.status]);

  const recent = useMemoAD(
    () => [...agentLeads].sort((a, b) => b.date.localeCompare(a.date) || (b.seq ?? 0) - (a.seq ?? 0)).slice(0, 60),
    [agentLeads]
  );

  const tenure = (() => {
    if (!agent.date_added) return campaign.name;
    if (agent.date_removed) return `Hired ${U.shortDate(agent.date_added)} · Terminated ${U.shortDate(agent.date_removed)}`;
    const days = Math.max(0, Math.round((U.parseDate(todayISO) - U.parseDate(agent.date_added)) / 86400000));
    return `Hired ${U.shortDate(agent.date_added)} · ${days} day${days === 1 ? "" : "s"} on campaign`;
  })();

  const daysOnFloor = attendance.present;
  const leadsPerDay = daysOnFloor > 0 ? me.total / daysOnFloor : null;
  const convPerDay = daysOnFloor > 0 ? me.converted / daysOnFloor : null;

  return (
    <div className="tab-content">
      {/* Header — back + identity + range control */}
      <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 14, flexWrap: "wrap", marginBottom: 16 }}>
        <div>
          <button className="btn btn-sm btn-ghost" onClick={onBack} style={{ marginBottom: 8, paddingLeft: 4 }}>
            <Icon name="arrowLeft" size={12}/> Agent Report
          </button>
          <h1 style={{ margin: 0, fontSize: 22, fontWeight: 600, letterSpacing: "-0.02em", display: "flex", alignItems: "center", gap: 4 }}>
            {agent.full_name}
            {agent.is_tl && <TLBadge/>}
            <span
              className={"tag" + (agent.status === "active" ? "" : " tag-inactive")}
              style={agent.status === "active"
                ? { marginLeft: 8, color: "var(--money-pos)", borderColor: "var(--accent-line)", background: "var(--accent-soft)" }
                : { marginLeft: 8 }}
            >
              {agent.status === "active" ? "Active" : "Inactive"}
            </span>
          </h1>
          <div style={{ fontSize: 12, color: "var(--text-3)", marginTop: 4 }}>{tenure}</div>
          {agent.status === "active" && ranking.n > 0 && (ranking.convRank > 0 || ranking.rateRank > 0) && (
            <div style={{ display: "flex", gap: 22, marginTop: 12, flexWrap: "wrap" }}>
              <RankStrip label="Conversions" rank={ranking.convRank} n={ranking.n}/>
              <RankStrip label="Conversion rate" rank={ranking.rateRank} n={ranking.n}/>
            </div>
          )}
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          {customRange ? (
            <>
              <button ref={pickerBtnRef} className="chip active" style={{ display: "inline-flex", alignItems: "center", gap: 6 }} onClick={() => setPickerOpen(o => !o)} title="Click to change dates">
                <Icon name="calendar" size={11}/>
                {U.shortDate(customRange.startISO)} – {U.shortDate(customRange.endISO)}
              </button>
              <button className="icon-btn" title="Clear custom range" onClick={() => setCustomRange(null)}>
                <Icon name="x" size={12}/>
              </button>
            </>
          ) : (
            <>
              <RangeNav
                options={AD_PRESETS}
                value={dayKey}
                onChange={(k) => { setDayKey(k); setDayOffset(0); }}
                rangeLabel={range.label}
                canBack={preset.days != null}
                canForward={preset.days != null && dayOffset > 0}
                onBack={() => setDayOffset(o => o + 1)}
                onForward={() => setDayOffset(o => Math.max(0, o - 1))}
                onReset={() => setDayOffset(0)}
                canReset={dayOffset !== 0}
              />
              <button ref={pickerBtnRef} className="chip" style={{ display: "inline-flex", alignItems: "center", gap: 5 }} onClick={() => setPickerOpen(o => !o)}>
                <Icon name="calendar" size={11}/> Pick dates…
              </button>
            </>
          )}
          <DateRangePicker
            open={pickerOpen}
            onClose={() => setPickerOpen(false)}
            anchorRef={pickerBtnRef}
            value={customRange || (preset.days != null ? presetRange : null)}
            onChange={(r) => { setCustomRange(r); setDayOffset(0); }}
          />
        </div>
      </div>

      {/* KPI cards — value + vs floor average */}
      <div className="kpi-grid" style={{ marginBottom: 12 }}>
        <Kpi label="Leads" value={U.fmtNum(me.total, { dashZero: true })}
          sub={<BenchSub value={me.total} avg={floor.total} fmt={v => v.toFixed(1)} showRel/>}/>
        <Kpi label="Transferred" value={U.fmtNum(me.transferred, { dashZero: true })}
          sub={<BenchSub value={me.transferred} avg={floor.transferred} fmt={v => v.toFixed(1)} showRel/>}/>
        <Kpi tone="tl" label="IAs" value={U.fmtNum(me.ia, { dashZero: true })}
          sub={<BenchSub value={me.ia} avg={floor.ia} fmt={v => v.toFixed(1)} showRel/>}/>
        <Kpi label="Confirms" value={U.fmtNum(me.confirmed, { dashZero: true })}
          sub={<BenchSub value={me.confirmed} avg={floor.confirmed} fmt={v => v.toFixed(1)} showRel/>}/>
        <Kpi label="Conversion" value={U.fmtPct(me.conv)}
          sub={<BenchSub value={me.conv} avg={floor.conv} fmt={U.fmtPct}/>}/>
        <Kpi tone="accent" label="Earnings" value={U.fmtMoney(me.earnings)}
          sub={<BenchSub value={me.earnings} avg={floor.earnings} fmt={U.fmtMoney} showRel/>}/>
      </div>

      {/* Trend + outcome mix */}
      <div style={{ display: "grid", gridTemplateColumns: "1.7fr 1fr", gap: 12, marginBottom: 12 }}>
        <div className="card" style={{ padding: "16px 18px" }}>
          <div className="spread" style={{ marginBottom: 4, gap: 12, flexWrap: "wrap" }}>
            <h3 style={{ margin: 0, fontSize: 13, fontWeight: 600 }}>
              Performance trend
              <span style={{ marginLeft: 8, fontSize: 11, color: "var(--text-3)", fontWeight: 400 }}>· every week on campaign</span>
            </h3>
            <div style={{ display: "flex", gap: 14, fontSize: 11, color: "var(--text-3)" }}>
              <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
                <span style={{ width: 16, height: 2, background: "var(--text-3)", borderRadius: 2 }}/> Transferred
              </span>
              <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
                <span style={{ width: 16, height: 2, background: "var(--money-pos)", borderRadius: 2 }}/> Converted
              </span>
            </div>
          </div>
          <WeeklyTrendChart weeks={trend}/>
        </div>

        <div className="card" style={{ padding: 16, display: "flex", flexDirection: "column" }}>
          <h3 style={{ margin: "0 0 12px", fontSize: 13, fontWeight: 600 }}>Outcome mix</h3>
          {agentLeads.length === 0 ? (
            <div className="help" style={{ padding: "10px 0" }}>No leads in this range.</div>
          ) : (
            <StatusBar leads={agentLeads}/>
          )}
          <div style={{ marginTop: "auto", paddingTop: 14, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            <div>
              <div style={{ fontSize: 10, color: "var(--text-3)", textTransform: "uppercase", letterSpacing: "0.05em" }}>Leads / day on floor</div>
              <div className="mono" style={{ fontSize: 18, fontWeight: 600 }}>{leadsPerDay != null ? leadsPerDay.toFixed(1) : "—"}</div>
            </div>
            <div>
              <div style={{ fontSize: 10, color: "var(--text-3)", textTransform: "uppercase", letterSpacing: "0.05em" }}>Conversions / day</div>
              <div className="mono" style={{ fontSize: 18, fontWeight: 600 }}>{convPerDay != null ? convPerDay.toFixed(2) : "—"}</div>
            </div>
          </div>
        </div>
      </div>

      {/* Attendance */}
      <div className="card" style={{ padding: 16, marginBottom: 12 }}>
        {(() => {
          const a = attendance;
          const total = a.present + a.absent;
          const pctColor = a.pct >= 0.85 ? "var(--money-pos)" : a.pct >= 0.7 ? "var(--money-spiff)" : total > 0 ? "var(--status-dnc-fg)" : "var(--text-3)";
          const absAgo = (() => {
            if (!a.lastAbsence) return "";
            const days = Math.round((U.parseDate(todayISO) - U.parseDate(a.lastAbsence)) / 86400000);
            if (days <= 0) return "today";
            if (days === 1) return "yesterday";
            if (days < 14) return days + " days ago";
            if (days < 60) return Math.round(days / 7) + " weeks ago";
            return Math.round(days / 30) + " months ago";
          })();
          return (
            <div className="spread" style={{ marginBottom: 14, alignItems: "flex-start", gap: 16, flexWrap: "wrap" }}>
              <div>
                <div style={{ fontSize: 10, color: "var(--text-3)", textTransform: "uppercase", letterSpacing: "0.06em", fontWeight: 600 }}>Attendance</div>
                <div style={{ display: "flex", alignItems: "baseline", gap: 9, marginTop: 3 }}>
                  <span className="mono" style={{ fontSize: 30, fontWeight: 600, letterSpacing: "-0.03em", lineHeight: 1, color: pctColor }}>
                    {total > 0 ? Math.round(a.pct * 100) + "%" : "—"}
                  </span>
                  <span style={{ fontSize: 12, color: "var(--text-3)" }}>
                    {a.present} of {total} days
                    {a.streak > 0 && <> · <span style={{ color: "var(--text-2)" }}>{a.streak}-day streak</span></>}
                  </span>
                </div>
              </div>
              <div style={{ textAlign: "right" }}>
                <div style={{ fontSize: 10, color: "var(--text-3)", textTransform: "uppercase", letterSpacing: "0.06em" }}>Last absence</div>
                <div style={{ fontSize: 12, marginTop: 4 }}>
                  {a.lastAbsence ? (
                    <span>
                      <span className="mono" style={{ color: "var(--text)", fontWeight: 600 }}>{U.dayOfWeek(a.lastAbsence)}, {U.weekLabel(a.lastAbsence)}</span>
                      <span style={{ color: "var(--text-4)" }}> · {absAgo}</span>
                    </span>
                  ) : (
                    <span style={{ color: total > 0 ? "var(--money-pos)" : "var(--text-4)" }}>{total > 0 ? "None — perfect" : "—"}</span>
                  )}
                </div>
              </div>
            </div>
          );
        })()}
        {attendance.cells.length === 0 ? (
          <div className="help">No working days reported in this range.</div>
        ) : (
          <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
            {attendance.cells.map(c => (
              <div
                key={c.date}
                title={`${U.dayOfWeek(c.date)} ${U.shortDate(c.date)} — ${c.status}`}
                style={{
                  width: 16, height: 16, borderRadius: 3,
                  background: c.status === "present" ? "var(--money-pos)" : c.status === "absent" ? "var(--status-dnc-fg)" : "var(--bg-panel-2)",
                  border: "1px solid " + (c.status === "off" ? "var(--border-subtle)" : "transparent"),
                  opacity: c.status === "off" ? 0.6 : 0.9,
                }}
              />
            ))}
          </div>
        )}
      </div>

      {/* Coaching flags */}
      {flags.length > 0 && (
        <div className="card" style={{ padding: 16, marginBottom: 12 }}>
          <h3 style={{ margin: "0 0 10px", fontSize: 13, fontWeight: 600 }}>Coaching flags</h3>
          <div style={{ display: "flex", flexDirection: "column" }}>
            {flags.map((f, i) => (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, padding: "9px 0", borderTop: i === 0 ? "none" : "1px solid var(--border-subtle)" }}>
                <span style={{ width: 6, height: 6, borderRadius: 999, background: f.kind === "warn" ? "var(--status-dnc-fg)" : "var(--money-pos)", flexShrink: 0 }}/>
                <span style={{ fontSize: 12.5, color: "var(--text-2)" }}>{f.text}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Recent leads */}
      <div className="section-head" style={{ paddingTop: 6 }}>
        <h2>Leads</h2>
        <span className="sub">{agentLeads.length} in range{recent.length < agentLeads.length ? ` · showing latest ${recent.length}` : ""}</span>
      </div>
      {recent.length === 0 ? (
        <div className="empty"><h3>No leads in this range</h3><p>Pick a wider window to see this agent's calls.</p></div>
      ) : (
        <div className="table-wrap">
          <table className="table">
            <thead>
              <tr>
                <th style={{ width: 90 }}>Date</th>
                <th style={{ width: 50 }}>Day</th>
                <th>Customer</th>
                <th style={{ width: 120 }}>Status</th>
                <th style={{ width: 100 }}>Appt date</th>
                <th className="num" style={{ width: 90 }}>Client $</th>
              </tr>
            </thead>
            <tbody>
              {recent.map(l => (
                <tr key={l.id}>
                  <td className="num-l">{U.shortDate(l.date)}</td>
                  <td className="muted-2" style={{ fontSize: 11 }}>{U.dayOfWeek(l.date)}</td>
                  <td>{l.customer_name ? U.toProperCase(l.customer_name) : "—"}</td>
                  <td><Pill status={l.status}/></td>
                  <td className="num-l muted-2" style={{ fontSize: 11.5 }}>{l.appointment_date ? U.shortDate(l.appointment_date) : "—"}</td>
                  <td className="num"><Money v={l.client_commission} tone="pos"/></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}
