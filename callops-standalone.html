  <script type="text/babel">
// Agent Report — weekly per-agent breakdown
const { useState: useStateAR, useMemo: useMemoAR, useEffect: useEffectAR, useRef: useRefAR } = React;

function AgentReport({ campaign, agents, leads, onOpenAgent }) {

  const AR_PRESETS = [
    { key: "7d", label: "7d", days: 7 },
    { key: "30d", label: "30d", days: 30 },
    { key: "90d", label: "90d", days: 90 },
    { key: "all", label: "All", days: null },
  ];
  const [dayKey, setDayKey] = useStateAR("30d");
  const [dayOffset, setDayOffset] = useStateAR(0);
  const [customRange, setCustomRange] = useStateAR(null);
  const [pickerOpen, setPickerOpen] = useStateAR(false);
  const pickerBtnRef = useRefAR(null);
  const preset = AR_PRESETS.find(p => p.key === dayKey) || AR_PRESETS[1];
  const presetRange = useMemoAR(() => window.dayRange(preset.days, dayOffset), [preset.days, dayOffset]);
  const range = customRange
    ? { startISO: customRange.startISO, endISO: customRange.endISO, label: `${U.shortDate(customRange.startISO)} – ${U.shortDate(customRange.endISO)}` }
    : presetRange;

  // No cap — page freely backward into the past
  useEffectAR(() => {
    if (preset.days == null && dayOffset !== 0) setDayOffset(0);
  }, [preset.days]);

  const inRange = (d) => (preset.days == null && !customRange) || (d >= range.startISO && d <= range.endISO);

  // Per-agent summary
  const rows = useMemoAR(() => {
    const map = {};
    leads.forEach(l => {
      if (l.campaign_id !== campaign.id) return;
      if (!inRange(l.date)) return;
      const r = (map[l.agent_id] ||= { agent_id: l.agent_id, total: 0, pending: 0, transfer: 0, confirmed: 0, ia: 0, dnc: 0, bad: 0 });
      r.total++; r[l.status]++;
    });
    const list = agents
      .filter(a => a.campaign_id === campaign.id && a.status === "active")
      .map(a => {
        const r = map[a.id] || { total: 0, pending: 0, transfer: 0, confirmed: 0, ia: 0, dnc: 0, bad: 0 };
        // "Transferred" = every lead that left pending (transfer/ia/confirmed/dnc/bad).
        // Conversion is measured against what was transferred, not total leads.
        const transferred = r.total - r.pending;
        const conv = transferred > 0 ? (r.ia + r.confirmed) / transferred : 0;
        return { ...a, ...r, transferred, conv };
      });
    list.sort((a, b) => {
      const ca = a.ia + a.confirmed, cb = b.ia + b.confirmed;
      if (ca !== cb) return cb - ca;
      // Tiebreaker: higher conversion *rate* climbs higher when converted counts tie.
      return b.conv - a.conv;
    });
    return list;
  }, [agents, leads, campaign.id, range, preset.days, customRange]);

  // Weekly grid owns its own range — see <WeeklyGrid> below.

  return (
    <div className="tab-content">
      <div className="toolbar">
        <div>
          <h2 style={{ margin: 0, fontSize: 14, fontWeight: 600 }}>Agent Performance</h2>
          <div className="help" style={{ marginTop: 2 }}>
            Sorted by IAs + Confirms, with conversion rate as the tiebreaker. Agents with 5+ transferred and 0 conversions flagged.
          </div>
        </div>
        <div style={{ marginLeft: "auto", display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          {customRange ? (
            <>
              <button
                ref={pickerBtnRef}
                className="chip active"
                style={{ display: "inline-flex", alignItems: "center", gap: 6 }}
                onClick={() => setPickerOpen(o => !o)}
                title="Click to change dates"
              >
                <Icon name="calendar" size={11}/>
                {U.shortDate(customRange.startISO)} – {U.shortDate(customRange.endISO)}
              </button>
              <button className="icon-btn" title="Clear custom range" onClick={() => setCustomRange(null)}>
                <Icon name="x" size={12}/>
              </button>
            </>
          ) : (
            <>
              <RangeNav
                options={AR_PRESETS}
                value={dayKey}
                onChange={(k) => { setDayKey(k); setDayOffset(0); }}
                rangeLabel={range.label}
                canBack={preset.days != null}
                canForward={preset.days != null && dayOffset > 0}
                onBack={() => setDayOffset(o => o + 1)}
                onForward={() => setDayOffset(o => Math.max(0, o - 1))}
                onReset={() => setDayOffset(0)}
                canReset={dayOffset !== 0}
              />
              <button
                ref={pickerBtnRef}
                className="chip"
                style={{ display: "inline-flex", alignItems: "center", gap: 5 }}
                onClick={() => setPickerOpen(o => !o)}
              >
                <Icon name="calendar" size={11}/>
                Pick dates…
              </button>
            </>
          )}
          <DateRangePicker
            open={pickerOpen}
            onClose={() => setPickerOpen(false)}
            anchorRef={pickerBtnRef}
            value={customRange || (preset.days != null ? presetRange : null)}
            onChange={(r) => { setCustomRange(r); setDayOffset(0); }}
          />
        </div>
      </div>

      <div className="table-wrap">
        <table className="table">
          <thead>
            <tr>
              <th style={{ width: 280 }}>Agent</th>
              <th className="num" style={{ width: 80 }}>Total Leads</th>
              <th className="num" style={{ width: 80 }}>Pending</th>
              <th className="num" style={{ width: 95 }}>Transferred</th>
              <th className="num" style={{ width: 70 }}>IAs</th>
              <th className="num" style={{ width: 80 }}>Confirms</th>
              <th className="num" style={{ width: 90 }}>Converted</th>
              <th className="num" style={{ width: 70 }}>DNC</th>
              <th className="num" style={{ width: 80 }}>Conv%</th>
            </tr>
          </thead>
          <tbody>
            {rows.map(a => {
              const warn = a.transferred >= 5 && (a.ia + a.confirmed) === 0;
              return (
                <tr
                  key={a.id}
                  className={(warn ? "row-warn " : "") + "clickable"}
                  onClick={() => onOpenAgent && onOpenAgent(a.id)}
                  title="Open agent report"
                >
                  <td>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, minHeight: 20 }}>
                      <span>{a.full_name}</span>
                      {a.is_tl && <TLBadge small/>}
                      {warn && (
                        <span className="tag" style={{ color: "var(--status-dnc-fg)", borderColor: "var(--status-dnc-ring)", background: "var(--status-dnc-bg)" }}>
                          Needs attention
                        </span>
                      )}
                    </div>
                  </td>
                  <td className="num"><span className="money money-bold">{a.total || "—"}</span></td>
                  <td className="num"><span className={a.pending ? "money" : "money money-muted"}>{a.pending || "—"}</span></td>
                  <td className="num"><span className={a.transferred ? "money" : "money money-muted"} style={a.transferred ? { color: "var(--status-transfer-fg)" } : {}}>{a.transferred || "—"}</span></td>
                  <td className="num"><span className={a.ia ? "money money-tl" : "money money-muted"}>{a.ia || "—"}</span></td>
                  <td className="num"><span className={a.confirmed ? "money money-pos" : "money money-muted"}>{a.confirmed || "—"}</span></td>
                  <td className="num"><span className={(a.ia + a.confirmed) > 0 ? "money money-bold" : "money money-muted"}>{(a.ia + a.confirmed) || "—"}</span></td>
                  <td className="num"><span className={a.dnc > 0 ? "money" : "money money-muted"} style={a.dnc > 0 ? { color: "var(--status-dnc-fg)" } : {}}>{a.dnc || "—"}</span></td>
                  <td className="num">
                    <span className="money" style={{ color: a.conv >= 0.5 ? "var(--money-pos)" : a.conv > 0 ? "var(--text)" : "var(--text-4)" }}>
                      {a.transferred === 0 ? "—" : Math.round(a.conv * 100) + "%"}
                    </span>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {/* Weekly grid — owns its own time range; agent order mirrors the table above */}
      <WeeklyGrid
        campaign={campaign}
        leads={leads}
        agents={agents}
        order={rows.map(r => r.id)}
      />
    </div>
  );
}

// Weekly grid — self-contained: owns its own time range, calendar picker,
// presets, and pagination through the resulting weeks.
function WeeklyGrid({ campaign, leads, agents, order }) {
  const WG_PRESETS = [
    { key: "30d", label: "30d", days: 30 },
    { key: "90d", label: "90d", days: 90 },
    { key: "6m", label: "6mo", days: 180 },
    { key: "all", label: "All", days: null },
  ];
  const [wgKey, setWgKey] = useStateAR("90d");
  const [wgOffset, setWgOffset] = useStateAR(0);
  const [wgCustom, setWgCustom] = useStateAR(null);
  const [wgPickerOpen, setWgPickerOpen] = useStateAR(false);
  const wgPickerRef = useRefAR(null);
  const wgPreset = WG_PRESETS.find(p => p.key === wgKey) || WG_PRESETS[1];
  const wgPresetRange = useMemoAR(() => window.dayRange(wgPreset.days, wgOffset), [wgPreset.days, wgOffset]);
  const wgRange = wgCustom
    ? { startISO: wgCustom.startISO, endISO: wgCustom.endISO, label: `${U.shortDate(wgCustom.startISO)} – ${U.shortDate(wgCustom.endISO)}` }
    : wgPresetRange;

  useEffectAR(() => {
    if (wgPreset.days == null && wgOffset !== 0) setWgOffset(0);
  }, [wgPreset.days]);

  const wgInRange = (d) => (wgPreset.days == null && !wgCustom) || (d >= wgRange.startISO && d <= wgRange.endISO);

  const { weeks, grid, gridAgents } = useMemoAR(() => {
    // Track weeks by their Monday date (ISO string) — year-aware and sortable,
    // unlike a bare "WKnn" label which collides and mis-sorts across years.
    const weekMap = new Map();
    const seenAgents = new Set();
    const conv = {};
    const g = {};
    leads.forEach(l => {
      if (l.campaign_id !== campaign.id) return;
      if (!wgInRange(l.date)) return;
      const d = U.parseDate(l.date);
      if (!d) return;
      const monday = U.startOfWeek(d);
      const w = U.dayStr(monday);
      if (!weekMap.has(w)) {
        const sun = new Date(monday);
        sun.setDate(sun.getDate() + 6);
        weekMap.set(w, { key: w, label: U.weekLabel(l.date), start: w, end: U.dayStr(sun) });
      }
      seenAgents.add(l.agent_id);
      const k = l.agent_id + "|" + w;
      const c = (g[k] ||= { t: 0, i: 0, c: 0 });
      // t = Transferred (every non-pending lead); i and c are subsets of it.
      if (l.status !== "pending") c.t++;
      if (l.status === "ia") c.i++;
      if (l.status === "confirmed") c.c++;
      if (l.status === "ia" || l.status === "confirmed") conv[l.agent_id] = (conv[l.agent_id] || 0) + 1;
    });
    const weeksOut = Array.from(weekMap.values()).sort((a, b) => a.key < b.key ? -1 : a.key > b.key ? 1 : 0);
    // Mirror the Agent Performance table's exact order (conversion supremacy).
    // Falls back to in-grid IAs+Confirms if no order was supplied.
    const orderIdx = {};
    (order || []).forEach((id, i) => { orderIdx[id] = i; });
    const gridAgents = agents
      .filter(a => a.campaign_id === campaign.id && a.status === "active" && seenAgents.has(a.id))
      .sort((a, b) => {
        if (order && order.length) return (orderIdx[a.id] ?? 9999) - (orderIdx[b.id] ?? 9999);
        return (conv[b.id] || 0) - (conv[a.id] || 0);
      });
    return { weeks: weeksOut, grid: g, gridAgents };
  }, [leads, agents, campaign.id, wgRange, wgPreset.days, wgCustom, order]);

  // Show every week in range — the grid scrolls horizontally for long campaigns.
  const visible = weeks;

  return (
    <>
      <div className="section-head" style={{ paddingTop: 24, alignItems: "flex-end" }}>
        <div>
          <h2>Weekly Grid</h2>
          <span className="sub">Transferred · IAs · Confirms per week per agent</span>
        </div>
        <div style={{ marginLeft: "auto", display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          {wgCustom ? (
            <>
              <button
                ref={wgPickerRef}
                className="chip active"
                style={{ display: "inline-flex", alignItems: "center", gap: 6 }}
                onClick={() => setWgPickerOpen(o => !o)}
                title="Click to change dates"
              >
                <Icon name="calendar" size={11}/>
                {U.shortDate(wgCustom.startISO)} – {U.shortDate(wgCustom.endISO)}
              </button>
              <button className="icon-btn" title="Clear custom range" onClick={() => setWgCustom(null)}>
                <Icon name="x" size={12}/>
              </button>
            </>
          ) : (
            <>
              <RangeNav
                options={WG_PRESETS}
                value={wgKey}
                onChange={(k) => { setWgKey(k); setWgOffset(0); }}
                rangeLabel={wgRange.label}
                canBack={wgPreset.days != null}
                canForward={wgPreset.days != null && wgOffset > 0}
                onBack={() => setWgOffset(o => o + 1)}
                onForward={() => setWgOffset(o => Math.max(0, o - 1))}
                onReset={() => setWgOffset(0)}
                canReset={wgOffset !== 0}
              />
              <button
                ref={wgPickerRef}
                className="chip"
                style={{ display: "inline-flex", alignItems: "center", gap: 5 }}
                onClick={() => setWgPickerOpen(o => !o)}
              >
                <Icon name="calendar" size={11}/>
                Pick dates…
              </button>
            </>
          )}
          <DateRangePicker
            open={wgPickerOpen}
            onClose={() => setWgPickerOpen(false)}
            anchorRef={wgPickerRef}
            value={wgCustom || (wgPreset.days != null ? wgPresetRange : null)}
            onChange={(r) => { setWgCustom(r); setWgOffset(0); }}
          />
          {visible.length > 0 && (
            <span className="help" style={{ fontFamily: "Geist Mono, monospace", marginLeft: 4, paddingLeft: 10, borderLeft: "1px solid var(--border-subtle)" }}>
              {visible[0].label}{visible.length > 1 ? "–" + visible[visible.length - 1].label : ""}
              <span className="muted-2" style={{ marginLeft: 6 }}>· {visible.length} week{visible.length === 1 ? "" : "s"}</span>
            </span>
          )}
        </div>
      </div>

      <div className="card" style={{ padding: 12, overflowX: "auto" }}>
        {visible.length === 0 ? (
          <div className="help" style={{ padding: 12 }}>No weeks in this range.</div>
        ) : (
          <div style={{ display: "inline-grid", gridTemplateColumns: `180px repeat(${visible.length}, 100px)`, gap: 4 }}>
            <div style={{ fontSize: 11, color: "var(--text-3)", padding: "6px 4px", letterSpacing: "0.03em", textTransform: "uppercase" }}>Agent</div>
            {visible.map(w => (
              <div key={w.key} style={{ fontFamily: "Geist Mono, monospace", fontSize: 11, color: "var(--text-3)", padding: "6px 4px" }}>
                {w.label}
              </div>
            ))}
            {gridAgents.map(a => (
              <React.Fragment key={a.id}>
                <div style={{ padding: "6px 4px", fontSize: 12, color: "var(--text)", display: "flex", alignItems: "center" }}>
                  {a.full_name}{a.is_tl && <TLBadge small/>}
                </div>
                {visible.map(w => {
                  // Blank weeks before the agent was hired / after they left.
                  // Date comparison — year-aware, unlike bare week numbers.
                  if ((a.date_added && a.date_added > w.end) ||
                      (a.date_removed && a.date_removed < w.start)) {
                    return <div key={w.key}/>;
                  }
                  const c = grid[a.id + "|" + w.key] || { t: 0, i: 0, c: 0 };
                  const isEmpty = c.t + c.i + c.c === 0;
                  return (
                    <div key={w.key} className="weekly-cell" style={isEmpty ? { background: "transparent", border: "1px dashed var(--border-subtle)" } : {}}>
                      <div className="label">T · I · C</div>
                      <div className="nums">
                        <span className={c.t ? "n-t" : "n-zero"}>{c.t}</span>
                        <span className={c.i ? "n-i" : "n-zero"}>{c.i}</span>
                        <span className={c.c ? "n-c" : "n-zero"}>{c.c}</span>
                      </div>
                    </div>
                  );
                })}
              </React.Fragment>
            ))}
          </div>
        )}
      </div>
    </>
  );
}

Object.assign(window, { AgentReport });

</script>
  <script type="text/babel">
// Floor Report — weekly trend + daily floor stats (attendance lives in its own tab)
const { useState: useStateFR, useMemo: useMemoFR, useEffect: useEffectFR, useRef: useRefFR } = React;

function FloorReport({ campaign, agents, leads, shiftLogs, attendanceOverrides, onLogShift }) {
  // Daily Stats date range
  const DAILY_PRESETS = [
    { key: "7d", label: "7d", days: 7 },
    { key: "30d", label: "30d", days: 30 },
    { key: "90d", label: "90d", days: 90 },
    { key: "all", label: "All", days: null },
  ];
  const [dailyKey, setDailyKey] = useStateFR("all");
  const [dailyOffset, setDailyOffset] = useStateFR(0);
  const [customRange, setCustomRange] = useStateFR(null);
  const [pickerOpen, setPickerOpen] = useStateFR(false);
  const pickerBtnRef = useRefFR(null);
  // Default: count every agent who worked, regardless of current roster status —
  // historical floor counts should reflect who was actually there.
  const [showAllAgents, setShowAllAgents] = useStateFR(true);
  const dailyPreset = DAILY_PRESETS.find(p => p.key === dailyKey) || DAILY_PRESETS[1];
  const presetRange = useMemoFR(() => window.dayRange(dailyPreset.days, dailyOffset), [dailyPreset.days, dailyOffset]);
  const dailyRange = customRange
    ? { startISO: customRange.startISO, endISO: customRange.endISO, label: `${U.shortDate(customRange.startISO)} – ${U.shortDate(customRange.endISO)}` }
    : presetRange;

  useEffectFR(() => {
    if (dailyPreset.days == null && dailyOffset !== 0) setDailyOffset(0);
  }, [dailyPreset.days]);

  // Daily aggregation — filtered by date range. On Floor is auto-computed from
  // attendance (count of agents with status="present" for that date).
  const days = useMemoFR(() => {
    const inRange = (d) => (dailyPreset.days == null && !customRange) || (d >= dailyRange.startISO && d <= dailyRange.endISO);
    const camAgents = agents.filter(a => a.campaign_id === campaign.id && (showAllAgents || a.status === "active"));
    // Ground-truth attendance from Derek's daily reports (data.js).
    const present = {};
    const reportDays = new Set();
    ((window.MOCK_DATA && window.MOCK_DATA.attendance) || []).forEach(r => {
      if (r.campaign_id !== campaign.id) return;
      present[r.agent_id + "|" + r.date] = true;
      reportDays.add(r.date);
    });
    const statusFor = (agent, date) => {
      const key = agent.id + "|" + date;
      const ov = attendanceOverrides && attendanceOverrides[key];
      if (ov) return ov;
      if (agent.date_added && date < agent.date_added) return "off";
      if (agent.date_removed && date > agent.date_removed) return "off";
      if (!reportDays.has(date)) return "off";
      return present[key] ? "present" : "absent";
    };
    const presentCountForDate = (date) => {
      let n = 0;
      camAgents.forEach(a => { if (statusFor(a, date) === "present") n++; });
      return n;
    };

    const map = {};
    leads.filter(l => l.campaign_id === campaign.id).forEach(l => {
      if (!inRange(l.date)) return;
      const r = (map[l.date] ||= { date: l.date, total: 0, pending: 0, transfer: 0, confirmed: 0, ia: 0, dnc: 0, bad: 0 });
      r.total++; r[l.status]++;
    });
    // Also surface days with attendance overrides but no leads
    Object.keys(attendanceOverrides || {}).forEach(k => {
      const [, date] = k.split("|");
      if (!date || !inRange(date)) return;
      if (!map[date]) map[date] = { date, total: 0, pending: 0, transfer: 0, confirmed: 0, ia: 0, dnc: 0, bad: 0 };
    });
    Object.values(map).forEach(r => { r.on_floor = presentCountForDate(r.date); });
    return Object.values(map).sort((a, b) => b.date.localeCompare(a.date));
  }, [leads, agents, attendanceOverrides, campaign.id, dailyRange, dailyPreset.days, customRange, showAllAgents]);

  return (
    <div className="tab-content">
      {/* Weekly rollup + lifetime totals — defaults to All here */}
      <WeeklyStats campaign={campaign} leads={leads} shiftLogs={shiftLogs} agents={agents} attendanceOverrides={attendanceOverrides} defaultPresetKey="all" includeInactiveAgents={showAllAgents} />
      <div style={{ height: 22 }}/>

      {/* Daily Stats */}
      <div className="section-head" style={{ alignItems: "flex-end" }}>
        <div>
          <h2>Daily Floor Stats</h2>
          <span className="sub">Lead flow vs agents on floor · {days.length} day{days.length === 1 ? "" : "s"} with activity in range</span>
        </div>
        <div style={{ marginLeft: "auto", display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          {customRange ? (
            <>
              <button
                ref={pickerBtnRef}
                className="chip active"
                style={{ display: "inline-flex", alignItems: "center", gap: 6 }}
                onClick={() => setPickerOpen(o => !o)}
                title="Click to change dates"
              >
                <Icon name="calendar" size={11}/>
                {U.shortDate(customRange.startISO)} – {U.shortDate(customRange.endISO)}
              </button>
              <button className="icon-btn" title="Clear custom range" onClick={() => setCustomRange(null)}>
                <Icon name="x" size={12}/>
              </button>
            </>
          ) : (
            <>
              <RangeNav
                options={DAILY_PRESETS}
                value={dailyKey}
                onChange={(k) => { setDailyKey(k); setDailyOffset(0); }}
                rangeLabel={dailyRange.label}
                canBack={dailyPreset.days != null}
                canForward={dailyPreset.days != null && dailyOffset > 0}
                onBack={() => setDailyOffset(o => o + 1)}
                onForward={() => setDailyOffset(o => Math.max(0, o - 1))}
                onReset={() => setDailyOffset(0)}
                canReset={dailyOffset !== 0}
              />
              <button
                ref={pickerBtnRef}
                className="chip"
                style={{ display: "inline-flex", alignItems: "center", gap: 5 }}
                onClick={() => setPickerOpen(o => !o)}
              >
                <Icon name="calendar" size={11}/>
                Pick dates…
              </button>
            </>
          )}
          <DateRangePicker
            open={pickerOpen}
            onClose={() => setPickerOpen(false)}
            anchorRef={pickerBtnRef}
            value={customRange || (dailyPreset.days != null ? presetRange : null)}
            onChange={(r) => { setCustomRange(r); setDailyOffset(0); }}
          />
          <button
            className={"chip" + (showAllAgents ? " active" : "")}
            onClick={() => setShowAllAgents(v => !v)}
            title="Include inactive / terminated agents in the floor counts"
          >
            {showAllAgents ? "All agents" : "Active only"}
          </button>
        </div>
      </div>

      {/* Shift logger removed — On Floor is now auto-derived from the Attendance tab */}
      <div className="help" style={{ marginBottom: 12, fontSize: 11 }}>
        <Icon name="check" size={11} style={{ verticalAlign: "-1px", color: "var(--money-pos)", marginRight: 4 }}/>
        <span>On Floor counts each day's <strong style={{ color: "var(--text-2)" }}>present</strong> agents — take attendance in the <strong style={{ color: "var(--text)" }}>Attendance</strong> tab and this report updates automatically.</span>
      </div>

      <div className="table-wrap">
        <table className="table">
          <thead>
            <tr>
              <th style={{ width: 90 }}>Date</th>
              <th style={{ width: 50 }}>Day</th>
              <th className="num" style={{ width: 90 }}>On Floor</th>
              <th className="num" style={{ width: 90 }}>Total Leads</th>
              <th className="num" style={{ width: 80 }}>Pending</th>
              <th className="num" style={{ width: 95 }}>Transferred</th>
              <th className="num" style={{ width: 70 }}>IAs</th>
              <th className="num" style={{ width: 80 }}>Confirms</th>
              <th className="num" style={{ width: 70 }}>DNC</th>
              <th className="num" style={{ width: 110 }}>Lead : Agent</th>
            </tr>
          </thead>
          <tbody>
            {days.map(d => {
              const ratio = d.on_floor && d.on_floor > 0 ? d.total / d.on_floor : null;
              const dow = U.parseDate(d.date).getDay();
              const isWeekend = dow === 0 || dow === 6;
              // Transferred = every non-pending lead (transfer + ia + confirmed + dnc + bad).
              const transferred = d.total - d.pending;
              let ratioCls = "";
              if (ratio != null && ratio >= 2.0) ratioCls = "row-good";
              return (
                <tr key={d.date} className={ratioCls}>
                  <td className="num-l">{U.shortDate(d.date)}</td>
                  <td className="muted-2" style={{ fontSize: 11 }}>
                    <span style={{ color: isWeekend ? "var(--text-4)" : "var(--text-3)" }}>{U.dayOfWeek(d.date)}</span>
                  </td>
                  <td className="num">
                    {d.on_floor != null ? (
                      <span className="money money-bold">{d.on_floor}</span>
                    ) : <span className="money money-muted">—</span>}
                  </td>
                  <td className="num"><span className="money money-bold">{d.total || "—"}</span></td>
                  <td className="num"><span className={d.pending ? "money" : "money money-muted"}>{d.pending || "—"}</span></td>
                  <td className="num"><span className={transferred ? "money" : "money money-muted"} style={transferred ? { color: "var(--status-transfer-fg)" } : {}}>{transferred || "—"}</span></td>
                  <td className="num"><span className={d.ia ? "money money-tl" : "money money-muted"}>{d.ia || "—"}</span></td>
                  <td className="num"><span className={d.confirmed ? "money money-pos" : "money money-muted"}>{d.confirmed || "—"}</span></td>
                  <td className="num"><span className={d.dnc ? "money" : "money money-muted"} style={d.dnc ? { color: "var(--status-dnc-fg)" } : {}}>{d.dnc || "—"}</span></td>
                  <td className="num">
                    {ratio != null ? (
                      <span className="money money-bold">{ratio.toFixed(2)}</span>
                    ) : <span className="money money-muted">—</span>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

Object.assign(window, { FloorReport });

</script>
  <script type="text/babel">
// Attendance — its own tab, dedicated to taking attendance for managers
const { useState: useStateATT, useMemo: useMemoATT, useEffect: useEffectATT } = React;

// Inline-editable agent name cell: click the name to rename, Enter/blur saves.
function EditableAgentName({ agent, onUpdateAgent }) {
  const [editing, setEditing] = useStateATT(false);
  const [val, setVal] = useStateATT(agent.full_name);
  const save = () => {
    const name = val.trim();
    if (name && name !== agent.full_name) onUpdateAgent(agent.id, { full_name: name });
    else setVal(agent.full_name);
    setEditing(false);
  };
  if (editing) {
    return (
      <input
        className="input"
        style={{ maxWidth: 240, padding: "4px 8px" }}
        value={val}
        autoFocus
        onChange={(e) => setVal(e.target.value)}
        onBlur={save}
        onKeyDown={(e) => {
          if (e.key === "Enter") save();
          if (e.key === "Escape") { setVal(agent.full_name); setEditing(false); }
        }}
      />
    );
  }
  return (
    <span
      style={{ cursor: "pointer" }}
      title="Click to rename"
      onClick={() => { setVal(agent.full_name); setEditing(true); }}
    >
      {agent.full_name}
    </span>
  );
}

function Attendance({ campaign, agents, leads, attendanceOverrides, onSetAttendance, onAddAgent, onUpdateAgent }) {
  const [attDays, setAttDays] = useStateATT(14);
  const [attOffset, setAttOffset] = useStateATT(0);

  const dateCols = useMemoATT(() => {
    const out = [];
    for (let i = 0; i < attDays; i++) {
      const d = new Date(window.MOCK_TODAY);
      d.setDate(d.getDate() - i - attOffset);
      out.push(U.dayStr(d));
    }
    return out;
  }, [attDays, attOffset]);

  const rangeLabel = useMemoATT(() => {
    if (!dateCols.length) return "";
    const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const last = U.parseDate(dateCols[0]);
    const first = U.parseDate(dateCols[dateCols.length - 1]);
    const sameMonth = first.getMonth() === last.getMonth() && first.getFullYear() === last.getFullYear();
    if (sameMonth) return `${MONTHS[first.getMonth()]} ${first.getDate()}–${last.getDate()}, ${last.getFullYear()}`;
    return `${MONTHS[first.getMonth()]} ${first.getDate()} – ${MONTHS[last.getMonth()]} ${last.getDate()}, ${last.getFullYear()}`;
  }, [dateCols]);

  // Earliest date the board may scroll back to — campaign start, or the first
  // agent hire date if that predates it.
  const campaignStart = useMemoATT(() => {
    let earliest = campaign.created_at || U.dayStr(window.MOCK_TODAY);
    agents.forEach(a => {
      if (a.campaign_id === campaign.id && a.date_added && a.date_added < earliest) earliest = a.date_added;
    });
    return earliest;
  }, [agents, campaign.id, campaign.created_at]);
  const maxOffset = useMemoATT(() => {
    const totalDays = Math.round((U.parseDate(U.dayStr(window.MOCK_TODAY)) - U.parseDate(campaignStart)) / 86400000);
    return Math.max(0, totalDays - (attDays - 1));
  }, [campaignStart, attDays]);
  useEffectATT(() => {
    if (attOffset > maxOffset) setAttOffset(maxOffset);
  }, [maxOffset]);

  // Active agents only by default (clean for day-to-day attendance). The
  // "All agents" toggle adds inactive/terminated agents below the active block.
  const [showInactive, setShowInactive] = useStateATT(false);
  const campaignAgents = useMemoATT(() => {
    let list = agents.filter(a => a.campaign_id === campaign.id && a.status !== "removed");
    if (!showInactive) list = list.filter(a => a.status === "active");
    return list;
  }, [agents, campaign.id, showInactive]);

  // ---- Roster (active first, then inactive; alumni separate) ----
  const [newAgent, setNewAgent] = useStateATT("");
  const [showAlumni, setShowAlumni] = useStateATT(false);
  const rosterAgents = useMemoATT(() =>
    agents
      .filter(a => a.campaign_id === campaign.id && a.status !== "removed")
      .sort((a, b) => (a.status === "active" ? 0 : 1) - (b.status === "active" ? 0 : 1)),
    [agents, campaign.id]);
  const removedAgents = useMemoATT(() => agents.filter(a => a.campaign_id === campaign.id && a.status === "removed"), [agents, campaign.id]);
  const [rosterSearch, setRosterSearch] = useStateATT("");
  const rosterQ = rosterSearch.trim().toLowerCase();
  const rosterFiltered = rosterQ ? rosterAgents.filter(a => (a.full_name || "").toLowerCase().includes(rosterQ)) : rosterAgents;
  const rosterActive = rosterAgents.filter(a => a.status === "active").length;

  const attMap = useMemoATT(() => {
    const m = {};
    // Ground-truth attendance from Derek's daily reports (data.js). A day with
    // no report = non-working day → everyone "off".
    const present = {};
    const reportDays = new Set();
    ((window.MOCK_DATA && window.MOCK_DATA.attendance) || []).forEach(r => {
      if (r.campaign_id !== campaign.id) return;
      present[r.agent_id + "|" + r.date] = true;
      reportDays.add(r.date);
    });
    campaignAgents.forEach(a => {
      dateCols.forEach(d => {
        const key = a.id + "|" + d;
        const override = attendanceOverrides[key];
        if (override) m[key] = { status: override, auto: false };
        else if (a.date_added && d < a.date_added) m[key] = { status: "off", auto: true, preHire: true };
        else if (a.date_removed && d > a.date_removed) m[key] = { status: "off", auto: true, postTerm: true };
        else if (!reportDays.has(d)) m[key] = { status: "off", auto: true };
        else if (present[key]) m[key] = { status: "present", auto: true };
        else m[key] = { status: "absent", auto: true };
      });
    });
    return m;
  }, [campaignAgents, dateCols, campaign.id, attendanceOverrides]);

  const attSummary = useMemoATT(() => {
    return campaignAgents.map(a => {
      let p = 0, ab = 0, off = 0, leadsCount = 0;
      dateCols.forEach(d => {
        const s = attMap[a.id + "|" + d]?.status;
        if (s === "present") p++;
        else if (s === "absent") ab++;
        else off++;
      });
      leads.forEach(l => {
        if (l.campaign_id === campaign.id && l.agent_id === a.id && dateCols.includes(l.date)) leadsCount++;
      });
      const pct = (p + ab) > 0 ? p / (p + ab) : 0;
      const avg = p > 0 ? leadsCount / p : 0;
      return { ...a, present: p, absent: ab, off, pct, avg, leadsCount };
    }).sort((a, b) => {
      const ra = a.status === "active" ? 0 : 1, rb = b.status === "active" ? 0 : 1;
      if (ra !== rb) return ra - rb;
      // Sort by age on the campaign: earliest start date (most senior) first.
      // Agents with no recorded start date sort last.
      const da = a.date_added || "9999-99-99";
      const db = b.date_added || "9999-99-99";
      if (da !== db) return da < db ? -1 : 1;
      return (a.full_name || "").localeCompare(b.full_name || "");
    });
  }, [campaignAgents, dateCols, attMap, leads, campaign.id]);

  const rollup = useMemoATT(() => {
    let p = 0, ab = 0;
    attSummary.forEach(a => { p += a.present; ab += a.absent; });
    const pct = (p + ab) > 0 ? p / (p + ab) : 0;
    return { p, ab, pct };
  }, [attSummary]);

  const pctColor = rollup.pct >= 0.85 ? "var(--money-pos)"
    : rollup.pct >= 0.7 ? "var(--money-spiff)"
    : rollup.pct > 0 ? "var(--status-dnc-fg)"
    : "var(--text-3)";
  const pctTone = rollup.pct >= 0.85 ? "Strong"
    : rollup.pct >= 0.7 ? "Watch"
    : rollup.pct > 0 ? "Critical"
    : "—";

  const cycleAttendance = (agentId, date) => {
    const cur = attMap[agentId + "|" + date]?.status || "absent";
    const next = cur === "present" ? "absent" : cur === "absent" ? "off" : "present";
    onSetAttendance(agentId, date, next);
  };

  const markAllPresentForDate = (date) => {
    campaignAgents.forEach(a => {
      if (a.date_added && date < a.date_added) return;
      if (a.date_removed && date > a.date_removed) return;
      const cur = attMap[a.id + "|" + date]?.status;
      if (cur !== "present") onSetAttendance(a.id, date, "present");
    });
  };
  return (
    <div className="tab-content">
      {/* Header */}
      <div style={{
        display: "flex",
        alignItems: "flex-end",
        justifyContent: "space-between",
        gap: 18,
        flexWrap: "wrap",
        marginBottom: 16,
        paddingBottom: 16,
        borderBottom: "1px solid var(--border-subtle)",
      }}>
        <div style={{ display: "flex", alignItems: "flex-end", gap: 20, flexWrap: "wrap" }}>
          <div>
            <div style={{ fontSize: 11, color: "var(--text-3)", textTransform: "uppercase", letterSpacing: "0.06em", fontWeight: 600 }}>
              Attendance
            </div>
            <h2 style={{ margin: "4px 0 0", fontSize: 22, fontWeight: 600, letterSpacing: "-0.02em", lineHeight: 1.1 }}>
              {campaignAgents.length} agent{campaignAgents.length === 1 ? "" : "s"}
              <span style={{ color: "var(--text-3)", fontWeight: 400, marginLeft: 8, fontSize: 14 }}>
                {rangeLabel}
              </span>
            </h2>
          </div>

          {/* Floor attendance gauge */}
          <div style={{
            display: "flex", flexDirection: "column", gap: 6,
            minWidth: 200,
            padding: "10px 14px",
            border: "1px solid var(--border)",
            borderRadius: 10,
            background: "var(--bg-panel)",
          }}>
            <div className="row" style={{ justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontSize: 10, color: "var(--text-3)", textTransform: "uppercase", letterSpacing: "0.06em", fontWeight: 600 }}>Floor attendance</span>
              <span className="mono" style={{ fontSize: 10, color: pctColor, fontWeight: 600 }}>{pctTone}</span>
            </div>
            <div className="row" style={{ alignItems: "baseline", gap: 8 }}>
              <span className="mono" style={{ fontSize: 28, fontWeight: 600, color: pctColor, letterSpacing: "-0.03em", lineHeight: 1 }}>
                {Math.round(rollup.pct * 100)}<span style={{ fontSize: 14, color: "var(--text-3)", marginLeft: 1 }}>%</span>
              </span>
              <span style={{ fontSize: 11, color: "var(--text-4)", fontFamily: "Geist Mono, monospace" }}>
                {rollup.p}/{rollup.p + rollup.ab}
              </span>
            </div>
            <div style={{ height: 4, background: "var(--bg-panel-2)", borderRadius: 2, overflow: "hidden" }}>
              <div style={{ width: Math.max(2, rollup.pct * 100) + "%", height: "100%", background: pctColor }}/>
            </div>
          </div>
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
          <RangeNav
            options={[{ key: "7", label: "7d" }, { key: "14", label: "14d" }, { key: "30", label: "30d" }]}
            value={String(attDays)}
            onChange={(k) => { setAttDays(Number(k)); setAttOffset(0); }}
            rangeLabel={rangeLabel}
            canBack={attOffset < maxOffset}
            canForward={attOffset > 0}
            onBack={() => setAttOffset(o => Math.min(maxOffset, o + attDays))}
            onForward={() => setAttOffset(o => Math.max(0, o - attDays))}
            onReset={() => setAttOffset(0)}
            canReset={attOffset !== 0}
          />
          <button
            className={"chip" + (showInactive ? " active" : "")}
            onClick={() => setShowInactive(v => !v)}
            title="Include inactive / terminated agents"
          >
            {showInactive ? "All agents" : "Active only"}
          </button>
        </div>
      </div>

      <div className="help" style={{ marginBottom: 12 }}>
        Click a cell to toggle present → absent → off · click a date header to mark everyone present · lime ring = auto-detected
      </div>

      <div className="att-grid">
        <div className="att-scroll">
          <table className="att-table">
            <thead>
              <tr>
                <th>Agent</th>
                {[...dateCols].reverse().map((d, i, arr) => {
                  const dt = U.parseDate(d);
                  const prev = i > 0 ? U.parseDate(arr[i - 1]) : null;
                  const newMonth = !prev || prev.getMonth() !== dt.getMonth();
                  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
                  const isToday = U.dayStr(window.MOCK_TODAY) === d;
                  return (
                    <th
                      key={d}
                      style={newMonth && i > 0 ? { borderLeft: "2px solid var(--border)" } : {}}
                      title="Click to mark all agents present for this day"
                      onClick={() => markAllPresentForDate(d)}
                    >
                      {newMonth && (
                        <div style={{ fontSize: 9, color: "var(--accent)", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 1, fontWeight: 600 }}>
                          {MONTHS[dt.getMonth()]}
                        </div>
                      )}
                      <div style={{ color: isToday ? "var(--accent)" : "var(--text)", fontWeight: isToday ? 600 : 400 }}>{dt.getDate()}</div>
                      <div style={{ fontSize: 9, color: "var(--text-4)", marginTop: 1 }}>{U.dayOfWeek(d).charAt(0)}</div>
                    </th>
                  );
                })}
                <th style={{ position: "sticky", right: 0, minWidth: 90, borderLeft: "1px solid var(--border)" }}>
                  Att %
                </th>
              </tr>
            </thead>
            <tbody>
              {attSummary.map(a => {
                let pctCls = "";
                if (a.pct < 0.6) pctCls = "att-warn-red";
                else if (a.pct < 0.8) pctCls = "att-warn-amber";
                return (
                  <tr key={a.id} style={a.status !== "active" ? { opacity: 0.5 } : {}}>
                    <td>
                      <span>{a.full_name}</span>
                      {a.is_tl && <TLBadge small/>}
                    </td>
                    {[...dateCols].reverse().map((d, i, arr) => {
                      const cell = attMap[a.id + "|" + d];
                      const s = cell?.status;
                      const cls = "att-cell att-" + s + (cell?.auto ? " att-auto" : "");
                      const glyph = s === "present" ? "✓" : s === "absent" ? "✗" : "—";
                      const prev = i > 0 ? U.parseDate(arr[i - 1]) : null;
                      const dt = U.parseDate(d);
                      const newMonth = prev && prev.getMonth() !== dt.getMonth();
                      return (
                        <td key={d} style={newMonth ? { borderLeft: "2px solid var(--border)" } : {}}>
                          <span className={cls} onClick={() => cycleAttendance(a.id, d)}>{glyph}</span>
                        </td>
                      );
                    })}
                    <td style={{ position: "sticky", right: 0, borderLeft: "1px solid var(--border)" }} className="num-l">
                      <span className={"money money-bold " + pctCls}>{Math.round(a.pct * 100)}%</span>
                      <div style={{ fontSize: 10, color: "var(--text-4)" }}>{a.present}/{a.present + a.absent}</div>
                    </td>
                  </tr>
                );
              })}

        </span>

      {/* Agent roster */}
      <div style={{ marginTop: 28, paddingTop: 20, borderTop: "1px solid var(--border-subtle)" }}>

            </div>
          </div>
          <div className="search-wrap" style={{ maxWidth: 240 }}>

              className="input"
              placeholder="Search roster…"

              onChange={(e) => setRosterSearch(e.target.value)}

        <div className="card" style={{ padding: 0 }}>

            <input
              className="input"
              placeholder="Add agent by name…"
              value={newAgent}
              onChange={(e) => setNewAgent(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === "Enter" && newAgent.trim()) {
                  onAddAgent(newAgent.trim(), false);
                  setNewAgent("");

            />
            <button

          <table className="table" style={{ borderRadius: 0 }}>

                <th style={{ width: 125 }}>Started</th>
                <th style={{ width: 125 }}>Terminated</th>
                <th style={{ width: 170, textAlign: "right" }}>Actions</th>

            </thead>
            <tbody>
              {rosterFiltered.map(a => (
                <tr key={a.id}>
                  <td><EditableAgentName agent={a} onUpdateAgent={onUpdateAgent}/></td>
                  <td>
                    {a.status === "active"
                      ? <span className="tag" style={{ color: "var(--money-pos)", borderColor: "var(--accent-line)", background: "var(--accent-soft)" }}>Active</span>
                      : <span className="tag tag-inactive">Inactive</span>}

                  <td>{a.is_tl ? <span className="tag tag-tl">★ TL</span> : <span className="tag">Agent</span>}</td>
                  <td><DatePicker value={a.date_added || ""} onChange={(v) => onUpdateAgent(a.id, { date_added: v })}/></td>

                  <td style={{ textAlign: "right" }}>
                    <button className="btn btn-sm btn-ghost" onClick={() => onUpdateAgent(a.id, { is_tl: !a.is_tl })}>
                      {a.is_tl ? "Remove TL" : "Make TL"}

                    <button className="btn btn-sm btn-ghost" onClick={() => onUpdateAgent(a.id, { status: "removed" })} style={{ color: "var(--status-dnc-fg)" }}>
                      Remove
                    </button>
                  </td>
                </tr>
              ))}
              {rosterFiltered.length === 0 && (
                <tr><td colSpan={6} style={{ textAlign: "center", padding: 24 }} className="muted">{rosterQ ? "No agents match your search." : "No agents on roster."}</td></tr>
              )}
            </tbody>
          </table>

          {removedAgents.length > 0 && (
            <div style={{ borderTop: "1px solid var(--border-subtle)" }}>
              <button
                className="btn btn-ghost"
                style={{ width: "100%", justifyContent: "flex-start", padding: "10px 14px", borderRadius: 0, height: "auto" }}
                onClick={() => setShowAlumni(s => !s)}
              >
                <Icon name={showAlumni ? "chevron" : "chevronRight"} size={12}/>

              </button>
              {showAlumni && (
                <table className="table" style={{ borderRadius: 0 }}>
                  <tbody>
                    {removedAgents.map(a => (
                      <tr key={a.id} style={{ opacity: 0.7 }}>
                        <td>{a.full_name}</td>
                        <td style={{ textAlign: "right" }}>
                          <button className="btn btn-sm" onClick={() => onUpdateAgent(a.id, { status: "active" })}>
                            <Icon name="refresh" size={12}/> Reactivate
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { Attendance });

</script>
  <script type="text/babel">
// Settings — campaign config + agent roster
const { useState: useStateST, useMemo: useMemoST } = React;

function Settings({ campaign, agents, profile, onUpdateCampaign, onExport, onDeleteCampaign, leadsCount }) {
  const [form, setForm] = useStateST({ ...campaign });
  const [savedFlash, setSavedFlash] = useStateST(false);
  const dirty = Object.keys(form).some(k => form[k] !== campaign[k]);

  const [confirmReset, setConfirmReset] = useStateST(false);
  const [confirmDelete, setConfirmDelete] = useStateST(false);
  const [deleteText, setDeleteText] = useStateST("");

  const update = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const updateNum = (k, v) => setForm(f => ({ ...f, [k]: Math.max(0, Number(v) || 0) }));

  const save = () => {
    onUpdateCampaign(form);
    setSavedFlash(true);
    setTimeout(() => setSavedFlash(false), 1400);
  };

  return (
    <div className="tab-content">
      {/* General */}
      <div className="settings-grid" style={{ marginBottom: 24 }}>
        <div className="label-col">
          <h4>General</h4>
          <p>Campaign name and product appear across reports.</p>
        </div>
        <div className="card" style={{ padding: 16 }}>
          <div className="row-2">
            <div className="field">
              <label>Campaign name</label>
              <input className="input" value={form.name} onChange={(e) => update("name", e.target.value)}/>
            </div>
            <div className="field">
              <label>Product</label>
              <input className="input" value={form.client} onChange={(e) => update("client", e.target.value)}/>
            </div>
          </div>
        </div>
      </div>

      {/* Commission rates */}
      <div className="settings-grid" style={{ marginBottom: 24 }}>
        <div className="label-col">
          <h4>Commission rates</h4>
          <p>What the client pays per lead outcome. IA tiers stack daily per agent.</p>
        </div>
        <div className="card" style={{ padding: 16 }}>
          <div className="row-3">
            <div className="field">
              <label>$ per Transfer</label>
              <div className="field-money">
                <input className="input" type="number" min="0" value={form.rate_transfer} onChange={(e) => updateNum("rate_transfer", e.target.value)}/>
              </div>
            </div>
            <div className="field">
              <label>$ per Confirmed</label>
              <div className="field-money">
                <input className="input" type="number" min="0" value={form.rate_confirmed} onChange={(e) => updateNum("rate_confirmed", e.target.value)}/>
              </div>
            </div>
            <div className="field">
              <label>$ per IA (1st)</label>
              <div className="field-money">
                <input className="input" type="number" min="0" value={form.rate_ia} onChange={(e) => updateNum("rate_ia", e.target.value)}/>
              </div>
            </div>
          </div>
          <div className="row-2" style={{ marginTop: 12 }}>
            <div className="field">
              <label>IA Tier 2 — total for 2 IAs same day, same agent</label>
              <div className="field-money">
                <input className="input" type="number" min="0" value={form.ia_tier_2} onChange={(e) => updateNum("ia_tier_2", e.target.value)}/>
              </div>
              <div className="help">2nd IA pays <span className="mono">{U.fmtMoney(Math.max(0, form.ia_tier_2 - form.rate_ia))}</span></div>
            </div>
            <div className="field">
              <label>IA Tier 3 — total for 3 IAs same day</label>
              <div className="field-money">
                <input className="input" type="number" min="0" value={form.ia_tier_3} onChange={(e) => updateNum("ia_tier_3", e.target.value)}/>
              </div>
              <div className="help">3rd IA pays <span className="mono">{U.fmtMoney(Math.max(0, form.ia_tier_3 - form.ia_tier_2))}</span></div>
            </div>
          </div>
          <div className="row" style={{ marginTop: 14, gap: 8 }}>
            <button className="btn btn-primary" onClick={save} disabled={!dirty && !savedFlash}>
              {savedFlash ? <><Icon name="check" size={12}/> Saved</> : dirty ? "Save changes" : "No changes"}
            </button>
            {dirty && (
              <button className="btn btn-ghost" onClick={() => setForm({ ...campaign })}>Discard</button>
            )}
            <div className="help" style={{ marginLeft: "auto" }}>
              Changing rates recomputes all existing leads.
            </div>
          </div>
        </div>
      </div>

      {/* Data management */}
      <div className="settings-grid">
        <div className="label-col">
          <h4>Data management</h4>
          <p>Backups, restore, and danger zone.</p>
        </div>
        <div className="card" style={{ padding: 16 }}>
          <div className="row" style={{ gap: 8, flexWrap: "wrap" }}>
            <button className="btn" onClick={onExport}>
              <Icon name="download" size={12}/> Export all data (JSON)
            </button>
            <button className="btn">
              <Icon name="refresh" size={12}/> Import backup
            </button>
          </div>
          <div className="help" style={{ marginTop: 12 }}>
            Export gives you a snapshot of all leads, agents, shifts, and settings for this campaign.
          </div>

          {profile?.role === "admin" ? (
          <div style={{
            marginTop: 18,
            padding: 14,
            border: "1px solid var(--status-dnc-ring)",
            background: "rgba(251, 113, 133, 0.04)",
            borderRadius: "var(--radius)"
          }}>
            <div style={{ fontSize: 12, fontWeight: 600, color: "var(--status-dnc-fg)", textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 10 }}>
              Danger zone
            </div>
            <div className="spread" style={{ marginBottom: 10 }}>
              <div>
                <div style={{ fontSize: 12.5, color: "var(--text)", fontWeight: 500 }}>Reset campaign data</div>
                <div className="help" style={{ marginTop: 2 }}>
                  Clears all <span className="mono" style={{ color: "var(--text-2)" }}>{leadsCount}</span> leads, shift logs, and attendance. Agents and rates stay.
                </div>
              </div>
              <button className="btn btn-danger" onClick={() => setConfirmReset(true)}>
                <Icon name="refresh" size={12}/> Reset data
              </button>
            </div>
            <div className="spread" style={{ paddingTop: 10, borderTop: "1px solid var(--border-subtle)" }}>
              <div>
                <div style={{ fontSize: 12.5, color: "var(--text)", fontWeight: 500 }}>Delete this campaign</div>
                <div className="help" style={{ marginTop: 2 }}>
                  Permanently deletes <strong style={{ color: "var(--text-2)" }}>{campaign.name}</strong>, all its agents, leads, and history. This cannot be undone.
                </div>
              </div>
              <button className="btn btn-danger" onClick={() => { setConfirmDelete(true); setDeleteText(""); }}>
                <Icon name="trash" size={12}/> Delete campaign
              </button>
            </div>
          </div>
          ) : (
            <div className="help" style={{
              marginTop: 18,
              padding: "10px 12px",
              background: "var(--bg-panel-2)",
              border: "1px solid var(--border-subtle)",
              borderRadius: "var(--radius-sm)"
            }}>
              Resetting or deleting a campaign is restricted to admins. Ask your admin if you need this.
            </div>
          )}
        </div>
      </div>

      {confirmReset && (
        <Modal
          open
          onClose={() => setConfirmReset(false)}
          title="Reset this campaign?"
          width="440px"
          footer={
            <>
              <button className="btn" onClick={() => setConfirmReset(false)}>Cancel</button>
              <button className="btn btn-danger" onClick={() => setConfirmReset(false)}>
                Yes, reset (demo)
              </button>
            </>
          }
        >
          <p style={{ margin: 0, fontSize: 13, color: "var(--text-2)" }}>
            This will delete all leads, shift logs, and attendance records for <strong>{campaign.name}</strong>. Agents and commission settings are kept.
          </p>
          <p style={{ marginTop: 10, marginBottom: 0, fontSize: 12, color: "var(--text-3)" }}>
            (In this prototype, the demo data won't actually be deleted.)
          </p>
        </Modal>
      )}

      {confirmDelete && (
        <Modal
          open
          onClose={() => setConfirmDelete(false)}
          title="Delete this campaign?"
          width="480px"
          footer={
            <>
              <button className="btn" onClick={() => setConfirmDelete(false)}>Cancel</button>
              <button
                className="btn btn-danger"
                disabled={deleteText !== campaign.name}
                style={deleteText !== campaign.name ? { opacity: 0.4, cursor: "not-allowed" } : {}}
                onClick={() => {
                  if (deleteText === campaign.name) {
                    onDeleteCampaign && onDeleteCampaign();
                  }
                }}
              >
                <Icon name="trash" size={12}/> Permanently delete
              </button>
            </>
          }
        >
          <p style={{ margin: 0, fontSize: 13, color: "var(--text-2)" }}>
            This will permanently delete <strong>{campaign.name}</strong> and everything tied to it: <span className="mono" style={{ color: "var(--text-2)" }}>{leadsCount}</span> leads, all agents, shift logs, attendance, and settings. <strong style={{ color: "var(--status-dnc-fg)" }}>This cannot be undone.</strong>
          </p>
          <div className="field" style={{ marginTop: 16 }}>
            <label>Type <span className="mono" style={{ color: "var(--text)" }}>{campaign.name}</span> to confirm</label>
            <input
              className="input"
              autoFocus
              value={deleteText}
              onChange={(e) => setDeleteText(e.target.value)}
              placeholder={campaign.name}
            />
          </div>
        </Modal>
      )}
    </div>
  );
}

Object.assign(window, { Settings });

</script>

                    {isSuspended && <span className="tag" style={{ color: "var(--status-dnc-fg)", borderColor: "var(--status-dnc-ring)", background: "var(--status-dnc-bg)" }}>● suspended</span>}

function InviteUserModal({ campaigns, onClose, onSave }) {
  const [form, setForm] = useStateAD({
    full_name: "",
    email: "",
    role: "manager",
    campaign_ids: [],
    password: "",
  });
  const [busy, setBusy] = useStateAD(false);
  const [err, setErr] = useStateAD(null);
  const update = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const toggleCampaign = (cid) => {
    setForm(f => ({
      ...f,
      campaign_ids: f.campaign_ids.includes(cid)
        ? f.campaign_ids.filter(x => x !== cid)
        : [...f.campaign_ids, cid]
    }));
  };
  const canSave = form.full_name.trim() && form.email.includes("@") && form.password.length >= 6;

  const submit = async () => {
    if (!canSave || busy) return;
    setBusy(true); setErr(null);
    const res = await onSave(form);
    if (res && res.ok) { onClose(); }
    else { setErr((res && res.error) || "Something went wrong."); setBusy(false); }
  };

  return (
    <Modal
      open
      onClose={onClose}
      title="Invite a new user"
      width="540px"
      footer={
        <>
          <button className="btn" onClick={onClose} disabled={busy}>Cancel</button>
          <button className="btn btn-primary" onClick={submit} disabled={!canSave || busy}>
            {busy ? "Creating…" : "Create account"}
          </button>
        </>
      }
    >
      <div className="stack">
        <div className="row-2">
          <div className="field">
            <label>Full name</label>
            <input className="input" autoFocus value={form.full_name} onChange={(e) => update("full_name", e.target.value)} placeholder="e.g. Devon Reyes"/>
          </div>
          <div className="field">
            <label>Email</label>
            <input className="input" type="email" value={form.email} onChange={(e) => update("email", e.target.value)} placeholder="devon@callops.io"/>
          </div>
        </div>
        <div className="field">
          <label>Password</label>
          <input className="input" type="text" value={form.password} onChange={(e) => update("password", e.target.value)} placeholder="Set their password — min 6 characters"/>
          <div className="help" style={{ marginTop: 2 }}>You choose the password and share it with them. They sign in with it as-is.</div>
        </div>
        <div className="field">
          <label>Role</label>
          <div className="filter-chips" style={{ alignSelf: "flex-start" }}>
            {[
              ["manager", "Manager", "Can manage assigned campaigns only"],
              ["admin", "Admin", "Full access to everything"],
              ["viewer", "Viewer", "Read-only access (e.g. accountants)"],
            ].map(([k, label, sub]) => (
              <button
                key={k}
                className={"chip" + (form.role === k ? " active" : "")}
                onClick={() => update("role", k)}
                title={sub}
                type="button"
              >{label}</button>
            ))}
          </div>
          <div className="help" style={{ marginTop: 2 }}>
            {form.role === "admin" && "Full access to all campaigns, users, and settings."}
            {form.role === "manager" && "Can manage leads/agents for assigned campaigns only."}
            {form.role === "viewer" && "Read-only commission sheet access. Useful for accountants."}
          </div>
        </div>

        {form.role !== "admin" && (
          <div className="field">
            <label>Assign to campaigns</label>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 2 }}>
              {campaigns.map(c => (
                <button
                  key={c.id}
                  className={"chip" + (form.campaign_ids.includes(c.id) ? " active" : "")}
                  type="button"
                  onClick={() => toggleCampaign(c.id)}
                  style={{
                    border: "1px solid var(--border)",
                    background: form.campaign_ids.includes(c.id) ? "var(--accent-soft)" : "var(--bg-elev)",
                    color: form.campaign_ids.includes(c.id) ? "var(--accent)" : "var(--text-2)",
                  }}
                >
                  {form.campaign_ids.includes(c.id) && <Icon name="check" size={11}/>}
                  {c.name}
                </button>
              ))}
            </div>
            {form.campaign_ids.length === 0 && (
              <div className="help" style={{ marginTop: 4, color: "var(--money-spiff)" }}>
                ⚠ No campaigns selected — they won't see anything until you assign at least one.
              </div>
            )}

        )}

        <div className="help" style={{
          background: "var(--bg-panel-2)",
          padding: "10px 12px",
          borderRadius: "var(--radius-sm)",
          border: "1px solid var(--border-subtle)",
        }}>
          This creates a ready-to-use login. Give <strong style={{ color: "var(--text-2)" }}>{form.email || "their email"}</strong> their email + password — they sign in at your CallOps URL right away.
        </div>
        {err && (
          <div className="help" style={{ color: "var(--status-dnc-fg, #ef4444)" }}>{err}</div>
        )}
      </div>
    </Modal>
  );

const AUDIT_CATEGORIES = [
  ["all", "All", null],
  ["auth", "Auth", "Sign in / out"],
  ["leads", "Leads", null],
  ["agents", "Agents", null],
  ["campaigns", "Campaigns", null],
  ["floor", "Floor", "Shifts & attendance"],
  ["users", "Users", null],
];

function AuditTab({ auditLog, campaigns, users }) {
  const [cat, setCat] = useStateAD("all");
  const [search, setSearch] = useStateAD("");
  const [range, setRange] = useStateAD("7"); // days

  const filtered = useMemoAD(() => {
    let arr = auditLog;
    if (cat !== "all") arr = arr.filter(e => e.category === cat);
    if (range !== "all") {
      const days = Number(range);
      const cutoff = new Date(window.MOCK_TODAY.getTime() - days * 86400000);
      arr = arr.filter(e => new Date(e.ts) >= cutoff);
    }
    if (search.trim()) {
      const q = search.toLowerCase();
      arr = arr.filter(e =>
        e.description.toLowerCase().includes(q) ||
        e.actor_name.toLowerCase().includes(q) ||
        (e.campaign_name || "").toLowerCase().includes(q)
      );
    }
    return arr;
  }, [auditLog, cat, search, range]);

  const catCounts = useMemoAD(() => {
    const c = { all: auditLog.length };
    auditLog.forEach(e => { c[e.category] = (c[e.category] || 0) + 1; });
    return c;
  }, [auditLog]);

  // Group by day for readability
  const grouped = useMemoAD(() => {
    const m = {};
    filtered.forEach(e => {
      const day = e.ts.slice(0, 10);
      (m[day] ||= []).push(e);
    });
    return Object.entries(m).sort((a, b) => b[0].localeCompare(a[0]));
  }, [filtered]);

  return (
    <>
      <div className="toolbar" style={{ paddingBottom: 8 }}>
        <div className="filter-chips">
          {AUDIT_CATEGORIES.map(([k, label, sub]) => (
            <button
              key={k}
              className={"chip" + (cat === k ? " active" : "")}
              onClick={() => setCat(k)}
              title={sub || ""}
            >
              {label}
              <span className="ct">{catCounts[k] || 0}</span>
            </button>
          ))}
        </div>
        <div className="search-wrap">
          <Icon name="search"/>
          <input
            className="input"
            placeholder="Search actor, action, target…"
            value={search}
            onChange={(e) => setSearch(e.target.value)}
          />
        </div>
        <div style={{ marginLeft: "auto", display: "flex", gap: 8, alignItems: "center" }}>
          <span className="help">Range:</span>
          <div className="filter-chips">
            {[["1","Today"], ["7","7d"], ["30","30d"], ["all","All"]].map(([k, l]) => (
              <button key={k} className={"chip" + (range === k ? " active" : "")} onClick={() => setRange(k)}>{l}</button>
            ))}
          </div>
        </div>
      </div>
      <div className="help" style={{ marginBottom: 12 }}>
        Showing <span className="mono" style={{ color: "var(--text)" }}>{filtered.length}</span> of{" "}
        <span className="mono" style={{ color: "var(--text)" }}>{auditLog.length}</span> events.
        Auto-saved · not editable.
      </div>

      {grouped.length === 0 ? (
        <div className="empty">
          <h3>No events match these filters</h3>
          <p>Try a wider time range or different category.</p>
        </div>
      ) : (
        <div className="card" style={{ padding: 0 }}>
          {grouped.map(([day, entries], gi) => (
            <div key={day} style={{ borderTop: gi === 0 ? "none" : "1px solid var(--border-subtle)" }}>
              <div style={{
                position: "sticky", top: 0,
                background: "var(--bg-panel-2)",
                padding: "6px 14px",
                fontSize: 11,
                color: "var(--text-3)",
                textTransform: "uppercase",
                letterSpacing: "0.05em",
                fontWeight: 500,
                borderBottom: "1px solid var(--border-subtle)",
                zIndex: 1,
              }}>
                {U.dayOfWeekFull(day)} · {U.shortDate(day)} <span className="muted-2" style={{ marginLeft: 6 }}>· {entries.length}</span>
              </div>
              {entries.map(e => <AuditRow key={e.id} entry={e}/>)}
            </div>
          ))}
        </div>
      )}
    </>
  );
}

// ============================ PERMISSIONS TAB ============================
function PermissionsTab({ rolePerms, onUpdateRolePerms }) {
  const ROLES = ["admin", "manager", "viewer"];
  const groups = window.groupPerms();
  const groupOrder = ["Access", "Daily ops", "Campaign", "Users"];

  const getVal = (role, key) => {
    const overrides = rolePerms[role] || {};
    if (key in overrides) return overrides[key];
    return window.ROLE_DEFAULTS[role]?.[key] ?? false;
  };

  const toggle = (role, key) => {
    onUpdateRolePerms(role, key, !getVal(role, key));
  };

  const resetRole = (role) => {
    onUpdateRolePerms(role, "__reset__", null);
  };

  // Count: how many perms differ from defaults per role
  const driftCount = (role) => {
    const ov = rolePerms[role] || {};
    let n = 0;
    window.PERMS.forEach(p => {
      if (p.key in ov && ov[p.key] !== window.ROLE_DEFAULTS[role][p.key]) n++;
    });
    return n;
  };

  return (
    <>
      <div className="help" style={{ marginBottom: 14 }}>
        Toggle what each role can do by default. Per-user overrides (in the Users tab → Edit) take precedence. Admins automatically have everything unless you explicitly remove permissions.
      </div>

      <div className="card" style={{ padding: 0, overflow: "hidden" }}>
        {/* Header */}
        <div className="perm-header">
          <div>Permission</div>
          {ROLES.map(r => {
            const drift = driftCount(r);
            return (
              <div key={r} className="perm-role-col">
                <div className="row" style={{ justifyContent: "center", gap: 6 }}>
                  <span className={"tag" + (r === "admin" ? " tag-admin" : "")} style={r === "admin" ? {} : { color: "var(--text-2)", textTransform: "capitalize" }}>{r}</span>
                  {drift > 0 && (
                    <button className="btn btn-sm btn-ghost" onClick={() => resetRole(r)} title="Reset to default" style={{ padding: "2px 6px", height: 18, fontSize: 10 }}>
                      <Icon name="refresh" size={9}/> reset
                    </button>
                  )}
                </div>
              </div>
            );
          })}
        </div>

        {/* Groups */}
        {groupOrder.map(g => (
          <div key={g}>
            <div className="perm-group-head">{g}</div>
            {(groups[g] || []).map(p => (
              <div key={p.key} className="perm-row">
                <div className="perm-meta">
                  <div className="perm-name">{p.label}</div>
                  <div className="perm-desc">{p.desc}</div>
                </div>
                {ROLES.map(r => {
                  const v = getVal(r, p.key);
                  const overridden = (rolePerms[r] || {})[p.key] !== undefined
                    && (rolePerms[r] || {})[p.key] !== window.ROLE_DEFAULTS[r][p.key];
                  return (
                    <div key={r} className="perm-role-col">
                      <button
                        type="button"
                        className={"perm-toggle" + (v ? " on" : "") + (overridden ? " overridden" : "")}
                        onClick={() => toggle(r, p.key)}
                        title={overridden ? "Differs from default" : (v ? "Enabled" : "Disabled")}
                        aria-label={`${p.label} for ${r}`}
                      >
                        <span className="perm-knob"/>
                      </button>
                    </div>
                  );
                })}
              </div>
            ))}
          </div>
        ))}
      </div>
    </>
  );
}

// ============================ USER PERMISSION OVERRIDES (inside EditUserModal) ============================
function UserPermissionOverrides({ user, rolePerms, userOverrides, onChange }) {
  const userOv = (userOverrides[user.id] || {});
  const groups = window.groupPerms();
  const groupOrder = ["Access", "Daily ops", "Campaign", "Users"];

  const roleDefault = (key) => {
    const role = user.role;
    const rolePermOverrides = rolePerms[role] || {};
    if (key in rolePermOverrides) return rolePermOverrides[key];
    return window.ROLE_DEFAULTS[role]?.[key] ?? false;
  };

  const effective = (key) => {
    if (key in userOv) return userOv[key];
    return roleDefault(key);
  };

  const setOverride = (key, val) => {
    onChange({ ...userOv, [key]: val });
  };
  const clearOverride = (key) => {
    const next = { ...userOv };
    delete next[key];
    onChange(next);
  };

  const overrideCount = Object.keys(userOv).length;

  return (
    <div>
      <div className="row" style={{ marginBottom: 8 }}>
        <strong style={{ fontSize: 12.5 }}>Permission overrides</strong>
        <span className="help" style={{ marginLeft: "auto" }}>
          {overrideCount > 0 ? (
            <>
              <span className="mono" style={{ color: "var(--accent)" }}>{overrideCount}</span> override{overrideCount === 1 ? "" : "s"}
              <button type="button" className="btn btn-sm btn-ghost" onClick={() => onChange({})} style={{ marginLeft: 6, padding: "2px 8px", height: 20 }}>
                Reset all
              </button>
            </>
          ) : (
            <span className="muted-2">Following <strong style={{ color: "var(--text-3)" }}>{user.role}</strong> role defaults</span>
          )}
        </span>
      </div>

      <div style={{
        border: "1px solid var(--border-subtle)",
        borderRadius: "var(--radius-sm)",
        overflow: "hidden",
        background: "var(--bg-panel)",
        maxHeight: 320,
        overflowY: "auto"
      }}>
        {groupOrder.map(g => (
          <div key={g}>
            <div className="perm-group-head" style={{ padding: "6px 12px", fontSize: 10 }}>{g}</div>
            {(groups[g] || []).map(p => {
              const isOverride = p.key in userOv;
              const eff = effective(p.key);
              const def = roleDefault(p.key);
              return (
                <div key={p.key} style={{
                  display: "grid",
                  gridTemplateColumns: "1fr auto auto",
                  alignItems: "center",
                  gap: 10,
                  padding: "8px 12px",
                  borderTop: "1px solid var(--border-subtle)",
                  fontSize: 12,
                }}>
                  <div style={{ minWidth: 0 }}>
                    <div style={{ color: "var(--text)" }}>{p.label}</div>
                    <div className="help" style={{ marginTop: 1, fontSize: 11 }}>
                      Default: <span style={{ color: def ? "var(--money-pos)" : "var(--text-3)" }}>{def ? "allowed" : "denied"}</span>
                    </div>
                  </div>
                  {isOverride && (
                    <button type="button" className="btn btn-sm btn-ghost" onClick={() => clearOverride(p.key)} title="Use role default" style={{ padding: "2px 6px", height: 20, fontSize: 10 }}>
                      <Icon name="refresh" size={10}/> default
                    </button>
                  )}
                  {!isOverride && <span/>}
                  <button
                    type="button"
                    className={"perm-toggle" + (eff ? " on" : "") + (isOverride ? " overridden" : "")}
                    onClick={() => setOverride(p.key, !eff)}
                  >
                    <span className="perm-knob"/>
                  </button>
                </div>
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

Object.assign(window, { AdminTools, UserPermissionOverrides });

</script>
